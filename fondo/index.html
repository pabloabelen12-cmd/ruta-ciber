<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva pestaña</title>
<meta name="theme-color" content="#030806">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23030806'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='30' font-weight='700' text-anchor='middle' fill='%233EE58F'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030806; --acc:#3EE58F; --acc2:#9DFFC8; --cyan:#5ED6EE; --dim:#5f7d6c; --line:rgba(62,229,143,.22);
  --panel:rgba(3,12,8,.58); --f:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#d8f5e4;font-family:var(--f);overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#back{filter:blur(1.1px);opacity:.9}
.fx{position:fixed;inset:0;pointer-events:none}
.vignette{background:radial-gradient(ellipse at 50% 45%,rgba(3,8,6,0) 0%,rgba(3,8,6,.15) 45%,rgba(3,8,6,.85) 100%)}
.center-glow{background:radial-gradient(ellipse 38% 30% at 50% 46%,rgba(3,8,6,.78) 0%,rgba(3,8,6,.45) 55%,rgba(3,8,6,0) 100%)}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px);mix-blend-mode:multiply}
.sweep{background:linear-gradient(to bottom,rgba(62,229,143,0),rgba(62,229,143,.05) 50%,rgba(62,229,143,0));height:28vh;animation:sweep 9s linear infinite}
@keyframes sweep{from{transform:translateY(-30vh)}to{transform:translateY(130vh)}}
main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
html.still .sweep{display:none}
.center-glow{background:radial-gradient(ellipse 30% 22% at 50% 50%,rgba(3,8,6,.55) 0%,rgba(3,8,6,.25) 60%,rgba(3,8,6,0) 100%)}
.sites{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;max-width:760px;pointer-events:auto}
.site{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;width:92px;text-decoration:none;color:#cdeedb;font-size:12px}
.tile{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;background:rgba(3,14,9,.55);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .15s,border-color .15s,box-shadow .15s}
.tile img{width:40px;height:40px;border-radius:9px}
.tile .ltr{font-size:28px;font-weight:800;color:var(--acc)}
.site:hover .tile,.site:focus-visible .tile{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 0 22px rgba(62,229,143,.35),0 8px 30px rgba(0,0,0,.45)}
.site:focus-visible{outline:none}
.site span.n{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000}
.del{position:absolute;top:-6px;right:2px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#06130d;color:#cdeedb;font:inherit;font-size:13px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.site:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:#ff6b8a;border-color:#ff6b8a}
.add .tile{border-style:dashed;background:rgba(3,14,9,.3)} .add .tile .ltr{font-weight:300;color:var(--dim)} .add{opacity:.55;cursor:pointer;background:none;border:0;font:inherit;font-size:12px;color:#cdeedb;padding:0}
.add:hover{opacity:1}
.form{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));padding:18px;border-radius:14px;background:rgba(4,16,10,.92);border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.6);display:none;flex-direction:column;gap:10px;pointer-events:auto;font-size:13px}
.form.open{display:flex}
.form input{background:#020805;border:1px solid var(--line);border-radius:8px;color:#eafff3;font:inherit;padding:10px 12px;outline:0}
.form input:focus{border-color:var(--acc)}
.form .row{display:flex;gap:8px;justify-content:flex-end}
.form button{font:inherit;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:#cdeedb}
.form button.ok{background:var(--acc);color:#02130a;border-color:var(--acc);font-weight:600}
body.wall main{display:none}
</style>
</head>
<body>
<canvas id="back" aria-hidden="true"></canvas>
<canvas id="front" aria-hidden="true"></canvas>
<div class="fx center-glow"></div>
<div class="fx vignette"></div>
<div class="fx scan"></div>
<div class="fx sweep"></div>

<main>
  <nav class="sites" id="sites" aria-label="Sitios fijos"></nav>
</main>
<form class="form" id="form" autocomplete="off">
  <b style="color:var(--acc)">añadir sitio</b>
  <input id="fname" placeholder="nombre (ej. WhatsApp)" maxlength="24" aria-label="Nombre">
  <input id="furl" placeholder="dirección (ej. web.whatsapp.com)" aria-label="Dirección" required>
  <div class="row"><button type="button" id="fcancel">cancelar</button><button type="submit" class="ok">añadir</button></div>
</form>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const WALL = qs.has("wall");           // ?wall → solo el fondo (para captura)
  const STATIC = qs.has("static");        // ?static → congelar tras simular
  // La animación es lo que pidió: se mantiene aunque Windows tenga desactivados los efectos de animación.
  const reduce = false;
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  /* ── Sitios fijos ── */
  const body = document.body;
  if (WALL) body.classList.add("wall");
  const DEFAULT_SITES = [
    { n: "YouTube", u: "https://www.youtube.com/" },
    { n: "TikTok", u: "https://www.tiktok.com/" },
    { n: "Instagram", u: "https://www.instagram.com/" }
  ];
  let sites; try { sites = JSON.parse(store.get("fondo.sites")); } catch (e) {}
  if (!Array.isArray(sites)) sites = DEFAULT_SITES.slice();
  const saveSites = () => store.set("fondo.sites", JSON.stringify(sites));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const host = u => { try { return new URL(u).hostname; } catch (e) { return ""; } };
  const sitesEl = document.getElementById("sites");
  function renderSites() {
    sitesEl.innerHTML = sites.map((s, i) => `<a class="site" href="${esc(s.u)}" title="${esc(s.u)}">
        <span class="tile"><img alt="" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(s.u))}&sz=128" data-l="${esc((s.n || host(s.u) || "?")[0].toUpperCase())}"></span>
        <span class="n">${esc(s.n || host(s.u))}</span>
        <button class="del" type="button" data-i="${i}" aria-label="Quitar ${esc(s.n)}" title="quitar">×</button></a>`).join("")
      + `<button class="site add" type="button" id="addbtn" aria-label="Añadir sitio"><span class="tile"><span class="ltr">+</span></span><span class="n">añadir</span></button>`;
    sitesEl.querySelectorAll("img").forEach(img => img.addEventListener("error", () => { const l = document.createElement("span"); l.className = "ltr"; l.textContent = img.dataset.l; img.replaceWith(l); }, { once: true }));
  }
  sitesEl.addEventListener("click", e => {
    const d = e.target.closest(".del");
    if (d) { e.preventDefault(); e.stopPropagation(); sites.splice(+d.dataset.i, 1); saveSites(); renderSites(); return; }
    if (e.target.closest("#addbtn")) { form.classList.add("open"); fname.value = ""; furl.value = ""; furl.focus(); }
  });
  const form = document.getElementById("form"), fname = document.getElementById("fname"), furl = document.getElementById("furl");
  document.getElementById("fcancel").onclick = () => form.classList.remove("open");
  form.addEventListener("submit", e => {
    e.preventDefault();
    let u = furl.value.trim(); if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    if (!host(u)) { furl.focus(); return; }
    const n = fname.value.trim() || (p => p[Math.max(0, p.length - 2)])(host(u).split(".")).replace(/^./, c => c.toUpperCase());
    sites.push({ n, u }); saveSites(); renderSites(); form.classList.remove("open");
  });
  addEventListener("keydown", e => { if (e.key === "Escape") form.classList.remove("open"); });
  renderSites();

  /* ── Lluvia de código en 3 capas ── */
  const GLYPHS = ("ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ" + "0123456789ABCDEF" + "<>/{}[]$#*+=:;").split("");
  const backC = document.getElementById("back"), frontC = document.getElementById("front");
  const bctx = backC.getContext("2d"), fctx = frontC.getContext("2d");
  const LAYERS = [
    { ctx: bctx, size: 12, speed: 0.30, alpha: 0.42, trail: 26, dens: 0.65, col: [46, 160, 104] },
    { ctx: fctx, size: 17, speed: 0.50, alpha: 0.78, trail: 22, dens: 0.7, col: [62, 229, 143] },
    { ctx: fctx, size: 26, speed: 0.80, alpha: 1.00, trail: 18, dens: 0.22, col: [92, 245, 165] }
  ];
  let W = 0, H = 0, DPR = 1;

  function makeAtlas(L) {
    const s = Math.round(L.size * DPR), cell = Math.ceil(s * 1.25), pad = Math.ceil(s * 0.6);
    const box = cell + pad * 2;
    const mk = (fill, glow) => {
      const c = document.createElement("canvas"); c.width = box * GLYPHS.length; c.height = box;
      const x = c.getContext("2d");
      x.font = `600 ${s}px "JetBrains Mono", "MS Gothic", monospace`; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillStyle = fill; if (glow) { x.shadowColor = glow; x.shadowBlur = s * 0.7; }
      GLYPHS.forEach((g, k) => x.fillText(g, k * box + box / 2, box / 2));
      return c;
    };
    const [r, g, b] = L.col;
    L.box = box; L.step = s * 1.05; L.colW = s * 0.95;
    L.body = mk(`rgb(${r},${g},${b})`, L.size > 20 ? `rgba(${r},${g},${b},.55)` : null);
    L.head = mk("#eafff3", "rgba(157,255,200,.95)");
    L.cyan = mk("#5ED6EE", "rgba(94,214,238,.6)");
  }
  function makeDrops(L) {
    const cols = Math.ceil(W / L.colW) + 1, rows = Math.ceil(H / L.step) + 1;
    L.rows = rows; L.drops = [];
    for (let c = 0; c < cols; c++) {
      if (Math.random() > L.dens) continue;
      L.drops.push(newDrop(L, c, true));
    }
  }
  function newDrop(L, c, initial) {
    const len = Math.round(L.trail * (0.6 + Math.random() * 0.8));
    return {
      c, x: c * L.colW + L.colW / 2,
      y: initial ? Math.random() * (L.rows + len) - len : -Math.random() * L.rows * 0.6,
      v: L.speed * (0.6 + Math.random() * 0.8), len,
      g: Array.from({ length: len + 2 }, () => (Math.random() * GLYPHS.length) | 0),
      cyan: Math.random() < 0.06
    };
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth * DPR; H = innerHeight * DPR;
    for (const c of [backC, frontC]) { c.width = W; c.height = H; }
    LAYERS.forEach(L => { makeAtlas(L); makeDrops(L); });
  }

  function drawLayer(L, dt) {
    const ctx = L.ctx, box = L.box, half = box / 2;
    for (const d of L.drops) {
      d.y += d.v * dt;
      if (Math.random() < 0.04 * dt) d.g[(Math.random() * d.g.length) | 0] = (Math.random() * GLYPHS.length) | 0;
      const headRow = Math.floor(d.y);
      if (headRow - d.len > L.rows) { Object.assign(d, newDrop(L, d.c, false)); continue; }
      for (let k = 0; k < d.len; k++) {
        const row = headRow - k; if (row < 0 || row > L.rows) continue;
        const gi = d.g[(row % d.g.length + d.g.length) % d.g.length];
        const t = k / d.len;
        ctx.globalAlpha = L.alpha * (k === 0 ? 1 : Math.pow(1 - t, 1.6) * 0.95);
        const atlas = k === 0 ? L.head : (d.cyan && k < 3 ? L.cyan : L.body);
        ctx.drawImage(atlas, gi * box, 0, box, box, d.x - half, row * L.step - half, box, box);
      }
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now(), acc = 0, running = true;
  const FRAME = 1000 / 30;
  function frame(now) {
    if (!running) return;
    const elapsed = now - last; last = now; acc += elapsed;
    if (acc >= FRAME) {
      const dt = Math.min(acc / FRAME, 3); acc = 0;
      bctx.clearRect(0, 0, W, H); fctx.clearRect(0, 0, W, H);
      drawLayer(LAYERS[0], dt); drawLayer(LAYERS[1], dt); drawLayer(LAYERS[2], dt);
    }
    requestAnimationFrame(frame);
  }
  function simulate(n) { for (let k = 0; k < n; k++) LAYERS.forEach(L => L.drops.forEach(d => { d.y += d.v; })); }

  function start() {
    resize();
    if (STATIC || reduce) {
      document.documentElement.classList.add("still");
      simulate(STATIC ? 80 : 40);
      bctx.clearRect(0, 0, W, H); fctx.clearRect(0, 0, W, H);
      LAYERS.forEach(L => drawLayer(L, 0));
      document.documentElement.dataset.ready = "1";
      return;
    }
    requestAnimationFrame(t => { last = t; frame(t); });
    document.documentElement.dataset.ready = "1";
  }
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (STATIC || reduce) LAYERS.forEach(L => drawLayer(L, 0)); }, 150); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) running = false;
    else if (!running && !STATIC && !reduce) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start);
})();
</script>
</body>
</html>
