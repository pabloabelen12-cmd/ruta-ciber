<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050A08">
<meta name="description" content="Tu ruta de ciberseguridad en 4 fases.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta Ciber">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none}</style>
</head>
<body>
<title>Ruta Ciber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: consola de un solo tema oscuro (elección deliberada: estética de terminal). Barra lateral en escritorio, barra inferior en el teléfono; contenido en una columna de lectura. */
:root{
  color-scheme:dark;
  --bg:#050A08; --panel:#09110D; --surface:#0C1611; --surface2:#11201A; --line:#1B3227; --line2:#2A4B3A;
  --ink:#D6ECDF; --muted:#86A894; --dim:#557564;
  --acc:#3EE58F; --acc-ink:#03140A; --acc-soft:rgba(62,229,143,.11); --acc-glow:rgba(62,229,143,.42);
  --flag:#FFB547; --flag-soft:rgba(255,181,71,.12);
  --cyan:#5ED6EE; --cyan-soft:rgba(94,214,238,.11);
  --warn:#F2D14B; --warn-soft:rgba(242,209,75,.11);
  --bad:#FF6170; --bad-soft:rgba(255,97,112,.12);
  --c-school:#55697A; --c-study:#3EE58F; --c-sleep:#8C7CF0; --c-gym:#5ED6EE; --c-review:#FFB547; --c-free:#1E3328;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(62,229,143,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(62,229,143,.03) 1px,transparent 1px);background-size:32px 32px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.5}
a{color:var(--acc)}
::selection{background:var(--acc);color:var(--acc-ink)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-mono);line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;color:var(--acc);text-shadow:0 0 18px var(--acc-glow)}
h1 .cur{display:inline-block;width:.55em;height:1em;background:var(--acc);margin-left:6px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:700}
p{margin:0}
ul{margin:0;padding-left:20px}
code,.mono{font-family:var(--f-mono)}
code{font-size:.88em;color:var(--cyan);background:var(--cyan-soft);padding:1px 5px;border-radius:3px}
b{color:#EFFAF3;font-weight:600}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--f-mono);padding:0 8px;display:flex;flex-direction:column;gap:4px}
.brand pre{margin:0;font-size:10.5px;line-height:1.15;color:var(--acc);text-shadow:0 0 10px var(--acc-glow)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:14px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;color:var(--muted);text-decoration:none;border:1px solid transparent}
.nav a::before{content:"  ";white-space:pre;color:var(--acc)}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a.on{color:var(--acc);background:var(--acc-soft);border-color:var(--line2)}
.nav a.on::before{content:"> "}
.nav .badge{margin-left:auto;font-size:11px;background:var(--flag);color:#1A1000;border-radius:3px;padding:0 6px;font-weight:700}
.sync{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 8px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;margin-top:4px}
.dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}
main{min-width:0;padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.eyebrow::before{content:"// ";color:var(--dim)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.head{display:flex;flex-direction:column;gap:8px}
.prompt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prompt .u{color:var(--acc)} .prompt .h{color:var(--cyan)}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;animation:typing .9s steps(18) both}
@keyframes typing{from{max-width:0}to{max-width:30ch}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.term{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px rgba(62,229,143,.06),0 10px 40px rgba(0,0,0,.45)}
.term-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.term-bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.term-bar i:nth-child(1){background:#FF6170}.term-bar i:nth-child(2){background:#F2D14B}.term-bar i:nth-child(3){background:#3EE58F}
.term-bar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.term.hot{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 32px rgba(62,229,143,.18)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:24px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 15px;border-radius:4px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink);transition:background .15s,box-shadow .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 0 16px rgba(62,229,143,.28)}
.btn.primary:hover{box-shadow:0 0 26px rgba(62,229,143,.5)}
.btn.flagbtn{background:var(--flag);border-color:var(--flag);color:#1A1000;box-shadow:0 0 16px rgba(255,181,71,.28)}
.btn.ghost{border-color:transparent;color:var(--acc);padding-inline:6px}
.btn.ghost:hover{background:transparent;text-decoration:underline}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--acc-soft);color:var(--acc);border-color:rgba(62,229,143,.3)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(242,209,75,.3)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,97,112,.3)}
.pill.cy{background:var(--cyan-soft);color:var(--cyan);border-color:rgba(94,214,238,.3)}
.pill.flag{background:var(--flag-soft);color:var(--flag);border-color:rgba(255,181,71,.3)}
.ascii{font-family:var(--f-mono);font-size:13px;color:var(--acc);white-space:pre;overflow-x:auto;font-variant-numeric:tabular-nums}
.ascii.fl{color:var(--flag)}
.lvl{font-family:var(--f-mono);font-size:12px;letter-spacing:1px;color:var(--cyan)}
.lvl i{font-style:normal;color:var(--dim)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-family:var(--f-mono);color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);font-size:16px;color:var(--ink);font-family:var(--f-body)}
input:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.formgrid .wide{grid-column:span 2}
/* Unidad */
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:4px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0;font-family:var(--f-mono)}
.stepper a small{font-size:10.5px;color:var(--muted)}
.stepper a span{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper a.ok{border-color:var(--acc);background:var(--acc-soft)} .stepper a.ok small{color:var(--acc)}
.sec{scroll-margin-top:96px}
.sec-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.sec-h .n{font-family:var(--f-mono);font-size:13px;color:var(--acc);font-weight:700}
.concept{display:flex;flex-direction:column;gap:10px;max-width:70ch}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px;background:var(--bg);border:1px dashed var(--line2);border-radius:4px}
.flow .node{font-family:var(--f-mono);font-size:12.5px;padding:5px 9px;border-radius:3px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink)}
.flow .arr{color:var(--acc);font-family:var(--f-mono)}
.codebox{position:relative;border:1px solid var(--line2);border-radius:4px;background:#020604;overflow:hidden}
.codebox .cb-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.codebox pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.55;color:#C9F2DA}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks button{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.checks button:hover{border-color:var(--line2)}
.checks .box{flex:none;font-family:var(--f-mono);font-size:13px;color:var(--dim);margin-top:1px}
.checks .box::before{content:"[ ]"}
.checks .on{border-color:rgba(62,229,143,.35);background:var(--acc-soft)}
.checks small.auto{display:block;margin-top:4px;font-family:var(--f-mono);font-size:11px;color:var(--cyan)}
.checks .on .box{color:var(--acc)} .checks .on .box::before{content:"[x]"}
.checks.static li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cmd{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 12px;background:#020604;min-width:0}
.cmd div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cmd small{color:var(--muted);font-size:12px}
.cmd code{background:none;padding:0;font-size:13px;color:var(--acc);overflow-x:auto;white-space:nowrap;display:block}
.cmd code::before{content:"PS> ";color:var(--dim)}
.linux .cmd code::before{content:"$ "}
.links{display:flex;flex-wrap:wrap;gap:8px}
.practice{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg)}
.prac{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prac:first-of-type{border-top:none}
.prac .pn{font-family:var(--f-mono);font-weight:800;color:var(--acc);font-size:15px;text-align:center}
.prac .pb{display:flex;flex-direction:column;gap:2px;min-width:0}
.prac .pb small{font-family:var(--f-mono);font-size:11.5px;color:var(--cyan)}
.prac .pb p{font-size:14px;color:var(--ink)}
.guides{display:flex;flex-direction:column;gap:8px}
.prereq{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px}
.track{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.track .ti{font-size:20px;color:var(--acc)}
.track b{font-size:14px}
.track small{font-size:12px;color:var(--muted);line-height:1.4}
.track.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.track.mine small.mono{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;color:var(--ink);text-decoration:none;background:var(--bg)}
.chip small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.chip.ok{border-color:var(--acc);color:var(--acc)}
.chip:hover{border-color:var(--acc)}
.guide{border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);overflow:hidden}
.guide summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:"[+]";font-family:var(--f-mono);font-size:12px;color:var(--acc);flex:none}
.guide[open] summary::before{content:"[-]"}
.guide[open] summary{border-bottom:1px solid var(--line)}
.guide ol{margin:0;padding:12px 16px 12px 40px;display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.55}
.guide li::marker{color:var(--acc);font-family:var(--f-mono);font-weight:700}
.guide .learn{margin:0 14px 14px;padding:10px 12px;border-left:2px solid var(--acc);background:var(--acc-soft);font-size:13.5px}
.reveal{border:1px dashed var(--line2);border-radius:4px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.lockbox{border:1px solid rgba(255,97,112,.35);background:var(--bad-soft);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:13px}
.q{display:flex;flex-direction:column;gap:8px}
.q p{font-weight:600}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--dim);width:22px;flex:none}
.opt:hover:not([disabled]){border-color:var(--line2)}
.opt.sel{border-color:var(--cyan);background:var(--cyan-soft)}
.opt.right{border-color:var(--acc);background:var(--acc-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:14px;padding:6px 12px;border-left:2px solid var(--line2);color:var(--muted)}
.expl.ok{border-color:var(--acc)} .expl.no{border-color:var(--bad)}
.flagbox{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:4px;background:var(--flag-soft);border:1px solid var(--flag);box-shadow:0 0 24px rgba(255,181,71,.15)}
.flagbox .mono{color:var(--flag);font-weight:700;font-size:15px;word-break:break-all;text-shadow:0 0 12px rgba(255,181,71,.4)}
.proc{display:flex;flex-wrap:wrap;gap:6px}
.blocks{display:flex;gap:5px;align-items:center}
.blocks i{width:16px;height:16px;border:1px solid var(--line2);border-radius:2px}
.blocks i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 6px var(--acc-glow)}
/* Temporizador */
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:rgba(9,17,13,.94);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:var(--r)}
.timer .t{font-family:var(--f-mono);font-size:22px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;text-shadow:0 0 12px var(--acc-glow)}
.tsegs{display:flex;gap:3px;height:5px}
.tsegs div{background:var(--surface2);border-radius:2px;overflow:hidden}
.tsegs i{display:block;height:100%;background:var(--acc)}
/* Ruta */
.ptabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ptabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0;font-family:var(--f-mono)}
.ptabs button small{font-size:10.5px;color:var(--muted)}
.ptabs button span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ptabs button.on{border-color:var(--acc);background:var(--acc-soft)}
.ptabs button.lk{opacity:.55}
.urow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.urow:hover{border-color:var(--line2)}
.urow .num{font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.urow .tt{display:flex;flex-direction:column;min-width:0;gap:1px}
.urow .tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .tt small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.urow.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,0 0 18px rgba(62,229,143,.12)}
.urow.lk{opacity:.5}
.urow.done .num{color:var(--flag)}
.gate{border:1px solid var(--flag);background:var(--flag-soft)}
.list{display:flex;flex-direction:column;gap:6px}
/* Horario */
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytabs button{padding:6px 12px;border-radius:3px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:12.5px}
.daytabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.daybar{position:relative;height:30px;border-radius:3px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}

{ id:"s07", w:2, day:"Mar", title:"Intro to Networking",
  goal:"Conocer el modelo OSI: las 7 capas por las que pasa cada mensaje.",
  links:[["Sala “Introductory Networking” (antes Intro to Networking)","https://tryhackme.com/room/introtonetworking"]],
  concept:[
    "El **modelo OSI** divide la comunicación en 7 capas. Cada capa tiene un trabajo y le pasa el mensaje a la siguiente.",
    "De arriba abajo: **7 Aplicación** (HTTP), **6 Presentación** (formato, cifrado), **5 Sesión**, **4 Transporte** (TCP, UDP), **3 Red** (IP), **2 Enlace de datos** (MAC), **1 Física** (cables, ondas).",
    "Al enviar, cada capa añade su propia cabecera al mensaje. Eso se llama **encapsulación**. Al recibir, se quitan en orden inverso."
  ],
  flow:["7 Aplicación","4 Transporte","3 Red","2 Enlace","1 Física"],
  steps:[
    "Haz la sala “Intro to Networking”.",
    "Inventa una frase para recordar las 7 capas en orden y escríbela en tu cuaderno.",
    "Para cada capa, anota un ejemplo de algo que trabaje en ella."
  ],
  hint:"Si te pierdes con las capas, piensa en una carta: escribes el texto (aplicación), la metes en un sobre con dirección (red) y el cartero la lleva (física).",
  quiz:[
    {q:"¿En qué capa OSI trabaja la dirección IP?", o:["Capa 2","Capa 3","Capa 4","Capa 7"], a:1, e:"IP es la capa 3, la de red."},
    {q:"¿En qué capa trabajan TCP y UDP?", o:["Capa 1","Capa 3","Capa 4","Capa 6"], a:2, e:"TCP y UDP son la capa 4, la de transporte."},
    {q:"¿Qué es la encapsulación?", o:["Cifrar un mensaje","Que cada capa añada su cabecera al enviar","Bloquear un puerto","Comprimir un archivo"], a:1, e:"Al bajar por las capas, cada una envuelve el mensaje con su información."}
  ],
  cards:[["Las 7 capas OSI de arriba abajo","Aplicación, Presentación, Sesión, Transporte, Red, Enlace de datos, Física."],["¿En qué capa OSI está IP?","Capa 3, red."],["¿En qué capa OSI están TCP y UDP?","Capa 4, transporte."]],
  keys:["OSI tiene 7 capas: aplicación arriba, física abajo.","IP = capa 3; TCP/UDP = capa 4; HTTP = capa 7.","Encapsulación: cada capa añade su cabecera."]
},
{ id:"s08", w:2, day:"Mié", title:"Networking Concepts, primera mitad",
  goal:"Entender la diferencia entre TCP y UDP y cómo empieza una conexión.",
  links:[["Sala “Networking Concepts”","https://tryhackme.com/room/networkingconcepts"]],
  concept:[
    "**TCP** es fiable: confirma que cada pedazo llegó y lo reenvía si se pierde. Lo usan la web, el correo y las descargas.",
    "**UDP** es rápido pero no confirma nada. Lo usan las videollamadas, los juegos en línea y el streaming, donde llegar a tiempo importa más que llegar todo.",
    "Una conexión TCP empieza con el **saludo de tres pasos**: el cliente manda **SYN**, el servidor responde **SYN-ACK** y el cliente cierra con **ACK**.",
    "Tanto TCP como UDP usan **puertos**: números del 0 al 65535 que indican a qué programa de la computadora va cada mensaje. Si la IP es la dirección del edificio, el puerto es el número del apartamento."
  ],
  flow:["Cliente: SYN","Servidor: SYN-ACK","Cliente: ACK","Conexión abierta"],
  steps:[
    "Haz la primera mitad de “Networking Concepts”.",
    "Dibuja en tu cuaderno el saludo de tres pasos con flechas.",
    "Escribe dos aplicaciones que usen TCP y dos que usen UDP, y por qué."
  ],
  hint:"Para recordar el saludo: “¿Hola?” (SYN), “Hola, ¿me oyes?” (SYN-ACK), “Sí” (ACK).",
  quiz:[
    {q:"¿Cuál es el orden del saludo de TCP?", o:["ACK, SYN, SYN-ACK","SYN, SYN-ACK, ACK","SYN, ACK, FIN","SYN-ACK, SYN, ACK"], a:1, e:"Primero SYN, luego SYN-ACK y por último ACK."},
    {q:"¿Qué protocolo suele usar una videollamada?", o:["TCP","UDP","FTP","SMTP"], a:1, e:"UDP prioriza la velocidad. Perder un fotograma importa menos que llegar tarde."},
    {q:"¿Qué hace TCP si se pierde un pedazo?", o:["Nada","Lo reenvía","Cierra la conexión","Cambia a UDP"], a:1, e:"TCP confirma cada pedazo y reenvía lo que se pierde."}
  ],
  cards:[["Saludo de tres pasos de TCP","SYN, SYN-ACK, ACK."],["¿Cuándo se usa UDP en vez de TCP?","Cuando la velocidad importa más que recibirlo todo: videollamadas, juegos, streaming."]],
  keys:["TCP confirma y reenvía; UDP es rápido sin confirmar.","Saludo TCP: SYN, SYN-ACK, ACK.","Videollamadas y juegos suelen usar UDP."]
},

{ id:"s19", w:4, day:"Jue", title:"Bandit niveles 5 y 6: buscar con find",
  goal:"Encontrar un archivo entre cientos usando sus características.",
  links:[["Bandit nivel 5 → 6","https://overthewire.org/wargames/bandit/bandit6.html"],["Bandit nivel 6 → 7","https://overthewire.org/wargames/bandit/bandit7.html"]],
  concept:[
    "`find` busca archivos por características: `-type f` (solo archivos), `-size` (tamaño), `-user` y `-group` (dueño). Ejemplo: `find . -type f -size 100c` busca archivos de exactamente 100 bytes.",
    "Cuando buscas en todo el sistema salen muchos errores de “permiso denegado”. Añadir `2>/dev/null` manda esos errores a la basura y deja solo los resultados.",
    "Esto es lo que hace un atacante dentro de un servidor: buscar archivos interesantes por sus pistas."
  ],
  flow:["Leer las pistas del nivel","Traducirlas a opciones de find","Ejecutar","Leer el resultado"],
  steps:[
    "Lee el objetivo del nivel 5 y convierte cada pista en una opción de find.",
    "Resuelve el nivel 5.",
    "Resuelve el nivel 6, que busca en todo el servidor.",
    "Crea una tarjeta por cada opción de find que usaste."
  ],
  cmds:[["Buscar archivos de un tamaño exacto","find . -type f -size 1033c"],["Buscar ocultando errores","find / -user nombre 2>/dev/null"],["Ver la ayuda de find","man find"]],
  hint:"La c en -size significa bytes. Lee el manual con man find y busca la palabra size pulsando / .",
  quiz:[
    {q:"¿Qué busca find . -type f?", o:["Solo carpetas","Solo archivos","Archivos ocultos","Archivos borrados"], a:1, e:"-type f se limita a archivos normales; -type d serían carpetas."},
    {q:"¿Qué hace 2>/dev/null?", o:["Borra los archivos","Oculta los mensajes de error","Guarda el resultado","Da permisos"], a:1, e:"Redirige los errores (salida 2) a /dev/null, que los descarta."},
    {q:"¿Qué significa la c en -size 1033c?", o:["Caracteres","Bytes","Carpetas","Kilobytes"], a:1, e:"En find, el sufijo c indica bytes."}
  ],
  cards:[["Buscar solo archivos con find","find . -type f"],["Ocultar errores en la terminal","2>/dev/null"],["Buscar por dueño con find","-user nombre"]],
  keys:["find busca por tipo, tamaño, dueño y grupo.","2>/dev/null oculta los errores.","-size 100c = 100 bytes."]
},

  hint:"Si un comando saca demasiadas líneas, añade | grep algo para filtrar.",
  quiz:[

    {q:"¿Por qué se usa sort antes de uniq?", o:["Por costumbre","Porque uniq solo detecta repetidas que están juntas","Porque uniq es lento","No hace falta"], a:1, e:"sort pone las líneas iguales juntas para que uniq las cuente bien."},
    {q:"¿Qué hace strings?", o:["Cifra texto","Saca el texto legible de un archivo binario","Cuenta palabras","Cambia el nombre"], a:1, e:"Extrae las secuencias de caracteres legibles."}

  cards:[["¿Qué hace la tubería | ?","Pasa la salida de un comando como entrada del siguiente."],["¿Por qué sort antes de uniq?","uniq solo junta repetidas que están seguidas."],["Comando para buscar texto en un archivo","grep"]],

  cards:[["¿Qué es el cifrado César?","Desplazar cada letra un número fijo de posiciones."],["¿Por qué el César es débil?","Solo tiene 25 claves: se prueban todas en segundos."],["¿Qué es la fuerza bruta?","Probar todas las posibilidades hasta acertar."]],

{ id:"p2u11", mod:"Criptografía", lvl:2, blocks:2, title:"Cifrado y hash",
  goal:"Distinguir cifrado simétrico, asimétrico y hash, y saber para qué sirve cada uno.",
  links:[["Sala “Encryption - Crypto 101”",THM("encryptioncrypto101")],["CyberChef","https://gchq.github.io/CyberChef/"],["Sala “Cryptography Concepts” (gratis, fácil)",THM("cryptographyconcepts")]],
  concept:[
    "**Cifrado simétrico** (como AES): la misma llave cifra y descifra. Es rápido, pero hay que compartir la llave de forma segura.",
    "**Cifrado asimétrico** (como RSA): una llave pública cifra y solo la privada descifra. HTTPS lo usa para acordar una llave simétrica de forma segura.",
    "Un **hash** (como SHA-256) convierte cualquier dato en una huella de tamaño fijo y **no se puede deshacer**. Las contraseñas se guardan como hash, con una **sal** (un valor aleatorio) para que dos contraseñas iguales no den el mismo hash."
  ],
  flow:["Simétrico: 1 llave","Asimétrico: pública + privada","Hash: huella sin vuelta atrás"],
  steps:["Haz primero la sala “Cryptography Concepts” y después “Encryption - Crypto 101”.","En CyberChef, calcula el SHA-256 de tu nombre y luego de tu nombre con una letra cambiada. Compara.","Explica en voz alta por qué las contraseñas se guardan como hash con sal y no cifradas."],
  hint:"Pregúntate siempre: ¿necesito recuperar el dato original? Si sí, es cifrado. Si no, es hash.",
  quiz:[
    {q:"¿Qué tipo de cifrado usa la misma llave para cifrar y descifrar?",o:["Asimétrico","Simétrico","Hash","Base64"],a:1,e:"Simétrico: una sola llave compartida."},
    {q:"¿Se puede deshacer un hash para obtener el dato original?",o:["Sí, con la llave","No, es de un solo sentido","Sí, con Base64","Solo en Linux"],a:1,e:"Un hash no tiene vuelta atrás; solo se puede comparar."},
    {q:"¿Para qué sirve la sal en las contraseñas?",o:["Para cifrarlas","Para que contraseñas iguales den hashes distintos","Para acortarlas","Para recuperarlas"],a:1,e:"La sal hace único cada hash aunque la contraseña se repita."}
  ],
  cards:[["Cifrado simétrico frente a asimétrico","Simétrico: una llave. Asimétrico: pública cifra, privada descifra."],["¿Qué es un hash?","Una huella de tamaño fijo que no se puede deshacer."],["¿Para qué sirve la sal?","Para que contraseñas iguales tengan hashes distintos."]],
  keys:["Simétrico = una llave; asimétrico = pública + privada.","Hash = huella sin vuelta atrás.","Contraseñas: hash con sal."]
},

    {q:"¿Contra qué puedes usar Nmap?",o:["Cualquier IP","Tus equipos o máquinas de laboratorio autorizadas","La red del colegio","Tu proveedor de internet"],a:1,e:"Solo con permiso."}
  ],
  cards:[["Estados de un puerto en Nmap","Abierto, cerrado y filtrado."],["¿Para qué sirve conocer la versión de un servicio?","Para buscar vulnerabilidades conocidas (CVE)."]],
  keys:["Nmap: equipos, puertos, servicios y versiones.","Abierto, cerrado, filtrado.","Solo contra el laboratorio."]
},
{ id:"p3u06", mod:"Defensa", lvl:3, blocks:2, title:"Detectar un ataque en la red: Snort",
  goal:"Ver el otro lado: cómo un sistema de detección reconoce un escaneo o un ataque.",
  links:[["Sala “Snort”",THM("snort")]],
  concept:[
    "Un **IDS** (sistema de detección de intrusos) vigila el tráfico y **alerta** cuando ve algo sospechoso. Un **IPS** además lo **bloquea**.",
    "Snort funciona con **reglas**: patrones que describen tráfico malicioso. Si el tráfico coincide con una regla, genera una alerta.",
    "Después de aprender a escanear, aprender cómo se detecta un escaneo te hace mejor en los dos lados."
  ],
  flow:["Tráfico","Reglas de Snort","¿Coincide?","Alerta o bloqueo"],
  steps:["Haz la sala “Snort”.","Escribe en tu cuaderno la diferencia entre IDS e IPS.","Explica en voz alta por qué un escaneo agresivo es fácil de detectar."],
  hint:"Lee cada regla de izquierda a derecha: acción, protocolo, origen, destino y lo que busca.",
  quiz:[
    {q:"¿Qué diferencia hay entre IDS e IPS?",o:["Ninguna","El IDS alerta; el IPS además bloquea","El IPS solo alerta","El IDS cifra"],a:1,e:"Detección frente a prevención."},
    {q:"¿Con qué detecta Snort el tráfico malicioso?",o:["Con reglas","Al azar","Con contraseñas","Con DNS"],a:0,e:"Compara el tráfico con reglas."},
    {q:"¿Por qué conviene a un atacante ético entender un IDS?",o:["No conviene","Porque sabe qué acciones generan alertas","Para desactivarlo","Para venderlo"],a:1,e:"Entender la detección mejora tu trabajo y tus informes."}
  ],
  cards:[["IDS frente a IPS","IDS detecta y alerta; IPS además bloquea."]],
  keys:["IDS alerta; IPS bloquea.","Snort funciona con reglas."]
},
{ id:"p3u07", mod:"Web", lvl:3, blocks:2, title:"Burp Suite Repeater",
  goal:"Modificar y reenviar peticiones para entender cómo responde un servidor del laboratorio.",
  links:[["Sala “Burp Suite: Repeater”",THM("burpsuiterepeater")]],
  concept:[
    "**Repeater** te deja tomar una petición, cambiar una parte (un parámetro, una cabecera) y reenviarla tantas veces como quieras para comparar respuestas.",
    "Es la forma básica de probar cómo valida el servidor lo que recibe: qué pasa con un valor vacío, muy largo o de otro tipo.",
    "Como siempre: solo contra laboratorios o sistemas con permiso."
  ],
  flow:["Capturar petición","Enviar a Repeater","Cambiar un valor","Comparar respuesta"],
  steps:["Haz la sala “Burp Suite: Repeater”.","Anota tres cambios que probaste y qué respondió el servidor en cada caso.","Explica en voz alta qué buscas cuando comparas dos respuestas."],
  hint:"Cambia una sola cosa cada vez: si cambias varias a la vez, no sabrás cuál provocó la diferencia.",
  quiz:[
    {q:"¿Para qué sirve Repeater?",o:["Para escanear puertos","Para modificar y reenviar una petición","Para cifrar","Para descargar archivos"],a:1,e:"Reenvías la misma petición con cambios controlados."},
    {q:"¿Por qué cambiar una sola cosa cada vez?",o:["Por velocidad","Para saber qué cambio causó la diferencia","Por obligación","No importa"],a:1,e:"Es el método científico aplicado a la web."},
    {q:"¿Dónde puedes usar Repeater?",o:["En cualquier web","Solo en laboratorios o con permiso","En redes sociales","En bancos"],a:1,e:"Modificar peticiones a sistemas ajenos sin permiso no está permitido."}
  ],
  cards:[["¿Qué hace Burp Repeater?","Reenvía una petición con cambios para comparar respuestas."]],
  keys:["Repeater: cambiar y reenviar.","Una sola variable cada vez."]
},

{ id:"p3u09", mod:"Web", lvl:4, blocks:2, title:"Inyección SQL: entenderla y prevenirla",
  goal:"Entender por qué ocurre la inyección SQL y cómo se evita en el código.",
  links:[["Sala “SQL Injection”",THM("sqlinjectionlm")],["Teoría de PortSwigger","https://portswigger.net/web-security/sql-injection"]],
  concept:[
    "La **inyección SQL** ocurre cuando una aplicación mete lo que escribe el usuario **directamente dentro** de una consulta SQL. Si el texto contiene caracteres especiales de SQL, puede cambiar el significado de la consulta.",
    "La defensa principal son las **consultas parametrizadas**: el código manda la consulta y los datos por separado, y la base de datos nunca confunde datos con instrucciones.",
    "Además: dar a la aplicación solo los permisos mínimos en la base de datos y validar las entradas."
  ],
  code:"# Inseguro: el texto del usuario se pega dentro de la consulta\nconsulta = \"SELECT * FROM usuarios WHERE nombre = '\" + nombre + \"'\"\n\n# Seguro: consulta parametrizada, datos por separado\ncursor.execute(\"SELECT * FROM usuarios WHERE nombre = ?\", (nombre,))",
  steps:["Lee la teoría de PortSwigger sobre inyección SQL.","Haz la sala “SQL Injection”.","Explica en voz alta por qué la versión parametrizada del ejemplo es segura."],
  hint:"Piensa en la diferencia entre una plantilla con huecos que se rellenan y un texto que se pega y se reinterpreta.",
  quiz:[
    {q:"¿Por qué ocurre la inyección SQL?",o:["Por usar HTTPS","Porque la entrada del usuario se mezcla con la consulta","Por tener muchos usuarios","Por usar Python"],a:1,e:"El dato se interpreta como parte de la instrucción."},
    {q:"¿Cuál es la defensa principal?",o:["Esconder el formulario","Consultas parametrizadas","Usar contraseñas largas","Cambiar el puerto"],a:1,e:"Separan los datos de la instrucción."},
    {q:"¿Qué es el principio de mínimo privilegio aplicado aquí?",o:["Que la aplicación tenga solo los permisos que necesita en la base de datos","Que nadie entre","Que todo sea público","Que el usuario sea administrador"],a:0,e:"Si algo falla, el daño queda limitado."}
  ],
  cards:[["Defensa principal contra la inyección SQL","Consultas parametrizadas (datos separados de la instrucción)."],["¿Por qué ocurre la inyección SQL?","Porque la entrada del usuario se mezcla con la consulta."]],
  keys:["Inyección SQL = datos que se interpretan como instrucción.","Defensa: consultas parametrizadas.","Mínimo privilegio en la base de datos."]
},
{ id:"p3u10", mod:"Web", lvl:4, blocks:2, title:"XSS: entenderlo y prevenirlo",
  goal:"Entender el cross-site scripting y sus defensas.",
  links:[["Teoría de PortSwigger sobre XSS","https://portswigger.net/web-security/cross-site-scripting"]],
  concept:[
    "El **XSS** (cross-site scripting) ocurre cuando una web muestra contenido de un usuario sin tratarlo, y ese contenido se ejecuta como código en el navegador de otras personas.",
    "Tipos: **reflejado** (viaja en la petición y vuelve en la respuesta), **almacenado** (se guarda, por ejemplo en un comentario, y afecta a todos los que lo vean) y **basado en DOM** (ocurre en el JavaScript del navegador).",
    "Defensas: **codificar la salida** para que el texto se muestre como texto y no como código, una **política de seguridad de contenido (CSP)** y marcar las cookies de sesión como **HttpOnly** para que JavaScript no pueda leerlas."
  ],
  flow:["Usuario envía contenido","La web lo muestra sin tratar","Se ejecuta en otros navegadores"],
  steps:["Lee la teoría de PortSwigger sobre XSS.","Resuelve el primer laboratorio Apprentice de XSS reflejado. Si te atascas 20 minutos, lee la solución oficial y luego hazlo tú.","Escribe en tu cuaderno las tres defensas y qué evita cada una."],
  hint:"Fíjate dónde aparece tu texto en el HTML de la respuesta: eso explica por qué se ejecuta o no.",
  quiz:[
    {q:"¿Qué tipo de XSS afecta a todos los que ven un comentario?",o:["Reflejado","Almacenado","DOM","Ninguno"],a:1,e:"Se guarda en el servidor y se muestra a todos."},
    {q:"¿Qué hace la codificación de salida?",o:["Cifra la web","Hace que el texto se muestre como texto y no como código","Acelera la página","Bloquea usuarios"],a:1,e:"Convierte los caracteres especiales para que no se interpreten."},
    {q:"¿Para qué sirve la marca HttpOnly en una cookie?",o:["Para que JavaScript no pueda leerla","Para que dure más","Para cifrarla","Para que solo funcione en HTTP"],a:0,e:"Protege la cookie de sesión aunque haya un XSS."}
  ],
  cards:[["Tipos de XSS","Reflejado, almacenado y basado en DOM."],["Defensas contra XSS","Codificar la salida, CSP y cookies HttpOnly."]],
  keys:["XSS = contenido de usuario ejecutado como código en otros navegadores.","Reflejado, almacenado, DOM.","Defensas: codificar salida, CSP, HttpOnly."]
},
{ id:"p3u11", mod:"Web", lvl:4, blocks:2, title:"Autenticación y referencias directas (IDOR)",
  goal:"Entender los fallos de inicio de sesión y de acceso a objetos, y cómo se protegen.",
  links:[["Teoría de autenticación de PortSwigger","https://portswigger.net/web-security/authentication"],["Teoría de control de acceso e IDOR","https://portswigger.net/web-security/access-control"]],
  concept:[
    "Los fallos de **autenticación** permiten entrar como otra persona: contraseñas débiles sin límite de intentos, recuperación de contraseña mal hecha o mensajes de error que revelan si un usuario existe.",
    "Un **IDOR** (referencia directa insegura a objetos) ocurre cuando cambiando un número en la URL, como de `factura=1001` a `factura=1002`, ves datos de otra persona porque el servidor no comprueba que sean tuyos.",
    "Defensas: autenticación de dos factores, límite de intentos, mensajes de error genéricos y comprobar en el servidor que cada objeto pertenece a quien lo pide."
  ],
  flow:["Pedir factura 1002","¿El servidor comprueba el dueño?","Sí: denegado","No: IDOR"],
  steps:["Lee la teoría de autenticación de PortSwigger.","Resuelve un laboratorio Apprentice de autenticación y uno de IDOR del tema de control de acceso.","Para cada uno, anota la causa y la defensa."],
  hint:"En los laboratorios de IDOR, compara lo que ve tu usuario con lo que debería ver.",
  quiz:[
    {q:"Cambias factura=1001 por 1002 y ves la de otra persona. ¿Qué fallo es?",o:["XSS","IDOR","Inyección SQL","Phishing"],a:1,e:"El servidor no comprueba que el objeto sea tuyo."},
    {q:"¿Por qué un login no debería decir “el usuario no existe”?",o:["Por estética","Porque revela qué usuarios existen","Porque es lento","No importa"],a:1,e:"Un mensaje genérico no da pistas al atacante."},
    {q:"¿Qué defensa frena los intentos masivos de contraseñas?",o:["Cambiar el logo","Límite de intentos y doble factor","Usar HTTP","Desactivar el login"],a:1,e:"Limitar intentos y pedir un segundo factor."}
  ],
  cards:[["¿Qué es un IDOR?","Ver objetos de otro usuario cambiando un identificador porque el servidor no comprueba el dueño."],["Defensas de la autenticación","Doble factor, límite de intentos y errores genéricos."]],
  keys:["IDOR: cambiar un id y ver datos ajenos.","Login: doble factor, límite de intentos, errores genéricos."]
},
{ id:"p3u12", mod:"Defensa", lvl:3, blocks:2, title:"Inteligencia de amenazas",
  goal:"Usar información sobre atacantes reales para defender mejor.",
  links:[["Sala “Intro to Cyber Threat Intel”",THM("cyberthreatintel")]],
  concept:[
    "La **inteligencia de amenazas** recopila datos sobre quién ataca, cómo y con qué, para anticiparse.",
    "Los **indicadores de compromiso (IOC)** son rastros concretos: hashes de archivos maliciosos, IP o dominios usados por atacantes.",
    "La **pirámide del dolor** ordena los indicadores según cuánto le cuesta al atacante cambiarlos: un hash lo cambia en segundos; sus **tácticas, técnicas y procedimientos (TTP)** son lo más difícil de cambiar, y por eso lo más valioso de detectar."
  ],
  flow:["Hash","IP","Dominio","Herramientas","TTP (lo más difícil de cambiar)"],
  steps:["Haz la sala “Intro to Cyber Threat Intel”.","Dibuja la pirámide del dolor en tu cuaderno.","Explica en voz alta por qué detectar TTP es mejor que bloquear un hash."],
  hint:"Piensa en el esfuerzo del atacante: ¿qué le obligaría a cambiar toda su forma de trabajar?",
  quiz:[
    {q:"¿Qué es un IOC?",o:["Un antivirus","Un rastro concreto de un ataque, como un hash o una IP","Una contraseña","Un firewall"],a:1,e:"Indicador de compromiso."},
    {q:"En la pirámide del dolor, ¿qué es más difícil de cambiar para un atacante?",o:["El hash","La IP","Sus TTP","El dominio"],a:2,e:"Cambiar su forma de trabajar le cuesta mucho."},
    {q:"¿Para qué sirve la inteligencia de amenazas?",o:["Para atacar","Para anticiparse a los atacantes","Para vender datos","Para nada"],a:1,e:"Conocer al adversario permite defenderse antes."}
  ],
  cards:[["¿Qué es un IOC?","Indicador de compromiso: hash, IP o dominio ligado a un ataque."],["¿Qué está en la cima de la pirámide del dolor?","Las TTP: tácticas, técnicas y procedimientos."]],
  keys:["IOC = rastros concretos.","Pirámide del dolor: TTP lo más valioso de detectar."]
},
{ id:"p3u13", mod:"Defensa", lvl:3, blocks:1, title:"Analizar un correo de phishing",
  goal:"Reconocer un correo de phishing con las técnicas de un analista.",
  links:[["Sala “Security Awareness”",THM("securityawarenessintro")]],
  concept:[
    "El **phishing** sigue siendo la forma más común de empezar un ataque. Un analista revisa: si el remitente real coincide con el nombre mostrado, si los enlaces llevan a donde dicen, y si el mensaje mete prisa o miedo.",
    "Las cabeceras del correo muestran los resultados de **SPF**, **DKIM** y **DMARC**, que comprueban si el servidor que lo envió está autorizado por ese dominio.",
    "Nunca hagas clic en los enlaces ni abras adjuntos de un correo sospechoso: se analizan pasando el ratón por encima y leyendo las cabeceras."
  ],
  flow:["Remitente real","Enlaces (sin clic)","Urgencia o miedo","SPF, DKIM, DMARC"],
  steps:["Haz la sala “Security Awareness”.","Abre un correo de tu carpeta de spam sin hacer clic en nada y busca las 4 señales.","En Gmail, usa “Mostrar original” para ver las cabeceras y localiza los resultados de SPF, DKIM y DMARC."],
  hint:"En Gmail, “Mostrar original” está en el menú de los tres puntos del mensaje.",
  quiz:[
    {q:"El nombre dice “Banco Popular” pero el correo viene de un dominio raro. ¿Qué indica?",o:["Nada","Posible phishing","Que el banco cambió de dominio","Un error de Gmail"],a:1,e:"Que el nombre mostrado y el remitente real no coincidan es una señal clásica."},
    {q:"¿Qué comprueban SPF, DKIM y DMARC?",o:["La ortografía","Que el servidor que envía está autorizado por el dominio","El tamaño","Los adjuntos"],a:1,e:"Validan el origen del correo."},
    {q:"¿Cómo revisas un enlace sospechoso?",o:["Haciendo clic","Pasando el ratón por encima sin hacer clic","Reenviándolo","Respondiendo"],a:1,e:"Así ves la dirección real sin visitarla."}
  ],
  cards:[["Señales de phishing","Remitente distinto, enlaces engañosos, urgencia o miedo, fallos en SPF/DKIM/DMARC."]],
  keys:["Phishing: remitente real, enlaces, urgencia.","SPF, DKIM y DMARC validan el origen.","Nunca hacer clic al analizar."]
},
{ id:"p3u14", mod:"Ataque", lvl:4, blocks:2, title:"Metasploit en el laboratorio",
  goal:"Conocer el framework de explotación más usado y por qué los defensores parchean a tiempo.",
  links:[["Sala “Metasploit: Introduction”",THM("metasploitintro")]],
  concept:[
    "**Metasploit** es un framework que reúne miles de módulos para probar vulnerabilidades conocidas. Lo usan pentesters y también equipos de defensa para comprobar si sus sistemas están parcheados.",
    "Conceptos: un **exploit** aprovecha la vulnerabilidad; una **carga útil** (payload) es lo que se ejecuta después; los módulos **auxiliares** escanean o recopilan información.",
    "La lección defensiva es clara: casi todo lo que hay en Metasploit son fallos con parche publicado. Actualizar a tiempo evita la mayoría de estos ataques."
  ],
  flow:["Vulnerabilidad conocida","Exploit","Carga útil","Lección: parchear"],
  steps:["Haz la sala “Metasploit: Introduction” usando solo la máquina del laboratorio.","Anota la diferencia entre exploit, payload y módulo auxiliar.","Explica en voz alta por qué parchear a tiempo frena la mayoría de estos ataques."],
  hint:"Si te pierdes dentro de la consola, la sala explica cómo pedir ayuda sobre un módulo.",
  quiz:[
    {q:"¿Qué es una carga útil (payload)?",o:["El fallo","Lo que se ejecuta después de aprovechar el fallo","Un escáner","Un informe"],a:1,e:"El exploit abre la puerta; el payload es lo que entra."},
    {q:"¿Qué hacen los módulos auxiliares?",o:["Explotan","Escanean o recopilan información","Cifran","Borran logs"],a:1,e:"Apoyan el reconocimiento y la enumeración."},
    {q:"¿Cuál es la mejor defensa contra fallos conocidos?",o:["Esconder el servidor","Aplicar los parches a tiempo","Cambiar el puerto","Apagar el antivirus"],a:1,e:"Casi todos esos fallos tienen parche publicado."}
  ],
  cards:[["Exploit frente a payload","Exploit: aprovecha el fallo. Payload: lo que se ejecuta después."],["Mejor defensa contra fallos conocidos","Aplicar los parches a tiempo."]],
  keys:["Metasploit: módulos para fallos conocidos.","Exploit, payload, auxiliar.","Parchear a tiempo frena la mayoría."]
},

{ id:"p3u16", mod:"Ataque", lvl:4, blocks:3, title:"Escalada de privilegios en Linux",
  goal:"Entender qué configuraciones de Linux permiten ganar privilegios y cómo se corrigen.",
  links:[["Sala “Linux Privilege Escalation”",THM("linprivesc")]],
  concept:[
    "La **escalada de privilegios** es pasar de un usuario normal a administrador (root). Casi siempre se debe a **configuraciones descuidadas**, no a fallos exóticos.",
    "Causas típicas: reglas de **sudo** demasiado amplias, programas con **setuid** innecesario (lo viste en Bandit), tareas programadas que ejecutan archivos que cualquiera puede modificar, y software sin actualizar.",
    "Para cada causa existe una corrección: mínimo privilegio en sudo, revisar los setuid, permisos correctos en los archivos y parches al día."
  ],
  flow:["Usuario normal","Configuración descuidada","root","Corrección"],
  steps:["Haz la sala “Linux Privilege Escalation”, repartida en varios bloques.","Haz una tabla: causa, cómo se detecta, cómo se corrige.","Explica en voz alta qué tiene que ver esto con los permisos que aprendiste en la Fase 2."],
  hint:"Cada técnica de la sala responde a la pregunta: ¿qué se configuró con más permisos de los necesarios?",
  quiz:[
