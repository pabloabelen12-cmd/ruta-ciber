Object.assign(UNIT_GUIDES, {
  p5cld02: [{ t:"Blindar tu cuenta de AWS nada más crearla, paso a paso", s:[
    "Crea la cuenta en el enlace de registro. Elige el **plan Free** (gratuito). Pondrás una tarjeta solo para verificar identidad; el plan Free no cobra nada hasta que tú subas de categoría.",
    "Entra como **root** (el correo con el que te registraste). Arriba a la derecha, en tu nombre → **Security credentials** (credenciales de seguridad).",
    "En **Multi-factor authentication (MFA)** pulsa **Assign MFA device** → **Authenticator app** → **Next**.",
    "Abre Google Authenticator o Authy en tu teléfono, escanea el **QR code** que muestra AWS, y escribe dos códigos seguidos en **MFA code 1** y **MFA code 2**. Pulsa **Add MFA**. Desde ahora, root pide ese código.",
    "Pon el tope de gasto: busca **Billing and Cost Management** → **Budgets** → **Create budget** → **Use a template (simplified)** → **Zero spend budget** → pon tu correo → **Create budget**.",
    "Activa las alertas de la capa gratuita: **Billing preferences** → **Alert preferences** → **Edit** → marca **Receive AWS Free Tier alerts** → pon tu correo → **Update**.",
    "Deberías recibir un correo de confirmación del presupuesto. A partir de aquí, trabaja con un usuario IAM, no con root."
  ], learn:"Una cuenta nueva se blinda con MFA en root, un presupuesto a cero y las alertas de la capa gratuita, antes de hacer nada más." }],
  p5cld05: [{ t:"flaws.cloud: aprender de los fallos con su sistema de pistas", s:[
    "Abre **flaws.cloud**. Es un laboratorio legal y gratuito, hecho para enseñar: cada nivel es un fallo real de configuración de AWS.",
    "Lee el nivel 1. Te explica el objetivo y, cuando te atascas, **despliega sus propias pistas** (Hint): están pensadas para enseñarte, úsalas en vez de buscar la solución fuera.",
    "Resuelve cada nivel con sus pistas. No necesitas comandos de ataque míos: el laboratorio te guía.",
    "Lo importante: por cada nivel, escribe en tu cuaderno **cómo se habría evitado** ese fallo. Nivel de S3 público → Block Public Access. Nivel de credenciales de instancia → IMDSv2. Nivel de clave suelta → no usar claves permanentes.",
    "Al terminar, tendrás una tabla: fallo → cómo ocurre → cómo se previene. Esa tabla es tu material de auditor."
  ], learn:"En los laboratorios de nube se aprende con su propio sistema de pistas; tu trabajo es entender la prevención de cada fallo, no memorizar un ataque." }],
  p5cld07: [{ t:"Pasar Prowler a tu cuenta y leer el informe, paso a paso", s:[
    "En tu Kali, instala Prowler con `pipx install prowler`. Si no tienes pipx, instálalo con `sudo apt install pipx` y luego `pipx ensurepath`.",
    "Dale a tu usuario de auditoría permisos de **solo lectura**: en IAM, añádele las políticas gestionadas `SecurityAudit` y `ViewOnlyAccess`.",
    "Comprueba primero el nombre exacto del estándar: `prowler aws --list-compliance`.",
    "Ejecuta la auditoría y guarda el informe: `prowler aws -M csv html`. Tarda unos minutos y no cambia nada en tu cuenta (solo lee).",
    "Abre el archivo **.html** que genera en tu navegador: verás los hallazgos por servicio, con su gravedad y la explicación de cada uno.",
    "Ordena por gravedad. Toma los **3 más graves** y, por cada uno, apunta: qué es, por qué importa y el arreglo que propone Prowler. Corrige al menos uno en tu cuenta y vuelve a pasar Prowler para ver que desaparece."
  ], learn:"Prowler audita tu cuenta en solo lectura y da un informe priorizable; el valor está en leerlo, priorizar por gravedad y corregir." }]

P5.push(
  { id:"p5mal01", track:"malware", mod:"Laboratorio", lvl:4, blocks:3, title:"Tu laboratorio aislado de malware",

      ["FLARE-VM (Mandiant, GitHub)","https://github.com/mandiant/flare-vm"],

    concept:[
      "El malware puede cifrar tus archivos, robar las contraseñas guardadas en Brave o saltar a otros equipos de tu casa (los **gusanos**, «worms», se propagan solos). Por eso **nunca** se analiza en tu laptop principal ni conectado a la red de casa. Se usa una **máquina virtual** (VM, «virtual machine»): un ordenador simulado dentro del tuyo, que puedes romper y restaurar en segundos.",
      "El laboratorio tiene tres defensas. 1) **Aislamiento de red**: la VM queda en «Internal Network» y no ve ni tu router ni tu laptop. 2) **Snapshots** (instantáneas): fotos del estado de la VM para volver a «limpia» después de cada análisis. 3) **Puentes cortados**: el portapapeles compartido, arrastrar y soltar, las carpetas compartidas y el USB quedan apagados, porque cada uno es un camino de salida.",
      "**FLARE-VM** (de Mandiant) convierte un Windows en un laboratorio con más de cien herramientas: Ghidra, x64dbg, PE-bear, pestudio, capa, FakeNet-NG, Sysinternals, YARA e incluso los labs del libro Practical Malware Analysis. **REMnux** es su equivalente en Linux. Lo añadirás en la unidad 06 si tu laptop tiene RAM suficiente.",
      "Esta especialidad es **defensiva**: aprendes a reconocer y detectar, nunca a crear ni distribuir malware. La Ley 53-07 castiga el acceso ilícito (art. 6), producir, poseer o distribuir programas hechos para cometer delitos (art. 8), dañar datos (art. 10) y el sabotaje de sistemas (art. 11). Usarás solo muestras de cursos, y siempre dentro de la VM aislada."

    flow:["¿Tengo RAM y disco suficientes?","VM nueva con red NAT solo para instalar","FLARE-VM instalado → red aislada y puentes cortados","Snapshot «limpia» antes de cada análisis","Analizar → restaurar"],

      "Instala VirtualBox y crea la VM con Windows 11 Enterprise de evaluación.",
      "Instala FLARE-VM con la guía (el antivirus y las actualizaciones se apagan solo dentro de la VM).",
      "Cambia la red a «Internal Network», corta los puentes y toma el snapshot «01-limpia».",

      {q:"¿Para qué sirve el snapshot «01-limpia»?",o:["Para volver al estado sin infectar después de cada análisis","Para acelerar la VM","Para hacer una copia de seguridad de tu laptop","Para desactivar el antivirus"],a:0,e:"Es tu punto de retorno: ejecutas, observas y restauras."},
      {q:"FLARE-VM pide desactivar Microsoft Defender. ¿Dónde lo haces?",o:["En tu laptop y en la VM","Solo dentro de la VM de análisis","En el router","En ningún sitio"],a:1,e:"Defender confunde las herramientas de análisis con malware. Lo apagas solo en la VM desechable; tu laptop sigue protegida y actualizada."}

  { id:"p5mal02", track:"malware", mod:"Fundamentos", lvl:4, blocks:2, title:"C y cómo se ve un programa compilado",
    goal:"Escribir un programa pequeño en C, compilarlo para Linux y para Windows y descubrir qué queda de él dentro del binario.",
    links:[
      ["Learn-C.org (tutorial interactivo, gratis)","https://www.learn-c.org/"],
      ["Compiler Explorer (godbolt.org)","https://godbolt.org/"]
    ],
    concept:[
      "La mayor parte del malware de Windows está escrito en C o C++ y luego se **compila**: un compilador traduce el código fuente a **código máquina**, los bytes que ejecuta la CPU. Al compilar se pierden los nombres de las variables y los comentarios. La **ingeniería inversa** («reverse engineering») consiste en reconstruir la lógica a partir de lo que queda.",
      "Lo mínimo de C para leer malware: `main()` es donde empieza el programa; `int` y `char` son tipos; `char clave[] = \"...\"` es un texto; `if` decide; `strcmp(a, b)` devuelve 0 si los dos textos son iguales; `printf` imprime; un **puntero** (`char *p`) es una dirección de memoria.",
      "Lo que sobrevive a la compilación son las pistas que usarás siempre: los **textos literales** (los ves con `strings`), las **llamadas a funciones** de librerías y de Windows, las constantes numéricas y la forma de los `if` y los bucles, que se convierten en comparaciones y saltos.",
      "Desde tu Kali en WSL compilarás con `gcc` (que crea un ejecutable **ELF**, el formato de Linux) y con `x86_64-w64-mingw32-gcc` (MinGW-w64, que crea un **PE** `.exe` de Windows). **Compiler Explorer** muestra en el navegador el ensamblador junto a tu código, con cada línea pintada del mismo color."
    ],
    flow:["Escribo C","Compilo","Miro qué queda: file, strings, objdump","Comparo fuente y ensamblador"],
    steps:[
      "En Learn-C.org haz Hello, World!, Variables and Types, Conditions, Strings, Functions y Pointers.",
      "Escribe y compila clave.c en tu Kali (WSL), para Linux y para Windows.",
      "Busca con `strings` la contraseña dentro del binario y escribe por qué aparece.",
      "Pega clave.c en Compiler Explorer y relaciona cada línea de C con su ensamblador."
    ],
    hint:"Tu `clave.exe` será tu primer crackme propio. Como conoces la solución, sabrás si estás leyendo bien cuando lo abras en Ghidra y x64dbg.",
    quiz:[
      {q:"¿Qué se pierde al compilar un programa sin símbolos?",o:["Los textos literales","Los nombres de variables y los comentarios","Las llamadas a funciones de Windows","Los saltos"],a:1,e:"Los textos y las llamadas siguen ahí. Los nombres y los comentarios desaparecen."},
      {q:"¿Qué devuelve `strcmp(a, b)` cuando los dos textos son iguales?",o:["1","Un error","0","La longitud del texto"],a:2,e:"Devuelve 0 si son iguales. Por eso verás `test eax, eax` justo después de la llamada."},
      {q:"¿Qué produce `x86_64-w64-mingw32-gcc`?",o:["Un ejecutable PE (.exe) de Windows","Un ELF de Linux","Un script de Python","Una librería de Java"],a:0,e:"MinGW-w64 compila para Windows desde Linux."}
    ],
    cards:[
      ["¿Por qué `strings` encuentra la contraseña en clave.exe?","Los textos literales se guardan tal cual dentro del binario, en una sección de datos de solo lectura."],
      ["ELF frente a PE","ELF es el formato ejecutable de Linux. PE es el de Windows (.exe, .dll)."],
      ["¿Qué hace un compilador?","Traduce el código fuente a código máquina que la CPU ejecuta."]
    ],
    keys:["Compilar borra nombres, pero deja textos, llamadas y saltos.","Lo que sobrevive son tus pistas de analista."] },

  { id:"p5mal03", track:"malware", mod:"Fundamentos", lvl:4, blocks:3, title:"Ensamblador x86-64 para leer código",
    goal:"Leer bloques de ensamblador x86-64: registros, pila, llamadas a funciones y decisiones.",
    links:[
      ["OpenSecurityTraining2: Architecture 1001, x86-64 Assembly (gratis)","https://p.ost2.fyi/courses/course-v1:OpenSecurityTraining2+Arch1001_x86-64_Asm+2021_v1/about"],
      ["TryHackMe: x86 Architecture Overview","https://tryhackme.com/room/x8664arch"],
      ["TryHackMe: x86 Assembly Crash Course (Premium)","https://tryhackme.com/room/x86assemblycrashcourse"],
      ["Compiler Explorer (godbolt.org)","https://godbolt.org/"]
    ],
    concept:[
      "Los **registros** son pequeñas cajas dentro de la CPU. `RAX` guarda el resultado de una función. En Windows x64, `RCX`, `RDX`, `R8` y `R9` llevan los argumentos primero, segundo, tercero y cuarto. `RSP` apunta a la cima de la pila, `RBP` suele marcar la base del marco de la función y `RIP` apunta a la siguiente instrucción. `EAX` es la mitad baja (32 bits) de `RAX`.",
      "La **pila** («stack») es memoria donde lo último que entra es lo primero que sale. `push` mete un valor y `pop` lo saca. `call` guarda en la pila la dirección de retorno y salta a la función, y `ret` vuelve a esa dirección. En Windows x64 cada función reserva 32 bytes de **shadow space** (espacio de sombra), y por eso verás a menudo `sub rsp, 28h` al principio.",
      "Con unas 20-30 instrucciones lees casi todo. `mov` copia, `lea` calcula una dirección, `add`/`sub` suman y restan, `xor eax, eax` pone EAX a 0, `cmp` compara restando sin guardar el resultado, `test` hace un AND sin guardarlo, `jmp` salta siempre, `je`/`jz` saltan si es igual o cero y `jne`/`jnz` si no lo es. Un `if` se ve como `cmp` o `test` seguido de un salto condicional.",
      "Se usa la **sintaxis Intel**, la de Ghidra y x64dbg, donde el destino va primero: `mov rax, rbx` significa rax ← rbx. Los corchetes indican memoria: `mov eax, [rbp-4]` lee una variable local."
    ],
    flow:["¿Qué función se llama? (call)","¿Con qué argumentos? (rcx, rdx, r8, r9)","¿Qué devuelve? (rax)","¿Qué se decide después? (cmp/test + salto)"],
    steps:[
      "Completa la sala x86 Architecture Overview de TryHackMe.",
      "En OST2 Architecture 1001, termina al menos las partes de registros, pila y llamadas a funciones.",
      "En Compiler Explorer, con el compilador de Microsoft, anota qué registro lleva cada argumento de `strcmp` en clave.c.",
      "Traduce al español, línea por línea, el bloque del `if` de clave.c."
    ],
    hint:"No intentes memorizarlo todo. Lee cada bloque con las cuatro preguntas del flujo. Una instrucción que no conoces se busca y se convierte en una tarjeta.",
    quiz:[
      {q:"En Windows x64, ¿qué registro lleva el primer argumento de una función?",o:["RAX","RSP","RDX","RCX"],a:3,e:"El orden es RCX, RDX, R8, R9. El resultado vuelve en RAX."},
      {q:"¿Qué hace `xor eax, eax`?",o:["Pone EAX a 0","Compara EAX consigo mismo y salta","Guarda EAX en la pila","Invierte los bits de EAX"],a:0,e:"Un XOR de un valor consigo mismo da 0. Es la forma corta de escribir un cero."},
      {q:"¿Qué hace `call`?",o:["Borra la pila","Guarda la dirección de retorno en la pila y salta a la función","Compara dos registros","Termina el programa"],a:1,e:"Después, `ret` recupera esa dirección y vuelve."}
    ],
    cards:[
      ["¿Qué guarda RIP?","La dirección de la siguiente instrucción que se ejecutará."],
      ["`test eax, eax` seguido de `jne`","Si EAX no es 0, salta. Es el patrón típico después de `strcmp`."],
      ["¿Qué significa `mov rax, rbx` en sintaxis Intel?","Copia RBX en RAX (el destino va primero)."]
    ],
    keys:["Argumentos en RCX, RDX, R8 y R9; resultado en RAX.","Un if es cmp/test + salto condicional.","call guarda el retorno en la pila; ret vuelve."] },

  { id:"p5mal04", track:"malware", mod:"Estático", lvl:4, blocks:3, title:"El formato PE y el triaje estático",
    goal:"Entender las partes de un ejecutable de Windows y hacer un primer análisis sin ejecutarlo: hashes, strings, cabeceras, imports, packers y capacidades.",
    links:[
      ["Microsoft: PE Format (referencia oficial)","https://learn.microsoft.com/en-us/windows/win32/debug/pe-format"],
      ["PE-bear (hasherezade, GitHub)","https://github.com/hasherezade/pe-bear"],
      ["pestudio (Winitor)","https://www.winitor.com/"],
      ["Practical Malware Analysis: archivos de los labs (GitHub)","https://github.com/mikesiko/PracticalMalwareAnalysis-Labs"],
      ["Detect It Easy (GitHub)","https://github.com/horsicq/Detect-It-Easy"],
      ["capa (Mandiant, GitHub)","https://github.com/mandiant/capa"],
      ["VirusTotal: buscar por hash","https://www.virustotal.com/gui/home/search"],
      ["TryHackMe: Dissecting PE Headers","https://tryhackme.com/room/dissectingpeheaders"]
    ],
    concept:[
      "**PE** («Portable Executable») es el formato de los `.exe` y `.dll`. Empieza con la cabecera DOS (los bytes «MZ», con un puntero en 0x3C), sigue la firma «PE\\0\\0», el **COFF File Header** (máquina, número de secciones y **TimeDateStamp**, la fecha de compilación), el **Optional Header** (**AddressOfEntryPoint**, **ImageBase** y los directorios que apuntan a imports, exports y recursos) y la tabla de **secciones**: `.text` (código), `.rdata` (constantes e imports), `.data` (variables) y `.rsrc` (recursos).",
      "Los **imports** son las funciones de Windows que pide el programa, agrupadas por DLL, y son la pista más rápida. `InternetOpenUrlA` sugiere red, `RegSetValueExA` sugiere cambios en el registro y `CreateRemoteThread` sugiere inyección. Una **RVA** («relative virtual address») es una dirección contada desde ImageBase cuando el programa ya está cargado en memoria.",
      "El **triaje estático** se hace sin ejecutar nada: 1) **hashes** (MD5/SHA256, la huella única para buscar e informar), 2) **strings** (FLOSS, que además recupera textos ofuscados), 3) cabeceras, imports y secciones (PE-bear, pestudio), 4) **packer** y **entropía** (Detect It Easy), 5) **capacidades** (capa). El resultado son hipótesis, no certezas.",
      "Seguridad operativa: en VirusTotal busca solo el **hash**. Nunca subas archivos que no sean públicos, porque lo que subes pueden verlo otros, incluido el atacante. Los labs de Practical Malware Analysis contienen código malicioso: solo se abren dentro de la VM."
    ],
    flow:["Hash","Strings","Cabeceras e imports","¿Empaquetado?","Capacidades → hipótesis"],
    steps:[
      "Calcula el SHA256 y el MD5 de Lab01-01.exe y Lab01-01.dll y busca el MD5 en VirusTotal desde tu laptop.",
      "Abre los dos en PE-bear y anota la fecha de compilación, las secciones y los imports.",
      "Revisa los indicadores de pestudio y los resultados de Detect It Easy y capa.",
      "Escribe 3 hipótesis sobre qué hace la pareja exe + dll, sin ejecutarla.",
      "Repite con tu clave.exe para ver cómo es un programa limpio."
    ],
    hint:"La fecha de compilación se puede falsificar. Anótala como dato, no como verdad.",
    quiz:[
      {q:"¿Qué son los bytes «MZ» al principio de un archivo?",o:["El final del archivo","El inicio de la cabecera DOS que tiene todo PE","La sección de código","La firma digital"],a:1,e:"MZ (0x5A4D) marca el inicio de todo ejecutable PE."},
      {q:"¿Qué haces con VirusTotal durante un análisis?",o:["Subir siempre la muestra","Mandar la muestra por correo","Nada, no sirve","Buscar solo el hash"],a:3,e:"Buscar el hash no revela nada nuevo. Subir un archivo puede alertar al atacante o filtrar datos."},
      {q:"El import `CreateRemoteThread` sugiere...",o:["Inyección de código en otro proceso","Compresión","Impresión de documentos","Reproducción de audio"],a:0,e:"Sirve para crear un hilo dentro de otro proceso, un paso típico de la inyección."}
    ],
    cards:[
      ["Las cinco fases del triaje estático","Hash, strings, cabeceras e imports, packer y entropía, capacidades."],
      ["¿Qué es una RVA?","Una dirección relativa a ImageBase cuando el programa ya está cargado en memoria."],
      ["¿Qué contiene .rdata?","Constantes de solo lectura, como textos, y normalmente la tabla de imports."]
    ],
    keys:["Los imports son la pista más rápida.","En VirusTotal se busca el hash; nunca se sube la muestra.","Del triaje salen hipótesis, no certezas."] },

  { id:"p5mal05", track:"malware", mod:"Inverso", lvl:5, blocks:3, title:"Ghidra paso a paso con crackmes legales",
    goal:"Usar Ghidra para encontrar y entender la lógica de un programa: primero tu clave.exe y después crackmes de crackmes.one.",
    links:[
      ["Ghidra (NSA, GitHub)","https://github.com/NationalSecurityAgency/ghidra"],
      ["Ghidra: Getting Started","https://github.com/NationalSecurityAgency/ghidra/blob/master/GhidraDocs/GettingStarted.md"],
      ["Ghidra: CheatSheet (atajos)","https://github.com/NationalSecurityAgency/ghidra/blob/master/GhidraDocs/CheatSheet.html"],
      ["crackmes.one","https://crackmes.one/"],
      ["crackmes.one: FAQ (reglas y seguridad)","https://crackmes.one/faq"],
      ["TryHackMe: Advanced Static Analysis (Premium)","https://tryhackme.com/room/advancedstaticanalysis"]
    ],
    concept:[
      "Un **desensamblador** muestra las instrucciones y un **descompilador** reconstruye un pseudocódigo parecido a C. **Ghidra** (gratis y de código abierto, publicado por la NSA) hace las dos cosas: la ventana **Listing** muestra el ensamblador y la ventana **Decompile** el pseudo-C, y las dos se mueven juntas.",
      "Si el programa no tiene símbolos, el nombre `main` no aparece y las funciones se llaman `FUN_140001450`. Hay dos caminos para llegar a lo importante: desde la función `entry` (el arranque que añade el compilador), siguiendo las llamadas, o desde una **string** interesante, usando sus **referencias cruzadas** (XREF, «quién usa esto»). El segundo suele ser el más rápido.",
      "El trabajo real es **renombrar y comentar**: `FUN_140001450` pasa a ser `comprobar_clave` y `local_28` pasa a ser `entrada`. Cada nombre bien puesto hace más legible todo lo demás.",
      "Un **crackme** es un programa hecho para practicar ingeniería inversa. crackmes.one prohíbe el malware real, pero permite comportamientos simulados, y es normal que el antivirus salte. Por eso los abres siempre en la VM, con snapshot y sin red."
    ],
    flow:["Importar y analizar","Strings → XREF","Leer el pseudocódigo","Renombrar y comentar","Confirmar la hipótesis ejecutando"],
    steps:[
      "Abre clave.exe en Ghidra y llega a la comparación desde la string «Correcto».",
      "Repite con clave_s.exe (sin símbolos) y anota qué cambia.",
      "Resuelve 2 crackmes de Windows de dificultad 1 sin mirar writeups.",
      "Escribe un mini writeup de uno que cuente cómo llegaste, no solo la respuesta."
    ],
    hint:"Si te atascas en un crackme, lee primero los comentarios de otros usuarios y deja pasar un día antes de abrir un writeup.",
    quiz:[
      {q:"¿Qué muestra la ventana Decompile de Ghidra?",o:["Los bytes en hexadecimal","El tráfico de red","El registro de Windows","Pseudocódigo parecido a C"],a:3,e:"Es el descompilador. Listing muestra el ensamblador."},
      {q:"¿Qué tecla renombra una función o variable en Ghidra?",o:["L","G","F9","Ctrl+C"],a:0,e:"L renombra (Edit Label, Rename Variable). G sirve para ir a una dirección."},
      {q:"¿Qué es una XREF?",o:["Un tipo de packer","Un registro de la CPU","Una referencia: las partes del programa que usan esa dirección","Una regla YARA"],a:2,e:"Te lleva de una string o una función a donde se usa."}
    ],
    cards:[
      ["Dos caminos para encontrar la lógica sin símbolos","Desde entry siguiendo llamadas, o desde una string usando sus XREF."],
      ["Atajos de Ghidra: G, L, Ctrl+L, Alt+←","Ir a una dirección, renombrar, cambiar el tipo de una variable y volver atrás."],
      ["Contraseña de los zips de crackmes.one","crackmes.one"]
    ],
    keys:["Strings → XREF → función → renombrar.","Los crackmes también se abren en la VM con snapshot."] },

  { id:"p5mal06", track:"malware", mod:"Dinámico", lvl:5, blocks:3, title:"Análisis dinámico dentro de la VM",
    goal:"Ejecutar una muestra de entrenamiento de forma controlada y registrar procesos, archivos, registro, red e instrucciones con un depurador.",
    links:[
      ["Sysinternals: Process Monitor","https://learn.microsoft.com/en-us/sysinternals/downloads/procmon"],
      ["Sysinternals: Process Explorer","https://learn.microsoft.com/en-us/sysinternals/downloads/process-explorer"],
      ["FakeNet-NG (Mandiant, GitHub)","https://github.com/mandiant/flare-fakenet-ng"],
      ["x64dbg: documentación","https://help.x64dbg.com/en/latest/"],
      ["REMnux: descargar la VM","https://docs.remnux.org/install-distro/get-virtual-appliance"],
      ["INetSim","https://www.inetsim.org/"],
      ["TryHackMe: Basic Dynamic Analysis (Premium)","https://tryhackme.com/room/basicdynamicanalysis"]
    ],
    concept:[
      "El **análisis dinámico** consiste en ejecutar la muestra **dentro de la VM aislada** y observar qué hace: los procesos que crea (Process Explorer), los archivos y claves de registro que toca (Process Monitor y Regshot) y a quién intenta conectarse (FakeNet-NG).",
      "El malware casi siempre busca «internet». **FakeNet-NG**, que corre dentro de FLARE-VM, o **INetSim**, que corre en REMnux, imitan servicios como DNS y HTTP y responden a todo. Así ves los dominios y las URLs sin que nada salga de la VM, y de ahí sacas los **IOCs de red**.",
      "Un **depurador** («debugger») ejecuta el programa instrucción a instrucción y te deja ver los registros y la memoria. Con x64dbg (gratis y de código abierto): **F2** pone un breakpoint (punto de parada), **F9** continúa, **F7** entra en una llamada, **F8** la pasa por encima y **Ctrl+F9** ejecuta hasta el `ret`.",
      "Sigue siempre la misma disciplina: snapshot limpio, capturas encendidas **antes** de ejecutar, ejecutar, esperar, detener las capturas, anotar desde fuera y restaurar. Nunca pases la red a NAT con una muestra ejecutada."
    ],
    flow:["Restaurar el snapshot limpio","Encender capturas (FakeNet-NG, Regshot, Procmon)","Ejecutar la muestra y esperar","Detener, filtrar y comparar","Anotar IOCs → restaurar"],
    steps:[
      "Haz una ejecución completa de Lab03-01.exe con FakeNet-NG, Regshot, Process Explorer y Procmon.",
      "Anota los procesos, archivos, claves de registro y dominios que observes.",
      "Depura clave.exe en x64dbg: detente en `strcmp` y lee sus dos argumentos en los registros.",
      "Opcional, si tienes 16 GB de RAM: monta REMnux con INetSim como internet falso."
    ],
    hint:"Procmon captura cientos de miles de eventos. Filtra primero por nombre de proceso y después por operación (RegSetValue, WriteFile, Process Create).",
    quiz:[
      {q:"¿Qué hace FakeNet-NG?",o:["Conecta la VM a internet de verdad","Es un antivirus","Desensambla el programa","Imita servicios de red y registra a dónde intenta conectarse la muestra"],a:3,e:"Responde como si fuera internet, pero nada sale de la VM."},
      {q:"En x64dbg, ¿qué hace F8?",o:["Ejecuta la siguiente instrucción y pasa por encima de las llamadas","Pone un breakpoint","Reinicia el programa","Entra dentro de la llamada"],a:0,e:"F8 es «step over». F7 es «step into» y F2 pone un breakpoint."},
      {q:"¿Qué haces justo antes de ejecutar la muestra?",o:["Pasar la red a NAT","Borrar los snapshots","Encender las capturas y comprobar que tienes un snapshot limpio","Subir la muestra a VirusTotal"],a:2,e:"Si las capturas no están encendidas antes, pierdes los primeros segundos, que son los más importantes."}
    ],
    cards:[
      ["Regshot: 1st shot, 2nd shot y Compare","Foto del registro antes, foto después y la lista de diferencias."],
      ["Atajos de x64dbg: F2, F7, F8, F9 y Ctrl+F9","Breakpoint, entrar, pasar por encima, continuar y ejecutar hasta el return."],
      ["¿Cómo combina Procmon los filtros?","Los filtros sobre el mismo campo se suman con O. Los filtros sobre campos distintos tienen que cumplirse todos (Y)."]
    ],
    keys:["Las capturas se encienden antes de ejecutar y se restaura al terminar.","Internet falso: FakeNet-NG o INetSim, nunca la red real.","El depurador confirma lo que viste en Ghidra."] },

  { id:"p5mal07", track:"malware", mod:"Técnicas", lvl:5, blocks:3, title:"Persistencia, inyección y packers: reconocer y detectar",
    goal:"Reconocer las técnicas más comunes del malware, nombrarlas con MITRE ATT&CK y escribir tu primera regla YARA probada.",
    links:[
      ["MITRE ATT&CK: Persistence (TA0003)","https://attack.mitre.org/tactics/TA0003/"],
      ["MITRE ATT&CK: Registry Run Keys / Startup Folder (T1547.001)","https://attack.mitre.org/techniques/T1547/001/"],
      ["MITRE ATT&CK: Process Injection (T1055)","https://attack.mitre.org/techniques/T1055/"],
      ["MITRE ATT&CK: Software Packing (T1027.002)","https://attack.mitre.org/techniques/T1027/002/"],
      ["Unprotect Project (técnicas de evasión y reglas)","https://unprotect.it/"],
      ["YARA: escribir reglas (documentación)","https://yara.readthedocs.io/en/stable/writingrules.html"],
      ["capa (Mandiant, GitHub)","https://github.com/mandiant/capa"],
      ["Sysinternals: Autoruns","https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns"],
      ["TryHackMe: Anti-Reverse Engineering (Premium)","https://tryhackme.com/room/antireverseengineering"]
    ],
    concept:[
      "Hay tres familias de técnicas que verás siempre. Aquí las estudias solo para reconocerlas y detectarlas. La **persistencia** sirve para sobrevivir al reinicio: claves Run del registro, servicios, tareas programadas o la carpeta de Inicio. La **inyección** ejecuta código dentro de otro proceso legítimo: `VirtualAllocEx` + `WriteProcessMemory` + `CreateRemoteThread`. En el **process hollowing** se crea un proceso suspendido, se vacía y se reemplaza su contenido. La **ofuscación** y los **packers** comprimen o cifran el código para esconderlo: UPX, muy pocos imports con `LoadLibrary`/`GetProcAddress`, secciones con nombres raros y entropía alta.",
      "Cada técnica deja **huellas** que un defensor puede buscar: imports y strings (análisis estático), claves y procesos nuevos (análisis dinámico, Autoruns y Procmon). Además, cada una tiene un ID en MITRE ATT&CK (T1547.001, T1055, T1027.002) que pondrás en tus informes.",
      "**capa** detecta capacidades y las asigna a ATT&CK. **YARA** es el lenguaje de las **reglas de detección**: `strings:` (textos o bytes en hexadecimal) más `condition:` (la lógica). Una buena regla combina varios rasgos poco comunes y comprueba que el archivo es un PE con `uint16(0) == 0x5A4D` («MZ»). **YARA-X**, de VirusTotal, es su sucesor y acepta casi todas las reglas sin cambios.",
      "UPX se deshace con `upx -d` sobre una **copia**. Los packers hechos a medida se desempaquetan con el depurador, un tema avanzado que tratan cursos como PMAT y GREM."
    ],
    flow:["Sospecha: imports, strings, entropía","Confirmación: capa, DIE, ejecución","Nombre ATT&CK","Regla YARA","Prueba: aciertos y falsos positivos"],
    steps:[
      "Averigua con Detect It Easy cuál de los labs del capítulo 1 está empaquetado y desempaqueta una copia con UPX.",
      "Compara en PE-bear los imports antes y después.",
      "Ejecuta capa sobre 3 labs de los capítulos 3, 11 o 12 y anota sus técnicas ATT&CK.",
      "Escribe una regla YARA para un lab y pruébala contra C:\\Windows\\System32 para descartar falsos positivos.",
      "Usa Autoruns para ver qué cambió en el arranque después de ejecutar un lab con persistencia."
    ],
    hint:"Una regla que solo busca «kernel32.dll» o «This program cannot be run in DOS mode» detecta todo Windows. Busca lo raro: rutas, mutex, dominios o mensajes propios de la muestra.",
    quiz:[
      {q:"Crear un proceso suspendido, reemplazar su memoria y reanudarlo es...",o:["Persistencia con claves Run","Empaquetado con UPX","Un keylogger","Process hollowing"],a:3,e:"Es una sub-técnica de Process Injection (T1055)."},
      {q:"¿Qué comprueba `uint16(0) == 0x5A4D` en una regla YARA?",o:["Que los dos primeros bytes son «MZ», es decir, que es un PE","Que el archivo mide 0x5A4D bytes","Que contiene la palabra «MZ» en cualquier sitio","Que está empaquetado"],a:0,e:"Lee 2 bytes en la posición 0 (little-endian). 0x5A4D corresponde a «MZ»."},
      {q:"¿Cuál es una señal típica de un ejecutable empaquetado?",o:["Muchísimos imports","Entropía alta y muy pocos imports","Una fecha de compilación antigua","Un icono personalizado"],a:1,e:"El código comprimido o cifrado parece aleatorio, y el desempaquetador solo necesita LoadLibrary y GetProcAddress."}
    ],
    cards:[
      ["Clave Run del usuario actual","HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run (T1547.001)"],
      ["Las 3 APIs de la inyección clásica","VirtualAllocEx, WriteProcessMemory y CreateRemoteThread."],
      ["Estructura de una regla YARA","rule nombre { meta: … strings: … condition: … }"]
    ],
    keys:["Persistencia, inyección y packers dejan huellas que se pueden detectar.","Cada comportamiento lleva su ID de ATT&CK.","Una regla YARA no está terminada hasta probar los falsos positivos."] },

  { id:"p5mal08", track:"malware", mod:"Proyecto", lvl:5, blocks:3, title:"Proyecto final: informe de malware con IOCs y YARA",
    goal:"Analizar de principio a fin una muestra de entrenamiento, entregar un informe profesional con IOCs, ATT&CK y una regla YARA probada, y elegir tu siguiente certificación.",
    links:[
      ["PMAT-labs (muestras del curso PMAT, GitHub)","https://github.com/HuskyHacks/PMAT-labs"],
      ["Practical Malware Analysis (libro, No Starch Press)","https://nostarch.com/malware"],
      ["MalwareBazaar (abuse.ch)","https://bazaar.abuse.ch/"],
      ["TCM Security: Practical Malware Analysis & Triage (PMAT)","https://tcm-sec.com/academy/practical-malware-analysis-triage/"],
      ["TCM Security: certificación PMRP","https://certifications.tcm-sec.com/pmrp/"],
      ["GIAC GREM","https://www.sans.org/cyber-security-certifications/giac-reverse-engineering-malware-grem"],
      ["TryHackMe: módulo Malware Analysis (Premium)","https://tryhackme.com/module/malware-analysis"]
    ],
    concept:[
      "El producto de un analista de malware es el **informe**: qué es la muestra, qué hace, cómo se detecta y cómo se limpia. Lo leen el SOC, el equipo de respuesta a incidentes y la dirección, así que empieza con un resumen sin tecnicismos.",
      "Los **IOCs** («indicators of compromise», indicadores de compromiso) son hashes, dominios, IPs, URLs, rutas de archivo, claves de registro y nombres de mutex o de servicio. Se publican **desactivados** («defanged»), por ejemplo `hxxp://ejemplo[.]com`, para que nadie haga clic por accidente.",
      "Usa muestras de **entrenamiento**: los labs de Practical Malware Analysis o los de PMAT-labs. Ojo: PMAT-labs mezcla muestras escritas por el autor con malware real «capturado en el mundo» (contraseña `infected`). MalwareBazaar comparte malware real y aquí te sirve para consultar hashes y reportes, no para descargar. theZoo contiene malware vivo, incluso gusanos que intentan propagarse: no lo uses en esta ruta. Nunca publiques binarios, solo tu informe y tus reglas.",
      "Siguiente paso: la **PMRP** de TCM Security (499 USD; incluye más de 9 horas de formación, un intento con una repetición gratis, 5 días de análisis y 2 de informe, sin preguntas tipo test). El curso PMAT también viene en la suscripción All-Access, desde 29,99 USD/mes. La **GREM** de GIAC cuesta 999 USD el intento sin curso, y el curso oficial FOR610 de SANS 8.780 USD. Es una meta a medio plazo, idealmente pagada por una empresa."
    ],
    flow:["Elegir la muestra y hacer un snapshot propio","Triaje estático y análisis dinámico","Confirmar en Ghidra y x64dbg","IOCs + ATT&CK + YARA probada","Informe, portafolio y siguiente certificación"],
    steps:[
      "Elige una muestra de entrenamiento que no hayas analizado y crea su snapshot de inicio.",
      "Haz el triaje estático y el análisis dinámico completos, con capturas de pantalla.",
      "Escribe una regla YARA que detecte la muestra y no dé falsos positivos en System32.",
      "Redacta el informe con la plantilla de la guía y súbelo a tu portafolio de GitHub, sin binarios.",
      "Decide tu siguiente paso: PMRP, más práctica gratis o GREM a medio plazo, y apúntalo en tu plan."
    ],
    hint:"No abras la carpeta `answers` de PMAT-labs ni ninguna solución hasta haber terminado tu informe. Compara después y anota lo que se te escapó.",
    quiz:[
      {q:"¿Cómo se escribe de forma segura una URL maliciosa en un informe?",o:["http://malo.com","malo.com/","hxxp://malo[.]com","https://malo.com"],a:2,e:"Al desactivarla («defang») no se puede pulsar por accidente."},
      {q:"¿Qué NO subes a tu repositorio de GitHub?",o:["Los hashes","La regla YARA","Las técnicas ATT&CK","El binario de la muestra"],a:3,e:"Distribuir la muestra es peligroso y puede ser delito (Ley 53-07, art. 8). Con el hash basta para identificarla."},
      {q:"¿Cómo es el examen PMRP?",o:["Un test de opción múltiple","Práctico: analizas muestras y entregas un informe","Solo ver vídeos","Una entrevista oral"],a:1,e:"Son 5 días de análisis y 2 días para escribir el informe profesional."}
    ],
    cards:[
      ["Tipos de IOC","Hashes, dominios, IPs, URLs, rutas, claves de registro, mutex y servicios."],
      ["Defang de 10.0.0.5 y evil.com","10.0.0[.]5 y evil[.]com"],
      ["PMRP frente a GREM","PMRP: práctica, 499 USD con formación. GREM: 66 preguntas en 3 horas, 999 USD el intento sin curso."]
    ],
    keys:["El valor está en el informe: IOCs, ATT&CK y detección.","Nunca publiques ni compartas muestras.","Primero PMRP; GREM a medio plazo."] }
);

Object.assign(PRACTICE, {
  p5mal01: [[0,"Descarga VirtualBox para «Windows hosts» e instálalo con las opciones por defecto."],[1,"Regístrate y descarga el ISO de Windows 11 Enterprise de 64 bits en inglés."],[2,"Lee los apartados de requisitos e instalación del README y sigue la guía de esta unidad."],[3,"Lee los artículos 6, 8, 10 y 11 y escribe en tu cuaderno qué conducta castiga cada uno."]],
  p5mal02: [[0,"Haz los capítulos Hello, World!, Variables and Types, Conditions, Strings, Functions y Pointers."],[1,"Pega clave.c, elige C y x86-64 gcc con -O0 y relaciona los colores de cada línea con su ensamblador."]],
  p5mal03: [[0,"Inscríbete (Enroll) y termina las partes de registros, pila y llamadas a funciones."],[1,"Pulsa Join Room y responde todas las tareas."],[2,"Opcional, con Premium: haz la sala completa, incluida la tarea Practice Time."],[3,"Compila clave.c con x64 msvc y /Od y anota qué registro lleva cada argumento de strcmp."]],
  p5mal04: [[0,"Lee las secciones MS-DOS Stub, Signature, COFF File Header, Optional Header y Section Table."],[1,"Abre Lab01-01.exe en PE-bear dentro de la VM y recorre sus cabeceras."],[2,"Abre la muestra en pestudio y revisa los indicadores y los imports marcados."],[3,"Lee las advertencias del README y usa los labs del capítulo 1 solo dentro de la VM."],[4,"Pasa los labs del capítulo 1 por Detect It Easy y mira compilador, packer y entropía."],[5,"Ejecuta capa sobre Lab01-01.exe y lee su tabla de ATT&CK."],[6,"Teclea el MD5 de cada lab desde tu laptop y lee cuántos motores lo detectan."],[7,"Opcional: haz la sala para repasar cada cabecera con un editor hexadecimal."]],
  p5mal05: [[0,"Comprueba en Releases la última versión de Ghidra (FLARE-VM ya la trae instalada)."],[1,"Lee qué JDK necesita y cómo se arranca con ghidraRun.bat."],[2,"Copia en tu cuaderno los atajos G, L, Ctrl+L y Alt+←."],[3,"Busca crackmes de Windows en C/C++ de dificultad 1 y descarga dos dentro de la VM."],[4,"Lee las reglas, la contraseña de los zips y los consejos de seguridad."],[5,"Opcional, con Premium: haz la sala para practicar Ghidra con una muestra real."]],
  p5mal06: [[0,"Captura una ejecución de Lab03-01.exe y fíltrala por proceso y operación."],[1,"Observa los procesos que aparecen y mira en Properties → Strings los textos en memoria."],[2,"Arranca FakeNet-NG como administrador antes de ejecutar la muestra y lee su informe HTML."],[3,"Consulta la parte GUI manual cuando no sepas qué hace una ventana de x64dbg."],[4,"Opcional, con 16 GB de RAM: descarga la OVA de VirtualBox y comprueba su SHA-256."],[5,"Opcional: lee qué servicios simula INetSim antes de configurarlo en REMnux."],[6,"Opcional, con Premium: haz la sala para practicar Procmon, API Monitor y Regshot."]],
  p5mal07: [[0,"Lee la lista de técnicas de persistencia y elige 3 para tus tarjetas."],[1,"Anota las claves Run que vigila un defensor."],[2,"Lee las sub-técnicas y fíjate en Process Hollowing y DLL Injection."],[3,"Lee la descripción y relaciónala con lo que muestra Detect It Easy."],[4,"Busca una técnica antidepuración y lee la regla de detección que la acompaña."],[5,"Lee las secciones de strings (text, hex, modificadores) y conditions."],[6,"Ejecuta capa -vv sobre un lab y salta a una de las direcciones en Ghidra."],[7,"Guarda el estado de Autoruns antes de ejecutar un lab y compáralo después."],[8,"Opcional, con Premium: haz la sala de antidepuración, detección de VM y packers."]],

Object.assign(UNIT_GUIDES, {
  p5mal01: [
    { t:"Prepara tu laptop y crea la máquina virtual", s:[
      "Mira la RAM y el disco de tu laptop: pulsa **Ctrl + Shift + Esc** para abrir el Administrador de tareas → pestaña **Rendimiento** → **Memoria** (arriba a la derecha ves el total). Para el disco: Explorador de archivos → **Este equipo**. Necesitas al menos 8 GB de RAM (16 GB es lo ideal) y unos 100 GB libres.",
      "Abre el enlace 0 (VirtualBox) y pulsa **Windows hosts**. Instala con las opciones por defecto; el instalador avisa de que la red se cortará un momento, y es normal. Como ya usas WSL2, VirtualBox funcionará encima de Hyper-V. Va algo más lento, pero funciona.",
      "Abre el enlace 1, rellena el registro y descarga el **ISO** de **Windows 11 Enterprise** de 64 bits en inglés (unos 6 GB). Es una evaluación gratuita de 90 días. Cuando caduque, repetirás esta guía, así que apunta cada decisión en tu cuaderno.",
      "En VirtualBox pulsa **New**. Nombre: `FLARE-VM`. En **ISO Image** elige el ISO descargado y VirtualBox detectará Windows 11. Si ofrece la instalación desatendida («Unattended Install»), úsala: usuario `analista` (sin espacios ni acentos, porque FLARE-VM lo exige), una contraseña que apuntes y **Guest Additions** marcado (hace falta para las carpetas compartidas).",
      "Hardware: 4096 MB de RAM (8192 si tu laptop tiene 16 GB) y 2 CPU. Disco: 100 GB «dynamically allocated», que solo ocupa en tu disco lo que de verdad se usa. Pulsa **Finish**.",
      "Antes de arrancar, ve a **Settings** → **Network** y deja **NAT**, porque de momento necesitas internet para instalar. Pulsa **Start**. Si la instalación no fue desatendida y Windows te pide una cuenta, busca **Sign-in options** → **Domain join instead** para crear una cuenta local. Nunca uses tu cuenta Microsoft personal en esta VM.",
      "Deberías ver el escritorio de Windows 11 dentro de una ventana. Toma tu primer snapshot: en VirtualBox, pulsa el icono de menú (≡) junto al nombre de la VM → **Snapshots** → **Take** → nombre `00-windows-base`."
    ], learn:"Una VM es un ordenador desechable, y un snapshot te devuelve a un punto conocido." },
    { t:"Instala FLARE-VM dentro de la VM", s:[
      "Dentro de la VM, desactiva la protección contra alteraciones: Inicio → escribe `Windows Security` → **Virus & threat protection** → **Manage settings** → **Tamper Protection** en **Off**. FLARE-VM trae herramientas que Defender confunde con malware. Esto se hace **solo en la VM**, nunca en tu laptop.",
      "Apaga Defender por directiva: **Win + R** → `gpedit.msc` → **Computer Configuration** → **Administrative Templates** → **Windows Components** → **Microsoft Defender Antivirus** → doble clic en «Turn off Microsoft Defender Antivirus» → **Enabled** → **OK**.",
      "Apaga las actualizaciones hasta que termine la instalación, como pide el README: en la misma ventana ve a **Windows Components** → **Windows Update** (en Windows 11, subcarpeta **Manage end user experience**) → «Configure Automatic Updates» → **Disabled**. Reinicia la VM y toma el snapshot `00b-antes-de-flare`.",
      "En la VM abre Edge, entra en el enlace 2 (FLARE-VM) y busca el apartado «Installation» del README. Abre **PowerShell como administrador** (clic derecho en Inicio → **Terminal (Admin)**) y pega el comando que descarga `install.ps1` al escritorio. Cópialo de la página: escribirlo a mano da errores.",
      "Escribe `cd $env:USERPROFILE\\Desktop` (te lleva al escritorio). Después `Unblock-File .\\install.ps1`, que quita la marca de «descargado de internet», y `Set-ExecutionPolicy Unrestricted -Force`, que permite ejecutar scripts en esta VM. Por último, `.\\install.ps1`.",
      "Se abre una ventana para elegir paquetes. Deja la selección por defecto y comprueba que incluye `ghidra.vm`, `x64dbg.vm`, `pebear.vm`, `pestudio.vm`, `capa.vm`, `fakenet-ng.vm`, `sysinternals.vm`, `yara.vm` y `pma-labs.vm` (los labs del libro).",
      "La instalación tarda varias horas y reinicia la VM varias veces. Déjala trabajar. Cuando acabe, verás el fondo de escritorio de FLARE-VM y las herramientas en el menú Inicio."
    ], learn:"FLARE-VM instala un laboratorio completo, pero solo en una VM preparada para ello." },
    { t:"Aísla la VM y fija tu ciclo de trabajo seguro", s:[
      "Apaga la VM. Ve a **Settings** → **Network** → **Adapter 1** → **Attached to:** **Internal Network**, nombre `malnet`. Qué hace cada opción: **NAT** sale a internet por tu router (solo para instalar o descargar); **Bridged Adapter** convierte la VM en un equipo más de tu casa (nunca); **Host-only Adapter** la deja ver tu laptop (no lo usarás); **Internal Network** solo conecta VMs entre sí; **Not attached** equivale a desconectar el cable.",
      "En **General** (pestaña **Advanced** o **Features**, según la versión) pon **Shared Clipboard** y **Drag'n'Drop** en **Disabled**. En **USB** desmarca **Enable USB Controller**. En **Shared Folders** comprueba que no haya ninguna carpeta.",
      "Arranca la VM, abre PowerShell y escribe `ping 8.8.8.8`. Debe fallar: si no recibe respuestas, el aislamiento funciona. Apaga la VM y toma el snapshot `01-limpia` (con la VM apagada es más rápido y ocupa menos).",
      "Ciclo de análisis: elige `01-limpia` → **Restore** (desmarca la opción de guardar el estado actual) → analiza → anota desde tu laptop con capturas (**Win + Shift + S**) → restaura otra vez. Nada sale de la VM.",
      "Para meter material (zips de labs o crackmes) usa una «ventana de descarga»: restaura `01-limpia` → cambia la red a **NAT** → descarga los archivos **sin descomprimir** (vienen protegidos con contraseña) → apaga → vuelve a **Internal Network** → snapshot `02-con-material`. Nunca pongas NAT después de haber ejecutado una muestra: primero restaura.",
      "Para meter tus propios archivos inofensivos (como clave.exe de la unidad 02), con la VM en estado limpio: **Shared Folders** → icono de carpeta con + → elige `C:\\Users\\TuUsuario\\lab-entrada` y marca **Read-only**. Copia el archivo al escritorio de la VM y quita la carpeta compartida antes de tocar cualquier muestra.",
      "Regla de oro: nunca descomprimas una muestra en tu laptop. Defender y las actualizaciones de tu laptop siguen siempre activos."
    ], learn:"Aislamiento + snapshot + puentes cortados = analizar sin poner en riesgo tu casa." }
  ],
  p5mal02: [
    { t:"Compila tu primer programa y mira qué queda dentro", s:[
      "Abre Kali (tecla Windows → `kali`) y escribe `sudo apt update && sudo apt install -y gcc mingw-w64 binutils`. `gcc` compila C para Linux, `mingw-w64` compila `.exe` de Windows desde Linux y `binutils` trae `objdump` y `strings`.",
      "Crea una carpeta y entra en ella: `mkdir -p ~/re && cd ~/re`. Abre el editor con `nano clave.c` y escribe en las dos primeras líneas `#include <stdio.h>` y `#include <string.h>`.",
      "Debajo escribe: `int main(void) { char in[32]; printf(\"Clave: \"); scanf(\"%31s\", in); if (strcmp(in, \"dominicana26\") == 0) printf(\"Correcto\\n\"); else printf(\"Incorrecto\\n\"); return 0; }`. `%31s` lee como mucho 31 caracteres, para no desbordar los 32 de `in`. Guarda con **Ctrl + O**, Enter, y sal con **Ctrl + X**.",
      "Compila para Linux con `gcc -O0 clave.c -o clave` (`-O0` desactiva las optimizaciones para que el código sea más fácil de leer; `-o` da nombre al resultado). Ejecútalo con `./clave` y prueba una clave mala y la buena.",
      "Escribe `file clave`: deberías ver «ELF 64-bit LSB … x86-64». Después escribe `strings clave | less` y baja con las flechas: aparecen tu contraseña, «Correcto» y «Incorrecto». Sal con **q**.",
      "Desensambla con `objdump -d -M intel clave | less` (`-d` desensambla y `-M intel` usa la sintaxis de Ghidra y x64dbg). Escribe `/<main>` y pulsa Enter para saltar a main. Busca la línea `call` que llama a `strcmp`.",
      "Compila para Windows con `x86_64-w64-mingw32-gcc -O0 clave.c -o clave.exe` y otra versión sin símbolos con `x86_64-w64-mingw32-gcc -O0 -s clave.c -o clave_s.exe` (`-s` quita los nombres). Escribe `file clave.exe`: deberías ver «PE32+ executable … x86-64, for MS Windows».",
      "Copia los dos a Windows: `mkdir -p /mnt/c/Users/TuUsuario/lab-entrada && cp clave.exe clave_s.exe /mnt/c/Users/TuUsuario/lab-entrada/` (cambia TuUsuario por tu usuario). Esa es la carpeta que compartirás en solo lectura con la VM. Son programas tuyos e inofensivos."
    ], learn:"Un binario conserva textos, llamadas y saltos aunque pierda los nombres." },
    { t:"Compiler Explorer: código y ensamblador lado a lado", s:[
      "Abre el enlace 1 en Brave. En el panel izquierdo (el código), elige **C** en el desplegable de lenguaje.",
      "Borra el ejemplo y pega clave.c. En el panel derecho (el compilador), elige un «x86-64 gcc» reciente y escribe `-O0` en el cuadro de opciones del compilador.",
      "Pasa el ratón por una línea de C: su ensamblador se ilumina del mismo color. Busca la línea del `if`: verás la `call` a `strcmp`, después un `test eax, eax` y un salto condicional.",
      "Cambia `-O0` por `-O2`: el código se acorta y se reordena. Así suele verse el malware real, que se compila optimizado.",
      "Añade un segundo compilador desde el menú **Add new...** del panel de código → **Compiler** y elige un «x64 msvc», el compilador de Microsoft con el que se compila buena parte del malware de Windows. Fíjate en los registros que se cargan justo antes de `call strcmp`; en la unidad 03 aprenderás por qué son esos."
    ], learn:"Compiler Explorer conecta cada línea de C con sus instrucciones." }
  ],
  p5mal03: [
    { t:"Ruta de estudio: registros, pila y llamadas", s:[
      "Abre el enlace 1 (x86 Architecture Overview) y pulsa **Join Room**. Lee las tareas sobre CPU, registros, memoria y «Stack Layout» y responde. La página no indicaba que fuera Premium; si cuando llegues lo es, sáltala, porque OST2 cubre lo mismo gratis.",
      "Abre el enlace 0 (OST2), crea tu cuenta y pulsa **Enroll**. El curso pide sentirte cómodo con C, que es justo lo que hiciste en la unidad 02. Haz los vídeos y ejercicios de registros, pila y llamadas a funciones.",
      "En tu cuaderno, haz una tabla con cada registro (RAX, RBX, RCX, RDX, R8, R9, RSP, RBP, RIP) y su papel en Windows x64.",
      "Dibuja la pila antes y después de un `call` y de un `ret`: dónde queda la dirección de retorno y hacia dónde se mueve RSP (la pila crece hacia direcciones más bajas).",
      "Cada instrucción nueva que veas (`lea`, `movzx`, `imul`, `sar`…) se convierte en una tarjeta: anverso, la instrucción; reverso, qué hace en una frase.",
      "Opcional, con Premium de TryHackMe: el enlace 2 (x86 Assembly Crash Course) repasa instrucciones, flags y saltos, y termina con una tarea de práctica."
    ], learn:"Con los registros, la pila y unas 20 instrucciones ya puedes leer funciones reales." },
    { t:"Lee la llamada a strcmp como un analista", s:[
      "En Compiler Explorer (enlace 3), pega clave.c, elige **C** y un compilador «x64 msvc». En el cuadro de opciones escribe `/Od`, que en el compilador de Microsoft desactiva las optimizaciones.",
      "Busca `call strcmp`. Justo antes verás dos instrucciones que cargan direcciones en `rcx` y en `rdx`: son el primer y el segundo argumento. Averigua cuál es tu entrada y cuál la clave fija.",
      "Justo después del `call` busca `test eax, eax` y el salto condicional. Pregúntate: si `strcmp` devuelve algo distinto de 0, ¿a qué mensaje salta?",
      "Al principio de `main` busca `sub rsp, …` (la reserva de pila, que incluye el shadow space) y al final `add rsp, …` y `ret`.",
      "Escribe en tu cuaderno el pseudocódigo que reconstruyes solo a partir del ensamblador y compáralo con tu clave.c. Esa es la habilidad que usarás en Ghidra."
    ], learn:"Preguntas fijas: qué función, qué argumentos, qué devuelve y qué decide." }
  ],
  p5mal04: [
    { t:"Hashes y strings dentro de la VM", s:[
      "Restaura el snapshot `01-limpia` y comprueba que la red está en **Internal Network**. FLARE-VM instala los labs del libro con el paquete `pma-labs.vm`; búscalos en el menú Inicio o en el escritorio. Si no están, descarga `PracticalMalwareAnalysis-Labs.7z` (enlace 3) en una ventana de descarga y extráelo **en la VM** con clic derecho → **7-Zip** → **Extract Here**, contraseña `malware`.",
      "Los labs se escribieron para Windows XP: algunos no se ejecutarán en Windows 11, pero para el análisis estático da igual. En esta unidad no ejecutas nada.",
      "Abre PowerShell en la carpeta del capítulo 1 (en el Explorador: **Shift + clic derecho** en la carpeta → abrir PowerShell o Terminal aquí). Escribe `Get-FileHash .\\Lab01-01.exe` (SHA256 por defecto) y `Get-FileHash .\\Lab01-01.exe -Algorithm MD5`. Haz lo mismo con `Lab01-01.dll`.",
      "En tu laptop, abre el enlace 6 (VirusTotal) en Brave y teclea el MD5 (32 caracteres) leyéndolo de la VM. Anota cuántos motores lo detectan y qué nombres le dan. Solo buscas el hash: no subes nada.",
      "Extrae los textos con `floss .\\Lab01-01.exe > strings_exe.txt`. `floss` (de FLARE) saca los textos normales y además recupera textos ofuscados; `>` guarda la salida en un archivo. Ábrelo con `notepad .\\strings_exe.txt`.",
      "Busca en los textos nombres de DLL, funciones de Windows, rutas de archivos, IPs o dominios y palabras raras. Repite con la DLL y marca lo que comparten los dos archivos."
    ], learn:"El hash identifica la muestra y los textos te dan las primeras pistas sin ejecutarla." },
    { t:"Cabeceras, imports, packer y capacidades", s:[
      "Abre **PE-bear** desde el menú Inicio y arrastra `Lab01-01.exe` a la ventana. Recorre las pestañas: **DOS Hdr** (los bytes «MZ» y el puntero a la cabecera PE), **File Hdr** (Time Date Stamp), **Optional Hdr** (Entry Point e Image Base) y **Section Hdrs** (nombres y tamaños).",
      "En **Imports**, pulsa cada DLL para ver sus funciones. Busca las que no conozcas en learn.microsoft.com (escribe el nombre de la función en el buscador) y anota para qué sirven.",
      "Abre **pestudio** (enlace 2; FLARE-VM ya lo trae) y arrastra el archivo. En el árbol de la izquierda revisa los indicadores, los imports (marca los que pestudio señala como sospechosos), las strings y las secciones.",
      "Abre **Detect It Easy** y arrastra el archivo: muestra el compilador y si hay un packer. Su botón **Entropy** enseña la entropía: cerca de 8 significa datos comprimidos o cifrados.",
      "En PowerShell escribe `capa .\\Lab01-01.exe`. Verás una tabla con técnicas de ATT&CK y una lista de capacidades. Con `capa -vv .\\Lab01-01.exe` (-vv significa «muy detallado») verás también en qué direcciones encontró cada una. Si capa avisa de que la muestra está empaquetada, apúntalo para la unidad 07.",
      "Repite todo con tu `clave.exe` (unidad 02): pocos imports, sin packer y con textos claros. Te sirve de referencia de cómo es un programa limpio.",
      "Escribe tres hipótesis sobre lo que hacen Lab01-01.exe y su DLL, y qué import o qué texto apoya cada una. Restaura el snapshot al terminar."
    ], learn:"Imports, secciones y entropía te dicen mucho antes de ejecutar nada." }
  ],
  p5mal05: [
    { t:"Primer proyecto en Ghidra con tu clave.exe", s:[
      "FLARE-VM ya trae Ghidra: menú Inicio → **Ghidra**. Si alguna vez lo instalas fuera de FLARE-VM, necesitas el JDK que indica Getting Started (enlace 1; hoy, Java 25 de 64 bits). Después descargas el zip de **Releases** → **Assets** (no el «Source code»), lo descomprimes y ejecutas `ghidraRun.bat`.",
      "Mete `clave.exe` y `clave_s.exe` en la VM con la carpeta compartida de solo lectura (guía 3 de la unidad 01), con la VM en estado limpio. Cópialos al escritorio y quita la carpeta compartida.",
      "En Ghidra: **File → New Project…** → **Non-Shared Project** → elige una carpeta y el nombre `re-practica` → **Finish**.",
      "**File → Import File…** (o la tecla **I**) → elige `clave.exe` → **OK**. Ghidra detecta que es un PE de x86 de 64 bits. Haz doble clic en el archivo para abrir el **CodeBrowser**. Cuando pregunte si quieres analizarlo ahora, pulsa **Yes** y después **Analyze** con las opciones por defecto.",
      "**Window → Defined Strings**: busca «Correcto» y haz doble clic. Ghidra te lleva a esa dirección en Listing, donde verás una línea «XREF». Haz doble clic en la referencia (o clic derecho → **References → Show References to**) para ir a la función que usa el texto.",
      "En **Decompile** verás la llamada a `strcmp` y el `if`. Haz clic en el nombre de la función y pulsa **L** para renombrarla a `comprobar_clave`. Haz lo mismo con las variables. Si un tipo está mal, clic derecho → **Retype Variable** (**Ctrl + L**). Para dejar una nota, clic derecho en Listing → **Comments**.",
      "Para moverte: **G** va a una dirección, **Alt + ←** vuelve atrás y **Window → Symbol Tree** → **Functions** lista todas las funciones.",
      "Repite con `clave_s.exe`: ahora las funciones se llaman `FUN_…` y no hay `main`. El camino string → XREF sigue funcionando. Ese es el método que usarás con malware."
    ], learn:"Strings → XREF → pseudocódigo → renombrar: el método básico de Ghidra." },
    { t:"Crackmes legales de crackmes.one, paso a paso", s:[
      "En tu laptop, abre el enlace 3 y entra en **Search**. Filtra por dificultad 1 (como mucho 2), plataforma Windows y lenguaje C/C++. Lee la descripción y los comentarios, y elige uno que tenga varios writeups (señal de que se puede resolver).",
      "Lee la FAQ (enlace 4): no se admite malware real, pero el antivirus puede saltar y es normal. Todos los zips usan la contraseña `crackmes.one`.",
      "Descárgalo dentro de la VM con una ventana de descarga (guía 3 de la unidad 01) y vuelve a **Internal Network** antes de descomprimir. Extrae con 7-Zip.",
      "Haz primero el triaje de la unidad 04: Detect It Easy (lenguaje y packer) y `floss` (textos). Ejecútalo una vez en la VM sin red para ver qué mensajes muestra.",
      "En Ghidra: importa, analiza, busca esos mensajes en **Defined Strings** y sigue las XREF hasta la función que valida la entrada.",
      "Escribe en tu cuaderno el pseudocódigo de la validación con tus propias palabras. Comprueba tu respuesta ejecutando el crackme en la VM.",
      "Si llevas 45 minutos atascado, lee los comentarios. Deja los writeups para cuando hayas terminado o para el día siguiente.",
      "Al acabar, restaura el snapshot. Tu mini writeup va al portafolio de GitHub (crackmes.one permite publicar soluciones)."
    ], learn:"Los crackmes entrenan el método sin el riesgo del malware real." }
  ],
  p5mal06: [
    { t:"Tu primera ejecución controlada (Lab03-01)", s:[
      "Restaura `02-con-material` (o `01-limpia` si ya trae los labs) y comprueba que la red está en **Internal Network**. Los labs del capítulo 3 están hechos para el análisis dinámico básico.",
      "Arranca **FakeNet-NG** como administrador (menú Inicio → clic derecho → **Run as administrator**). Deja abierta su consola: ahí aparecerá cada petición DNS, HTTP o de otro tipo.",
      "Abre **Regshot** y pulsa **1st shot** para fotografiar el registro antes de ejecutar.",
      "Abre **Process Explorer** y **Process Monitor**. Procmon empieza a capturar solo: pulsa **Ctrl + X** para borrar lo capturado hasta ahora y empezar desde cero.",
      "Haz doble clic en `Lab03-01.exe` y espera 2 o 3 minutos. En Process Explorer, los procesos nuevos aparecen en verde y los que terminan, en rojo. Clic derecho en un proceso → **Properties** → pestaña **Strings** → opción **Memory** para ver sus textos en memoria.",
      "En Procmon pulsa **Ctrl + E** para detener la captura. Abre **Filter → Filter…** (**Ctrl + L**) y añade «Process Name» «is» `Lab03-01.exe` → **Include** → **Add**. Añade también «Operation» «is» `RegSetValue`, `WriteFile` y `Process Create` → **Include**, y pulsa **OK**. Los filtros sobre un mismo campo se suman con O, y los de campos distintos tienen que cumplirse todos (Y).",
      "En Regshot pulsa **2nd shot** y después **Compare**: se abre un informe con las claves añadidas y modificadas.",
      "En FakeNet-NG, lee qué dominios y peticiones aparecieron y detenlo con **Ctrl + C**: guarda un informe HTML en su carpeta.",
      "Apunta todo desde tu laptop (capturas con **Win + Shift + S**): procesos, archivos, claves y dominios. Después restaura el snapshot."
    ], learn:"Capturas antes, ejecución, filtros después y restaurar: el ciclo dinámico." },
    { t:"x64dbg: detén el programa en el momento justo", s:[
      "Mete `clave.exe` en la VM (carpeta de solo lectura con la VM limpia). Como es de 64 bits, abre **x64dbg** (si arrancas **x96dbg**, elige la versión de 64 bits). **File → Open** → `clave.exe`.",
      "El depurador se detiene en un breakpoint del sistema. Pulsa **F9** hasta que la barra de estado de abajo indique que estás en el punto de entrada («EntryPoint»).",
      "Ve a la pestaña **Symbols**. A la izquierda elige `msvcrt.dll` (la librería C que usa MinGW), escribe `strcmp` en el filtro de abajo, selecciónalo y pulsa **F2** para poner un breakpoint.",
      "Vuelve a la pestaña **CPU** y pulsa **F9**. En la consola de clave.exe escribe una clave falsa y pulsa Enter. x64dbg se detiene al entrar en `strcmp`.",
      "Mira el panel de registros a la derecha: junto a RCX y RDX, x64dbg muestra el texto al que apunta cada uno. Uno es tu entrada y el otro la clave real, tal como predijiste en la unidad 03.",
      "Pulsa **Ctrl + F9** para ejecutar hasta el `ret` de `strcmp` y mira RAX (0 si los textos son iguales). Después avanza con **F8** y observa el `test eax, eax` y el salto.",
      "Prueba a cambiar la decisión: en el panel de flags, haz doble clic en **ZF** antes del salto y pulsa **F9**. Así se «parchea» en memoria, y solo lo haces en tu propio programa o en un crackme.",
      "Con malware, x64dbg sirve para leer textos que solo aparecen descifrados en memoria. Ojo: depurar es ejecutar, así que se aplican las mismas reglas de la VM."
    ], learn:"Un breakpoint en la función adecuada te enseña los datos reales en los registros." },
    { t:"Opcional: REMnux con INetSim como internet falso", s:[
      "Solo si tu laptop tiene 16 GB de RAM (4 GB para cada VM). Descarga del enlace 4 la OVA para **VirtualBox** (unos 8 GB) y comprueba su hash en tu laptop con `Get-FileHash .\\nombre.ova` en PowerShell: tiene que coincidir con el SHA-256 publicado junto al enlace.",
      "En VirtualBox: **File → Import Appliance** → elige la OVA → **Finish**. Con la red en NAT, arranca y entra con el usuario `remnux` y la contraseña `malware` (cámbiala con `passwd`). Actualiza con `remnux install` como usuario normal, no root, como indica su documentación. Apaga y toma un snapshot.",
      "Cambia la red de REMnux a **Internal Network** `malnet`, la misma que FLARE-VM. Esta red no reparte IPs, así que las pones a mano. En REMnux, `ip a` te muestra el nombre de la interfaz (por ejemplo `enp0s3`). Después escribe `sudo ip addr add 10.10.10.1/24 dev enp0s3` y `sudo ip link set enp0s3 up` (la IP se pierde al reiniciar).",
      "Configura INetSim: `sudo nano /etc/inetsim/inetsim.conf` (si no está ahí, búscalo con `sudo find / -name inetsim.conf 2>/dev/null`). Quita el `#` de `service_bind_address` y pon `10.10.10.1`. Haz lo mismo con `dns_default_ip`. Guarda y arranca con `sudo inetsim`: debe listar los servicios iniciados (dns, http, https, smtp…).",
      "En FLARE-VM: **Win + R** → `ncpa.cpl` → clic derecho en **Ethernet** → **Properties** → **Internet Protocol Version 4 (TCP/IPv4)** → **Properties**. Pon IP `10.10.10.2`, máscara `255.255.255.0`, puerta de enlace `10.10.10.1` y DNS `10.10.10.1` → **OK**.",
      "Prueba: en FLARE-VM escribe `ping 10.10.10.1` y abre en Edge `http://cualquiercosa.com`. Debe salir la página por defecto de INetSim. No uses FakeNet-NG al mismo tiempo, porque los dos interceptan el tráfico.",
      "Toma un snapshot de cada VM. Por defecto, INetSim guarda sus registros en `/var/log/inetsim/`: ahí verás qué pidió la muestra."
    ], learn:"Dos VMs en una red interna: una analiza y la otra hace de internet falso." }
  ],
  p5mal07: [
    { t:"Packers: detectar y desempaquetar UPX", s:[
      "Restaura el snapshot con los labs. Pasa por Detect It Easy los archivos del capítulo 1: el que muestre «UPX» como packer es tu objetivo. Pulsa **Entropy** y compara su valor con el de los demás.",
      "Ábrelo en PE-bear: mira los nombres de las secciones (`UPX0`, `UPX1`) y compara el tamaño en disco (raw) con el tamaño en memoria (virtual) de la primera. Mira también lo pocos que son los imports.",
      "Trabaja siempre sobre una copia: `Copy-Item .\\LabXX.exe .\\LabXX_unpacked.exe` (cambia LabXX por el nombre real). Después `upx -d .\\LabXX_unpacked.exe`, que desempaqueta ese archivo (FLARE-VM trae UPX).",
      "Pasa la copia desempaquetada por Detect It Easy, PE-bear, `floss` y `capa`. Compara los imports y los textos con los de la versión empaquetada.",
      "Anota en tu cuaderno qué cambió y la técnica: T1027.002 (Software Packing)."
    ], learn:"Entropía alta, pocos imports y secciones raras delatan a un packer." },
    { t:"Persistencia e inyección: reconocerlas", s:[
      "Haz tu lista de APIs de vigilancia. Persistencia: `RegSetValueEx` junto a textos como `Software\\Microsoft\\Windows\\CurrentVersion\\Run`, `CreateService` y `schtasks`. Inyección: `OpenProcess`, `VirtualAllocEx`, `WriteProcessMemory` y `CreateRemoteThread`. Hollowing: `CreateProcess` con «CREATE_SUSPENDED», `NtUnmapViewOfSection`, `SetThreadContext` y `ResumeThread`. Busca cada una en learn.microsoft.com.",
      "Ejecuta `capa` sobre labs de los capítulos 3, 11 y 12 (comportamiento del malware y lanzamiento encubierto) y anota las técnicas ATT&CK que detecte. Con `capa -vv` ves las direcciones: en Ghidra pulsa **G**, pega una y lee esa función.",
      "Para comprobar la persistencia en ejecución, restaura el snapshot limpio y abre **Autoruns** (Sysinternals, enlace 7). Guarda el resultado desde el menú **File** antes de ejecutar el lab. Ejecútalo, refresca Autoruns y usa la opción de comparar del menú **File** con lo que guardaste. Las entradas nuevas son tu evidencia.",
      "Confírmalo en Procmon con el filtro «Operation» «is» `RegSetValue` y mira la columna **Path**: ¿aparece alguna clave Run (enlace 1)?",
      "Para la inyección, en Process Explorer activa **View → Lower Pane View → DLLs** y revisa los procesos legítimos que el lab haya podido tocar: busca DLLs con rutas raras o procesos de sistema lanzados por la muestra («Process Create» en Procmon).",
      "Asigna su ID de ATT&CK a cada comportamiento observado (enlaces 0-3) y restaura el snapshot."
    ], learn:"Imports + evidencia dinámica + ID de ATT&CK = una técnica bien identificada." },
    { t:"Tu primera regla YARA probada", s:[
      "Elige de un lab entre 3 y 5 rasgos poco comunes: textos raros, nombres de mutex, dominios o una secuencia de bytes. Evita lo que tiene cualquier programa, como `kernel32.dll` o «This program cannot be run in DOS mode».",
      "En la VM, abre Notepad++ y crea `lab_regla.yar` con esta estructura: `rule PMA_LabXX { meta: author = \"tu nombre\" description = \"qué detecta\" strings: $s1 = \"texto raro\" ascii wide nocase $s2 = \"otro texto\" ascii wide condition: uint16(0) == 0x5A4D and 2 of ($s*) }` (pon cada sección en su propia línea).",
      "Qué hace cada parte: `ascii wide` busca el texto en ASCII y en UTF-16; `nocase` ignora mayúsculas y minúsculas; `uint16(0) == 0x5A4D` exige «MZ» al principio; `2 of ($s*)` pide al menos dos de tus strings. Los bytes en hexadecimal se escriben entre llaves, por ejemplo `{ 6A 40 68 00 30 00 00 }`.",
      "En PowerShell escribe `yara64 -s .\\lab_regla.yar .\\LabXX.exe` (si no se llama así, escribe `yara` y pulsa **Tab** para ver el nombre exacto). `-s` muestra qué strings coincidieron. Debe imprimir el nombre de tu regla y el del archivo.",
      "Prueba los falsos positivos con `yara64 -r .\\lab_regla.yar C:\\Windows\\System32` (`-r` recorre las subcarpetas). No debe salir ninguna coincidencia; los avisos de archivos sin permiso puedes ignorarlos. Si sale alguna, tu regla es demasiado genérica: añade rasgos o exige más.",
      "Pásala también contra los otros labs del mismo capítulo: ¿detecta solo el que quieres? Guarda la regla para tu portafolio."
    ], learn:"Una buena regla acierta en la muestra y calla en un Windows limpio." }
  ],
  p5mal08: [
    { t:"Elige y prepara la muestra", s:[
      "Opción gratis: un lab de Practical Malware Analysis de los capítulos 3 u 11 que no hayas analizado aún. Opción PMAT (si pagas All-Access): un challenge del curso, como «SillyPutty». Las soluciones del libro (enlace 1) son de pago y opcionales.",
      "Si usas PMAT-labs (enlace 0), lee antes el README y el EULA. El repositorio mezcla muestras escritas por el autor con malware real, y todo va comprimido con la contraseña `infected`. Descárgalo dentro de la VM en una ventana de descarga y vuelve a **Internal Network** antes de extraer nada.",
      "Las muestras propias del autor solo se activan si `cosmo.jpeg` está en el escritorio del usuario de FLARE-VM. Cópialo allí como indica el README.",
      "Toma el snapshot `proyecto-inicio` y crea en tu laptop (no en la VM) la carpeta `informe-malware` con una subcarpeta `capturas` y un archivo `informe.md`.",
      "Planifica 3 bloques: análisis estático, análisis dinámico con confirmación en Ghidra y x64dbg, y redacción del informe."
    ], learn:"Una muestra de entrenamiento bien elegida y un snapshot propio para el proyecto." },
    { t:"Análisis completo y extracción de IOCs", s:[
      "Identificación: MD5, SHA1 y SHA256 con `Get-FileHash -Algorithm MD5` (cambia el algoritmo en cada caso), tamaño, tipo (Detect It Easy) y fecha de compilación (PE-bear). Busca el hash en MalwareBazaar (enlace 2) y en VirusTotal desde tu laptop.",
      "Estático: `floss`, pestudio y `capa`. Escribe tus hipótesis antes de ejecutar nada.",
      "Dinámico: el ciclo de la unidad 06 con FakeNet-NG (o INetSim), Procmon filtrado, Regshot y Autoruns.",
      "Confirmación: abre en Ghidra las funciones que señale `capa -vv` y usa x64dbg si hay textos que solo aparecen descifrados en memoria.",
      "Tabla de IOCs con 4 columnas: tipo | valor desactivado (`hxxp`, `[.]`) | dónde lo viste (estático o dinámico) | confianza (alta, media o baja).",
      "ATT&CK: un ID por cada comportamiento que observaste de verdad, no por lo que la muestra «podría» hacer.",
      "Regla YARA (unidad 07): debe coincidir con la muestra y dar 0 coincidencias en `C:\\Windows\\System32`.",
      "Restaura el snapshot al terminar cada sesión."
    ], learn:"Solo entra en el informe lo que observaste y puedes demostrar." },
    { t:"Escribe el informe y planifica el siguiente paso", s:[
      "Estructura del `informe.md`: 1) Resumen ejecutivo (3-5 líneas sin tecnicismos), 2) Identificación, 3) Análisis estático, 4) Análisis dinámico, 5) IOCs, 6) Técnicas ATT&CK, 7) Regla YARA, 8) Detección y limpieza recomendadas, 9) Anexos con capturas.",
      "En el apartado 8 explica cómo encontrar la muestra en otros equipos (la regla YARA, las claves de registro, los dominios en los registros de DNS) y cómo limpiarla (qué borrar, qué clave quitar y cuándo es mejor reinstalar).",
      "Revisa el informe en voz alta. ¿Lo entendería alguien del SOC que no vio tu análisis? ¿Cada afirmación tiene su captura o su dato?",
      "Publícalo en tu portafolio de GitHub, en un repositorio `analisis-malware`, solo con `informe.md`, las capturas y el `.yar`. **Nunca** subas el binario ni los zips. Si la muestra es de un curso, revisa su EULA antes de publicar.",

const timerPlan = u => u && u.p === 1 && u.blocks === 2 ? [["bloque 1", 50], ["descanso", 15], ["bloque 2", 50]] : [["recordar", 5], ["practicar", 35], ["cerrar", 5]];

  if (timer.uid !== u.id) timer = { uid: u.id, startedAt: 0, acc: 0, running: false };
  const plan = timerPlan(u), total = plan.reduce((a, p) => a + p[1], 0) * 60000;

/* ════════ Vista: Agenda ════════ */
function conflictFor(a) {
  if (!a.time || !a.date) return null;
  const dow = parseYmd(a.date).getDay(), s = toMin(a.time), e = s + (+a.min || 0);
  const hit = schedFor(dow).filter(b => ["school", "gym", "study", "sleep"].includes(b[3])).find(b => {
    const bs = toMin(b[0]), be = toMin(b[1]);
    if (be <= bs) return s < be || e > bs;
    return s < be && e > bs;
  });
  return hit ? hit[2] : null;
}
function agRow(a) {

}

/* ════════ Vista: Progreso ════════ */

  const acts = new Set(Object.keys(state.reviewLog)); done.forEach(u => sess(u.id).doneAt && acts.add(sess(u.id).doneAt));
  const active7 = Array.from({ length: 7 }, (_, k) => addDays(t, -k)).filter(d => acts.has(d)).length;
  const due = dueCards().length, wk = weekKey(), r = state.reviews[wk] || {};

  return `<div class="head">${cmdline("progreso")}<h1>Progreso<span class="cur"></span></h1><p class="muted">No solo cuánto haces: también si sigues bien el método.</p></div>

      ${hist.length ? `<div><span class="eyebrow">tus ganas semana a semana</span><div class="hist" style="margin-top:8px">${hist.map(h => `<i title="${fmtShort(h.k)}: ${h.g}" style="height:${h.g * 20}%"></i>`).join("")}</div></div>` : ""}</div>

function diagnostics(done, firstPct, due) {
  if (!done.length) return [];

  const rc = Math.round(done.filter(u => recallOk(sess(u.id))).length / done.length * 100);

    : firstPct >= 60 ? { c: "warn", t: "atento", h: `Aciertas el ${firstPct}% al primer intento.`, p: "Antes del quiz, explícate en voz alta lo que hiciste. Si no te sale, vuelve al concepto." }
    : { c: "bad", t: "ojo", h: `Aciertas solo el ${firstPct}% al primer intento.`, p: "Vas muy rápido por la práctica. Termina los pasos y relee el concepto antes de contestar." });
  const nt = Math.round(done.filter(u => notesOk(sess(u.id))).length / done.length * 100);
  out.push(nt >= 80 ? { c: "good", t: "bien", h: `Anotas en tu cuaderno (${nt}%).`, p: "Esas notas se convierten en tu método y tus informes." } : { c: "warn", t: "atento", h: `Solo anotas en el ${nt}% de las unidades.`, p: "Escribe al menos qué intentaste y qué funcionó. Son 2 minutos." });
  const ex = Math.round(done.filter(u => sess(u.id).explained).length / done.length * 100);

  out.push(due <= 20 ? { c: "good", t: "bien", h: "Tus tarjetas están al día.", p: "Repasarlas cada noche evita que se acumulen." } : { c: due > 40 ? "bad" : "warn", t: due > 40 ? "ojo" : "atento", h: `Tienes ${due} tarjetas acumuladas.`, p: "Haz el repaso de 15 minutos esta noche. En un par de días se normaliza." });
  const g = Object.keys(state.reviews).sort().map(k => state.reviews[k].ganas).filter(Boolean);
  if (g.length >= 2 && g.slice(-2).every(x => x <= 2)) out.push({ c: "bad", t: "habla", h: "Llevas dos semanas con pocas ganas.", p: "Para y háblalo conmigo antes de abandonar. Ajustamos el plan." });

}

    <div class="row"><button class="btn" data-action="export">copiar mi progreso</button></div>

    <div class="row">${ui.confirmImport ? `<span class="small">Esto reemplaza todo tu progreso actual.</span><button class="btn danger" data-action="import-yes">sí, restaurar</button><button class="btn ghost" data-action="import-no">cancelar</button>` : `<button class="btn" data-action="import">restaurar copia</button>`}</div>
    <div class="row">${ui.confirmReset ? `<span class="small">Se borrará todo tu progreso, en todos tus dispositivos.</span><button class="btn danger" data-action="reset-yes">sí, borrar todo</button><button class="btn ghost" data-action="reset-no">cancelar</button>` : `<button class="btn ghost" data-action="reset">empezar de cero</button>`}</div></div>`;
}

/* ════════ Acciones ════════ */
function setPath(path, value) {
  const ks = path.split("."); let o = state;
  for (let k = 0; k < ks.length - 1; k++) { const key = ks[k]; if (o[key] === undefined || o[key] === null || typeof o[key] !== "object") o[key] = {}; o = o[key]; }
  o[ks.at(-1)] = value;
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("copiado"), () => fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); toast(ok ? "copiado" : "No se pudo copiar: selecciónalo a mano");
}
function ensureStarted(n) { if (!state.phases[n].start) state.phases[n].start = todayStr(); }
function gradeQuiz(key, kind) {
  const sel = ui.quizSel[key] || [];
  let qs, holder, pass;
  if (kind === "exam") { const n = +key.slice(4); qs = GATES[n].exam; holder = state.phases[n]; pass = EXAM_PASS; }
  else { const u = UNIT[key]; qs = u.quiz; holder = sess(key); pass = PASS(qs); }
  const score = qs.reduce((a, q, k) => a + (sel[k] === q.a ? 1 : 0), 0);
  const field = kind === "exam" ? "exam" : "quiz";
  const rec = holder[field] || { attempts: 0, first: 0, best: 0 };
  if (rec.attempts === 0) rec.first = score;
  rec.attempts += 1; rec.best = Math.max(rec.best, score); rec.last = sel.slice(); rec.lastScore = score;
  holder[field] = rec; delete ui.quizSel[key]; save();
  toast(score >= pass ? `${score}/${qs.length}: aprobado` : `${score}/${qs.length}: lee las explicaciones y vuelve a intentarlo`);
}
document.addEventListener("click", e => {

  switch (a) {

    case "install": if (deferredInstall) { const ev = deferredInstall; ev.prompt(); ev.userChoice.then(c => { if (c && c.outcome === "accepted") { deferredInstall = null; justInstalled = true; } render(); }).catch(() => {}); } return;
    case "start-route": ensureStarted(1); save(); toast("Día 1. A por la sesión 01."); location.hash = "u-" + LESSONS[0].id; return;
    case "reveal-keys": ui.revealKeys[id] = true; break;
    case "reveal-hint": ui.revealHint[id] = true; break;
    case "step": { if (!U || isLocked(U) || sess(id).done) { if (sess(id).done) break; toast("Primero termina la unidad anterior"); return; } const s = sess(id), k = +b.dataset.k; for (let j = 0; j < U.steps.length; j++) s.steps[j] = !!s.steps[j]; s.steps[k] = !s.steps[k]; save(); break; }
    case "open-link": { if (!U) return; const k = AUTO_STEP[id] && AUTO_STEP[id][b.dataset.li]; if (k !== undefined && autoMark(id, +k, "abriste el enlace")) setTimeout(render, 400); return; }
    case "steps-all": { if (!U || isLocked(U) || sess(id).done) return; const s = sess(id); U.steps.forEach((_, j) => s.steps[j] = true); save(); toast(`[x] ${U.steps.length} pasos marcados`); break; }
    case "flag": { const s = sess(id); s[b.dataset.f] = !s[b.dataset.f]; save(); break; }
    case "block-plus": { const s = sess(id); if (s.blocksDone < U.blocks - 1) { s.blocksDone += 1; ensureStarted(U.p); save(); toast(`bloque ${s.blocksDone} de ${U.blocks} hecho`); } break; }
    case "block-minus": { const s = sess(id); if (s.blocksDone > 0) { s.blocksDone -= 1; save(); } break; }
    case "copy": copyText(b.dataset.text); return;
    case "pick": { const k = b.dataset.key, arr = ui.quizSel[k] || []; arr[+b.dataset.q] = +b.dataset.o; ui.quizSel[k] = arr; break; }
    case "quiz-submit": { const k = b.dataset.key; if (b.dataset.kind !== "exam" && UNIT[k] && isLocked(UNIT[k])) { toast("Primero termina la anterior"); return; } gradeQuiz(k, b.dataset.kind); break; }
    case "quiz-retry": ui.quizSel[b.dataset.key] = []; break;
    case "capture": {
      const s = sess(id); if (s.done || !U) return;
      if (isLocked(U)) { toast("Primero captura la anterior"); return; }
      const miss = reqItems(U, s).find(x => !x.ok); if (miss) { toast("Falta: " + miss.k.toLowerCase()); const el = document.getElementById(miss.k.startsWith("Escribir") ? "sec0" : miss.k.startsWith("Marcar") ? "sec1" : "sec2"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      s.done = true; s.doneAt = todayStr(); s.blocksDone = U.blocks; ensureStarted(U.p);
      U.cards.forEach(([q, ans]) => addCard(q, ans, `Fase ${U.p} · ${U.title}`));

    case "decide": state.decision[+b.dataset.k] = b.dataset.v === "1"; save(); break;
    case "override": state.phases[1].override = true; save(); break;
