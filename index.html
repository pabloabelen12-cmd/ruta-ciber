/* Guías de la Fase 3 (p3u01–p3u20) para Ruta Ciber.
   Se suman a UNIT_GUIDES. Imitan el estilo de s05/s10/s15/s24/s25.
   PLATFORM_GUIDES ya explica aparte: unirse a una sala de TryHackMe y usar
   Start Machine / Start AttackBox (thm), MITRE ATT&CK (mitre), OWASP Top 10
   (owasp), Burp y la Web Security Academy de PortSwigger (portswigger), la
   calculadora CVSS de NVD (nvd) e INE para la eJPT (ine). Aquí solo va lo
   específico de cada unidad. Todo lo ofensivo, SOLO contra la IP del laboratorio. */
Object.assign(UNIT_GUIDES, {
  p3u01: [
    { t: "Intro to Offensive Security: ataca FakeBank (solo en el laboratorio)", s: [
      "La sala abre sola un escritorio dentro del navegador con la web «FakeBank» (un banco de mentira para practicar). En la tarea **Starting the Lab**, fíjate en el **número de cuenta** que se ve en la pantalla: anótalo, lo usarás luego.",
      "Ve a la tarea **Find Hidden Pages**. Pulsa el botón verde que indica la tarea para abrir una **terminal** dentro del laboratorio.",
      "Escribe `dirb http://fakebank.thm` y pulsa Enter. `dirb` es una herramienta que prueba a ciegas muchos nombres de página habituales (admin, images, login…) para descubrir **páginas ocultas** que no aparecen enlazadas en el sitio.",
      "Mira la salida: cada línea que empieza por `+` es una página que **sí existe**. Una de ellas es una página de administración que no deberías poder usar (algo parecido a `/bank-transfer`).",
      "En la tarea **Attack the Admin Page**, en el navegador del laboratorio añade esa ruta al final de la dirección de FakeBank y entra. Haz una transferencia a **tu** número de cuenta del paso 1 por 2000 o más.",
      "Vuelve a la cuenta: el saldo se pone positivo y sale un cartel verde. Esas palabras en MAYÚSCULAS son la respuesta. Reflexión: una página de administración sin control de acceso deja que cualquiera mueva dinero. Esto solo es legal aquí, contra la máquina de la sala."
    ], learn: "`dirb http://sitio` descubre páginas ocultas probando nombres comunes; una página de admin sin control de acceso es un fallo crítico." },
    { t: "Red Team Fundamentals: ordena las 6 fases y entrégalas", s: [
      "Esta sala es de lectura. Lee las tareas **Vulnerability Assessment… Limitations**, **Red Team Engagements** y **Teams and Functions**: explican la diferencia entre escaneo de vulnerabilidades, pentest y ejercicio de equipo rojo.",
      "En **Teams and Functions** anota los tres equipos: **Red** (ataca), **Blue** (defiende) y **White** (árbitro que controla las reglas). Cada uno tiene su papel.",
      "En **Engagement Structure** verás una **cadena de ataque** (kill chain). Compárala con las 6 fases de un pentest que explica esta unidad.",
      "En la tarea **Overview of a Red Team Engagement** pulsa **View Site** y sigue el ejemplo guiado hasta obtener la bandera de la tarea.",
      "Cierra escribiendo en tu cuaderno, con tus palabras, las **6 fases** de un pentest (permiso, reconocimiento, escaneo, explotación, post-explotación, informe) y qué se entrega al final: el informe. Ese es el objetivo de esta unidad."
    ], learn: "Rojo ataca, azul defiende y blanco arbitra; un pentest va de pedir permiso a entregar el informe, que es el producto final." }
  ],
  p3u02: [
    { t: "Intro to Defensive Security: defiende FakeBank", s: [
      "Empieza por esta sala (es la base). En la tarea **Detect Suspicious Activity** pulsa **View Site**: se abre a la derecha un panel de vigilancia (un tablero con alertas).",
      "Revisa las alertas y busca la que se sale de lo normal; anota la **IP de origen** sospechosa que pide la pregunta.",
      "En **Identify the Attack** abre la lista «URL Discovery Attempts» (intentos de descubrir URLs) y mira la entrada más reciente: verás muchos intentos rápidos de llegar a páginas ocultas. Eso es alguien escaneando, como hiciste tú con `dirb` en la unidad anterior.",
      "En **Stop the Attack** escribe la IP del atacante en la casilla «Add Firewall Rule», elige **BLOCK** en el desplegable y pulsa **Apply**. Cuando salga el mensaje de éxito, copia la bandera.",
      "Fíjate: has visto el ataque desde el lado del defensor. Lo que para el atacante es un escaneo, para el SOC es una fila de alertas."
    ], learn: "El defensor ve el ataque como alertas; bloquear la IP del atacante con una regla de firewall corta la actividad." },
    { t: "SOC Fundamentals: haz de analista de nivel 1", s: [
      "Lee las tareas **People**, **Process** y **Technology**: aprende los tres pilares de un SOC (personas, procesos y tecnología) y los niveles de analista (L1, L2, L3).",
      "En la tarea **Process** memoriza las **5 preguntas** (las 5 W en inglés): qué, cuándo, dónde, quién y por qué. Es la forma de clasificar («triage») cualquier alerta.",
      "En la tarea **Practical Exercise of SOC** pulsa **View Site**: te llega una alerta de **escaneo de puertos** sobre un equipo. Usa el **SIEM** (la herramienta que junta y muestra los registros) del panel para ver los registros de esa alerta.",
      "Responde las preguntas de la alerta con las 5 W. Un detalle clave del ejercicio: el escaneo lo lanzó el equipo de evaluación de vulnerabilidades, así que el «por qué» no es malicioso: es un **falso positivo**.",
      "Cierra la alerta, copia la bandera y escribe en tu cuaderno un ejemplo de **falso positivo** (alerta que no era ataque) y uno de **falso negativo** (ataque sin alerta, el peor caso)."
    ], learn: "Un SOC clasifica cada alerta con las 5 W; distinguir un falso positivo de un ataque real es el trabajo del analista L1." }
  ],
  p3u03: [
    { t: "Ubica un phishing en la Cyber Kill Chain", s: [
      "Dibuja en tu cuaderno las **7 fases** de la Cyber Kill Chain en orden: reconocimiento, preparación del arma, entrega, explotación, instalación, mando y control (C2) y acciones sobre el objetivo.",
      "Toma un correo de phishing típico (el que roba una contraseña con un enlace falso) y coloca cada paso donde encaje: buscar a la víctima = reconocimiento; crear el correo con el enlace = preparación; enviarlo = entrega; que la víctima haga clic y escriba su clave = explotación.",
      "Marca en qué fase lo cortaría cada defensa: un filtro de correo corta la **entrega**; formar al empleado corta la **explotación**; bloquear el dominio malicioso corta el **mando y control**.",
      "Conclusión en una línea de tu cuaderno: romper **cualquier** eslabón detiene el ataque entero."
    ], learn: "La Kill Chain ordena un ataque en 7 fases; cortar un solo eslabón (entrega, explotación o C2) lo detiene." },
    { t: "Busca la técnica Phishing (T1566) en ATT&CK", s: [
      "En la matriz **Enterprise** de ATT&CK, la columna **Initial Access** (acceso inicial) es la **táctica** (el para qué). Dentro, abre la técnica **Phishing**; su código es **T1566**.",
      "Lee sus apartados **Mitigations** (cómo prevenirla) y **Detection** (cómo detectarla) y copia una de cada en tu cuaderno.",
      "Une las dos ideas de la unidad: la **táctica** de ATT&CK (Initial Access) coincide con la fase **entrega/explotación** de la Kill Chain. Son dos mapas del mismo ataque.",
      "Explícate en voz alta por qué rojo y azul usan ATT&CK como idioma común: el rojo dice «usé T1566» y el azul comprueba si su detección lo habría visto."
    ], learn: "Una táctica (Initial Access) es el porqué y una técnica (Phishing, T1566) es el cómo; ATT&CK es el idioma común de rojo y azul." }
  ],
  p3u04: [
    { t: "Passive Recon: whois, nslookup y dig sin tocar el objetivo", s: [
      "Reconocimiento **pasivo** = sacar información pública sin conectarte a los sistemas del objetivo. Esta sala te enseña tres herramientas nuevas; úsalas en la terminal de la AttackBox.",
      "`whois ejemplo.com` consulta el **registro del dominio**: quién lo registró, cuándo y qué servidores DNS usa. La pregunta de la tarea **Whois** sale de esa salida.",
      "`nslookup -type=TYPE dominio` pregunta al DNS por un tipo de registro. Por ejemplo `nslookup -type=MX ejemplo.com` da los servidores de correo; `A` da la dirección IP.",
      "`dig dominio TIPO` hace lo mismo con más detalle, y puedes elegir el servidor DNS: `dig @1.1.1.1 ejemplo.com MX`. En la tarea **nslookup and dig** compara ambas salidas.",
      "En las tareas **DNSDumpster** y **Shodan.io** usa esas webs (ábrelas en el navegador): DNSDumpster dibuja los subdominios; Shodan busca equipos ya expuestos con filtros como `hostname:` o `port:`. Nada de esto toca al objetivo.",
      "Anota: todas estas consultas son pasivas porque preguntan a terceros (registros, DNS, buscadores), no al objetivo."
    ], learn: "`whois` da el dueño del dominio, `nslookup`/`dig` consultan el DNS y Shodan/DNSDumpster buscan lo ya expuesto, todo sin tocar al objetivo." },
    { t: "Active Recon: ping, traceroute, telnet y netcat contra la máquina", s: [
      "Reconocimiento **activo** = sí te conectas a la máquina del objetivo, así que deja rastro y **solo se hace dentro del laboratorio**. Arranca la AttackBox y la máquina de la tarea.",
      "`ping -c 5 MACHINE_IP` envía 5 paquetes para ver si la máquina responde y cuánto tarda. `-c` fija el número de paquetes (en Windows sería `-n`).",
      "`traceroute MACHINE_IP` muestra el camino de saltos (routers) hasta la máquina. Sirve para entender por dónde pasa tu tráfico.",
      "`telnet MACHINE_IP 80` abre una conexión al **puerto** 80. Si escribes `GET / HTTP/1.1`, Enter, `host: telnet`, Enter, Enter, el servidor te responde: así hablas «a mano» con un servicio web.",
      "`nc MACHINE_IP 21` (netcat, que ya usaste en Bandit) hace lo mismo de forma más flexible; añade `-v` para ver detalles de la conexión y leer el **banner** (la versión del servicio).",
      "Rellena tu tabla: técnica, ¿pasiva o activa?, ¿deja rastro? El ping, traceroute, telnet y nc son activos; whois, dig y Shodan son pasivos."
    ], learn: "`ping`, `traceroute`, `telnet puerto` y `nc puerto` interrogan a la máquina directamente: son recon activo y solo se usan contra el laboratorio." }
  ],
  p3u05: [
    { t: "Nmap Live Host Discovery: encontrar qué equipos están vivos", s: [
      "Esta sala va de **descubrir equipos**, no puertos todavía. Arranca la red (**Start**) y la AttackBox. Muchos escaneos necesitan permisos de administrador: antepón `sudo`.",
      "`nmap -sn 10.10.10.0/24` hace un «ping scan»: `-sn` significa «sin escaneo de puertos», solo mira qué hosts responden. El `/24` es el rango de la red (lo viste en subredes).",
      "`sudo nmap -PR -sn OBJETIVOS` descubre por **ARP** (dentro de tu misma red local, lo más fiable). `-PE`, `-PP`, `-PM` usan distintos tipos de **ping ICMP**.",
      "`sudo nmap -PS22,80,443 -sn OBJETIVOS` prueba con paquetes **TCP SYN** a esos puertos; `-PA` usa TCP ACK y `-PU` usa UDP. Sirven cuando el ping normal está bloqueado por un firewall.",
      "`-n` le dice a Nmap que **no** resuelva nombres DNS (va más rápido); `-R` le obliga a resolverlos. Prueba ambos y nota la diferencia de velocidad.",
      "Apunta en tu chuleta: `-sn` = solo descubrir hosts; `-PR/-PE/-PS/-PA/-PU` = distintas formas de preguntar «¿estás vivo?». Solo contra la IP de la sala."
    ], learn: "`nmap -sn` descubre qué equipos están encendidos; `-PR/-PE/-PS/-PA/-PU` son maneras de sondearlos cuando el ping normal falla." },
    { t: "Nmap (further): tipos de escaneo, versiones y guiones", s: [
      "Esta sala va de **puertos y servicios**. Despliega la máquina y la AttackBox. Recuerda: un escaneo SYN necesita `sudo`.",
      "`nmap -sS MACHINE_IP` es el escaneo **SYN** (rápido y silencioso, por eso necesita sudo). `-sT` es el **TCP Connect** (completo, sin sudo). `-sU` escanea **UDP**.",
      "Añade `-p-` para escanear **los 65535 puertos**, o `-p 80,443` para puertos concretos; sin `-p` Nmap mira los 1000 más comunes.",
      "`-sV` detecta la **versión** del servicio detrás de cada puerto (clave para buscar vulnerabilidades); `-sC` lanza los **guiones** (scripts) seguros por defecto; `-O` intenta adivinar el sistema operativo.",
      "Junta lo útil en un solo comando: `sudo nmap -sV -sC -p- MACHINE_IP`. Léelo así: versiones + guiones básicos + todos los puertos contra esa IP. Este es el escaneo que repetirás en cada máquina.",
      "Si Nmap dice que el host parece caído porque el firewall bloquea el ping, añade `-Pn` («no hagas ping, escanea igual»). Guarda la chuleta con cada opción y para qué sirve."
    ], learn: "`-sS/-sT/-sU` eligen el tipo de escaneo, `-p-` abre todos los puertos y `-sV -sC` revelan versión y detalles: `sudo nmap -sV -sC -p- IP` es tu escaneo base." }
  ],
  p3u06: [
    { t: "Snort: entender sudo y probar la instalación", s: [
      "Despliega la máquina de la tarea **Interactive Material and VM**; aparece en la vista dividida. En el Escritorio tienes la carpeta **Task-Exercises** con los archivos de cada tarea.",
      "Snort necesita permisos de administrador para leer el tráfico de red. Por eso casi todos los comandos empiezan por **`sudo`** (viene de «super user do», «hazlo como superusuario»): ejecuta ese comando con permisos de root.",
      "Comprueba que Snort está instalado: `snort -V` (muestra la versión). Comprueba que su configuración es válida: `sudo snort -c /etc/snort/snort.conf -T`. La `-T` significa «test»: revisa y no arranca.",
      "En **Sniffer Mode** mira el tráfico en vivo: `sudo snort -v` (resumen), `sudo snort -de` (con datos y cabeceras). Es parecido a Wireshark pero en texto.",
      "En **IDS/IPS Mode** verás la regla de ejemplo `alert icmp any any <> any any (msg:\"ICMP Packet Found\"; sid:100001; rev:1;)`. Se lee así: **alerta** cuando haya tráfico **icmp** de cualquier origen a cualquier destino, y escribe ese mensaje. Las reglas viven en `/etc/snort/rules/local.rules`.",
      "Lánzalo con `sudo snort -c /etc/snort/snort.conf -A console` y, en otra terminal, genera tráfico con `sudo ./traffic-generator.sh`. Verás saltar las alertas. Escribe la diferencia: un **IDS** avisa, un **IPS** además bloquea."
    ], learn: "`sudo` ejecuta como administrador; Snort compara el tráfico con reglas en `local.rules` y, cuando coinciden, lanza una alerta (IDS) o la bloquea (IPS)." }
  ],
  p3u07: [
    { t: "Burp Repeater: cambiar y reenviar una petición", s: [
      "Despliega la máquina (**Start Lab Machine**) y abre Burp con su navegador (lo instalaste en la Fase 2). Entra en `http://MACHINE_IP/` para que la petición quede capturada.",
      "En **Proxy → HTTP history** haz clic derecho sobre esa petición y elige **Send to Repeater** (o pulsa `Ctrl + R`). Arriba se activa la pestaña **Repeater**.",
      "En Repeater, a la izquierda está la **petición** (la puedes editar) y a la derecha la **respuesta**. Pulsa **Send** y mira qué responde el servidor.",
      "Cambia **una sola cosa** y vuelve a pulsar **Send**: por ejemplo edita la cabecera `Connection: close` a `open`, o un parámetro de la URL. Compara las dos respuestas con los botones de historial que hay junto a **Send**.",
      "En la tarea práctica, añade una cabecera nueva llamada `FlagAuthorised` con valor `True` (escríbela en el editor o con el **Inspector**) y pulsa **Send**: la bandera aparece en la respuesta.",
      "En el reto, entra a `http://MACHINE_IP/products/` y manda a Repeater una petición de un producto; cambia el número final por valores extremos hasta que el servidor devuelva un «500 Internal Server Error», y lee la respuesta. Solo contra esta máquina.",
      "Cambia una cosa cada vez: así sabes exactamente qué provocó cada cambio en la respuesta."
    ], learn: "`Ctrl + R` manda una petición a Repeater; editas una parte, pulsas **Send** y comparas respuestas para ver cómo valida el servidor." }
  ],
  p3u08: [
    { t: "Juice Shop: preparar el laboratorio y abrir el marcador", s: [
      "Despliega la máquina y abre `http://MACHINE_IP` en el navegador. Juice Shop es una tienda **llena de fallos a propósito**, hecha por OWASP para aprender: aquí todo es legal.",
      "Si usas Burp y una bandera no aparece, **apaga el proxy** en el navegador y recarga; algunas banderas solo saltan con la conexión directa.",
      "Abre el **marcador de retos**: escribe en la barra `http://MACHINE_IP/#/score-board`. Ahí ves todos los retos, su dificultad y cuáles llevas. Empieza por los de 1 estrella.",
      "Tarea **Let's go on an adventure**: navega la tienda con Burp y el **Intercept** en «off» para ver cómo se mueven las peticiones. Busca el correo del administrador en las reseñas de productos.",
      "Aviso de orden: en esta sala verás dos técnicas que se explican a fondo **después**: la **inyección SQL** (escribir código SQL en un formulario para que la base de datos haga algo que no debía; unidad 9) y el **XSS** (meter JavaScript en una página para que se ejecute en el navegador de otra persona; unidad 10). Cuando las toques aquí, apunta el reto y vuelve a él tras esas unidades si no lo entiendes.",
      "Tras cada reto, pregúntate: ¿qué categoría del **OWASP Top 10** era y cómo lo arreglaría el programador? Ten abierta la lista OWASP para clasificarlo. Reparte la sala en 3 bloques."
    ], learn: "El marcador `/#/score-board` ordena los retos por dificultad; cada reto de Juice Shop es una categoría del OWASP Top 10." }
  ],
  p3u09: [
    { t: "SQL Injection (sala): recorrer los 4 niveles", s: [
      "Primero lee la teoría de PortSwigger del enlace (la guía de PortSwigger te la abre). Luego despliega la máquina de la sala con **Start Lab Machine**.",
      "Recuerda de la Fase 2 que SQL es el idioma de las bases de datos. La **inyección** pasa cuando tu texto se cuela **dentro** de la consulta y cambia su significado. El carácter que suele romper la consulta es la comilla simple `'`.",
      "**Nivel 1 (In-Band)**: provoca un error metiendo una comilla y luego usa consultas `UNION SELECT` para enumerar la base de datos. La sala te explica la sintaxis; tú la aplicas.",
      "**Nivel 2 (bypass de login)**: en la caja de consulta y el formulario, construye una condición que siempre sea verdadera para saltarte la autenticación. Entiende **por qué** funciona, no lo copies sin más.",
      "**Nivel 3 (Boolean)** y **Nivel 4 (Time based)**: aquí la web no te muestra el dato, solo responde «sí/no» o tarda más. Deduces letra a letra; el nivel 4 usa `SLEEP()` para medir el retardo.",
      "Termina con la tarea **Remediation**: escribe en tu cuaderno las tres defensas (consultas parametrizadas, validar la entrada, mínimos privilegios) y explica en voz alta por qué la versión parametrizada no se puede inyectar: datos e instrucciones van por separado."
    ], learn: "La comilla `'` rompe una consulta mal hecha; `UNION SELECT` extrae datos y las consultas parametrizadas lo evitan al separar datos de instrucciones." }
  ],
  p3u10: [
    { t: "Lab Apprentice: «Reflected XSS into HTML context with nothing encoded»", s: [
      "Lee primero la teoría de XSS (la guía de PortSwigger te explica cómo entrar a la Academy y abrir el laboratorio). El primer laboratorio Apprentice de XSS reflejado se llama exactamente «Reflected XSS into HTML context with nothing encoded».",
      "Pulsa **Access the lab**. Es un blog: tiene un **buscador**. Escribe una palabra cualquiera, por ejemplo `prueba`, y busca.",
      "Mira la página de resultados: aparece «0 search results for 'prueba'». Tu texto se ha **reflejado** tal cual en la página. Confírmalo con **Ctrl + U** (código fuente): tu palabra está dentro del HTML sin ninguna codificación.",
      "Como el texto no se codifica, si en vez de una palabra escribes una **etiqueta HTML** con una etiqueta `<script>` que llame a la función `alert()`, el navegador la ejecutará en lugar de mostrarla como texto. Esa es la prueba de XSS.",
      "Escríbela tú en el buscador y pulsa buscar. Si salta el aviso, arriba aparece «Congratulations, you solved the lab!».",
      "En tu cuaderno apunta las tres defensas y qué evita cada una: **codificar la salida** (que el texto se muestre como texto), **CSP** (limita qué scripts se ejecutan) y cookies **HttpOnly** (que JavaScript no las lea). Solo en el laboratorio."
    ], learn: "Si una web refleja tu entrada sin codificarla, una etiqueta `<script>` se ejecuta: eso es XSS reflejado, y la defensa es codificar la salida." }
  ],
  p3u11: [
    { t: "Lab Apprentice de autenticación: «Username enumeration via different responses»", s: [
      "En la teoría de autenticación de PortSwigger, abre el laboratorio Apprentice «Username enumeration via different responses» y pulsa **Access the lab**.",
      "Objetivo: descubrir un **usuario válido** y luego su contraseña aprovechando que el servidor responde **distinto** según si el usuario existe o no.",
      "Haz un login con un usuario inventado y captúralo en Burp. Mándalo a **Intruder** (clic derecho → **Send to Intruder**): Intruder repite la petición cambiando un valor por cada palabra de una lista.",
      "Marca el campo del **usuario** como posición, carga la lista de usuarios que da el laboratorio y lanza el ataque. Ordena por la columna **Length** (longitud): la respuesta que mide distinto delata al usuario que existe. No se da la lista aquí; la trae el laboratorio.",
      "Repite el ataque sobre el **campo de contraseña** con el usuario ya encontrado para dar con la clave. Entra y el laboratorio se marca **Solved**.",
      "Apunta la causa (mensajes de error que revelan si un usuario existe, sin límite de intentos) y las defensas (mensajes genéricos, límite de intentos, 2FA)."
    ], learn: "Si el servidor responde distinto para un usuario válido, Intruder lo revela probando una lista; la defensa son mensajes genéricos y límite de intentos." },
    { t: "Lab Apprentice de IDOR: «Insecure direct object references»", s: [
      "En la teoría de control de acceso, abre el laboratorio Apprentice «Insecure direct object references» y pulsa **Access the lab**. Ya tocaste control de acceso en la Fase 2; esto es el caso concreto de IDOR.",
      "Entra con la cuenta que te da el laboratorio y usa la función de **chat en vivo**; descarga tu registro de chat con **View transcript**.",
      "Mira la dirección del archivo que descargaste: termina en un **número** seguido de `.txt`, por ejemplo `2.txt`. Ese número identifica **tu** transcripción.",
      "Cambia ese número por otro (por ejemplo `1.txt`) en la barra de direcciones y entra: el servidor te entrega la transcripción de **otra persona** porque no comprueba que sea tuya. Eso es un IDOR.",
      "Dentro de esa transcripción ajena hay una contraseña; úsala como pide el laboratorio para resolverlo. Hazlo solo aquí.",
      "Anota la causa (el servidor confía en un número que tú controlas) y la defensa (comprobar en el servidor que cada objeto pertenece a quien lo pide)."
    ], learn: "Cambiar un número de la URL para ver datos de otro es un IDOR; se arregla comprobando en el servidor que el objeto es tuyo." }
  ],
  p3u12: [
    { t: "Intro to Cyber Threat Intel: construir un perfil de amenaza", s: [
      "Lee las tareas **Cyber Threat Intelligence** y **CTI Lifecycle**: aprende qué es un **IOC** (indicador de compromiso: un hash de archivo malicioso, una IP o un dominio del atacante) y las fases del ciclo de inteligencia.",
      "En **CTI Standards & Frameworks** verás cómo encajan MITRE ATT&CK (que ya conoces), la Kill Chain, CVE/CVSS y los formatos **STIX/TAXII** para compartir inteligencia.",
      "En la tarea **Practical Analysis** pulsa **View Site**: se abre el «Static Site Lab» con una herramienta de vigilancia. Rellena los datos de la amenaza (por ejemplo un correo y un archivo descargado) para montar el **perfil**.",
      "Responde las preguntas del laboratorio con esos datos. La idea: pasar de datos sueltos a inteligencia útil para defender.",
      "Dibuja en tu cuaderno la **pirámide del dolor**: abajo lo que el atacante cambia en segundos (un hash), arriba sus **TTP** (tácticas, técnicas y procedimientos), lo más caro de cambiar.",
      "Explica en voz alta por qué detectar un **TTP** vale más que bloquear un hash: el atacante cambia el hash al instante, pero su forma de trabajar no."
    ], learn: "Un IOC (hash, IP, dominio) es un rastro fácil de cambiar; detectar los TTP del atacante, en la cima de la pirámide del dolor, duele mucho más." }
  ],
  p3u13: [
    { t: "Security Awareness y las señales del phishing", s: [
      "Haz la sala **Security Awareness**: cubre por qué todos somos objetivo, el coste de las filtraciones y los tipos de atacante. En la tarea de **Have I Been Pwned** busca tu correo en haveibeenpwned.com y, si sale en una filtración, cambia esa contraseña.",
      "Ahora practica el análisis por tu cuenta. Abre un correo de tu carpeta de **spam** **sin hacer clic en nada** ni abrir adjuntos.",
      "Busca las 4 señales: ¿el remitente real coincide con el nombre mostrado?, ¿el enlace lleva a donde dice? (pasa el ratón **por encima** del enlace, sin pulsar, y mira abajo la dirección real), ¿el mensaje mete prisa o miedo?, ¿pide datos o dinero?",
      "En Gmail abre el correo, pulsa los **tres puntos** (⋮) arriba a la derecha y elige **Mostrar original**. Se abre una página con las **cabeceras**.",
      "Localiza los resultados de **SPF**, **DKIM** y **DMARC**: comprueban si el servidor que envió el correo está autorizado por ese dominio. Un `PASS` es buena señal; un `FAIL` o `SOFTFAIL` es sospechoso.",
      "Anota tu veredicto y por qué. Nunca pruebes esto haciendo clic: el análisis se hace mirando, no abriendo."
    ], learn: "Un phishing se detecta sin hacer clic: remitente, enlace real al pasar el ratón, urgencia, y SPF/DKIM/DMARC en «Mostrar original»." }
  ],
  p3u14: [
    { t: "Metasploit: Introduction, comando a comando", s: [
      "Despliega la máquina del laboratorio y la AttackBox. Abre Metasploit con `msfconsole` (tarda unos segundos en cargar).",
      "`search ms17-010` busca módulos relacionados con una vulnerabilidad. En los resultados, cada módulo tiene un número y una ruta.",
      "`use exploit/windows/smb/ms17_010_eternalblue` selecciona el **exploit** (el módulo que aprovecha la vulnerabilidad). También puedes escribir `use` y el número del resultado.",
      "`show options` lista lo que hay que rellenar. Lo esencial es **RHOSTS** (la máquina objetivo): `set RHOSTS 10.10.x.x` con la IP del laboratorio. `setg` lo fija para toda la sesión.",
      "`info` muestra la ficha del módulo: qué hace y a qué sistemas afecta. Léela antes de lanzar nada.",
      "`run` (o `exploit`) lanza el módulo contra la máquina del laboratorio. Un módulo **auxiliary** (`use auxiliary/scanner/smb/smb_ms17_010`) solo comprueba si es vulnerable, sin atacar; úsalo primero.",
      "Apunta la diferencia: **exploit** abre la puerta, **payload** (carga útil) es lo que se ejecuta dentro, **auxiliary** escanea. Lección defensiva: casi todo esto son fallos con parche publicado; actualizar a tiempo los frena. Solo contra la máquina de la sala."
    ], learn: "En Metasploit: `search` busca, `use` elige, `show options` y `set RHOSTS` configuran, `info` informa y `run` lanza; un `auxiliary` solo comprueba." }
  ],
  p3u15: [
    { t: "Vulnversity: reconocimiento y descubrimiento web", s: [
      "Despliega la máquina y la AttackBox. Empieza enumerando con lo de la unidad 5: `nmap -sV MACHINE_IP` para ver puertos, servicios y versiones. Anota en qué puerto corre la web (no suele ser el 80).",
      "Para descubrir carpetas de la web usa **gobuster**, un buscador de directorios como `dirb` pero más rápido: `gobuster dir -u http://MACHINE_IP:PUERTO -w /usr/share/wordlists/dirb/common.txt`. `dir` = modo directorios, `-u` = la dirección, `-w` = la **lista de palabras** que prueba.",
      "Fíjate en la carpeta de subida de archivos que aparezca en los resultados. La sala te guía: tu trabajo es entender **por qué** cada paso, no solo seguirlo.",
      "La sala usa Burp para averiguar qué extensiones de archivo acepta la subida. Sigue sus instrucciones y, cuando toque, usa `nc -lvnp PUERTO` (netcat a la escucha, de la Fase 1) para recibir la conexión de vuelta.",
      "Para la parte final busca archivos con permiso especial **setuid** (lo viste en Bandit) con `find / -perm -u=s -type f 2>/dev/null`. El `2>/dev/null` esconde los errores.",
      "Toma notas como si fueras a escribir el informe, porque en la unidad 18 lo harás con esta máquina: para cada paso anota qué hiciste, por qué y cómo se habría evitado. Reparte la sala en 3 bloques."
    ], learn: "`nmap -sV` enumera, `gobuster dir -u … -w lista` descubre carpetas y `find / -perm -u=s` busca programas setuid; toma notas para el informe." }
  ],
  p3u16: [
    { t: "Linux Privilege Escalation: enumerar antes de escalar", s: [
      "Entra por SSH con el usuario que da la sala (`karen` en varias tareas). **Escalar privilegios** es pasar de usuario normal a **root** (administrador), casi siempre por configuraciones descuidadas.",
      "Primero **enumera** (reúne información del sistema): `hostname`, `uname -a` (versión del núcleo), `id` y `sudo -l` (qué puedes ejecutar como otro usuario). Léelos con calma.",
      "En la tarea **Sudo**: `sudo -l` lista los programas que puedes correr con `sudo`. **sudo** («super user do») ejecuta un comando como administrador. Si un programa de la lista permite abrir una shell, ahí está la vía. La web **GTFOBins** te dice qué programas sirven para eso.",
      "En la tarea **SUID**: busca programas con el bit setuid con `find / -type f -perm -04000 -ls 2>/dev/null`. Un programa setuid corre con los permisos de su dueño (a veces root).",
      "En las tareas **Capabilities**, **Cron Jobs** y **PATH**: revisa `getcap -r / 2>/dev/null` (capacidades), el archivo `/etc/crontab` (tareas programadas) y las carpetas donde puedes escribir. Cada una es una configuración mal puesta.",
      "Rellena tu tabla: causa (sudo amplio, setuid de más, cron editable, PATH manipulable), cómo se detecta y cómo se corrige (mínimo privilegio, quitar setuid, permisos correctos, parches). Solo en la máquina de la sala."
    ], learn: "Se escala enumerando primero (`id`, `sudo -l`, `uname -a`) y luego revisando sudo, SUID, capabilities y cron; cada fallo es una mala configuración con arreglo." }
  ],
  p3u17: [
    { t: "Windows PrivEsc: mismas ideas, otras configuraciones", s: [
      "Conéctate a la máquina por **RDP** (Escritorio remoto) con el usuario que da la sala. En Windows la meta es pasar a **Administrador** o **SYSTEM** aprovechando algo mal configurado.",
      "La sala usa herramientas que enumeran el sistema por ti: **winPEAS** y **PowerUp.ps1** listan configuraciones peligrosas, y **accesschk.exe** (de Microsoft) comprueba permisos de servicios. Ejecútalas según indica cada tarea y lee lo que marcan en rojo.",
      "Recorre las tareas por tema, sin saltarte ninguna: **servicios** con permisos débiles que un usuario normal puede cambiar, rutas de servicio **sin comillas** con espacios, **credenciales guardadas** en archivos o en el registro, y **tareas programadas** editables.",
      "Para cada técnica entiende la causa (por qué funciona) antes de ejecutarla, porque eso es lo que apuntarás en la tabla.",
      "Rellena la misma tabla que en Linux: causa, cómo se detecta, cómo se corrige (revisar permisos de servicios, poner comillas en las rutas, no guardar contraseñas en texto, parchear).",
      "Compara en voz alta Linux y Windows: en los dos, escalar casi nunca es un fallo raro, sino una configuración descuidada. Todo esto, solo en la máquina de la sala."
    ], learn: "En Windows winPEAS/PowerUp/accesschk encuentran servicios, rutas sin comillas, credenciales y tareas mal configuradas; la causa, como en Linux, es la mala configuración." }
  ],
  p3u18: [
    { t: "Escribe el informe de Vulnversity", s: [
      "Abre un documento nuevo. El informe tiene dos lectores: **directivos** (quieren el riesgo en lenguaje claro) y **técnicos** (quieren reproducir y arreglar). Escribe para los dos.",
      "Monta la estructura: **1** resumen ejecutivo, **2** alcance y método, **3** hallazgos, **4** recomendaciones priorizadas.",
      "Escribe el **resumen ejecutivo** de Vulnversity en 5 líneas, **sin palabras técnicas**: qué probaste, qué encontraste y qué riesgo supone para el negocio.",
      "Documenta **2 hallazgos** con tus notas. Cada uno lleva: título, gravedad **CVSS**, evidencia (captura o comando), pasos para reproducirlo e impacto.",
      "Para la gravedad usa la calculadora CVSS (la guía de NVD te explica cada botón). Elige las opciones que describen tu hallazgo y copia al informe la nota y la cadena `CVSS:3.1/...` para que cualquiera compruebe tu cálculo.",
      "Termina con las **recomendaciones ordenadas por prioridad**: primero lo más grave y fácil de arreglar. Relee: un buen informe se entiende sin que tú estés presente."
    ], learn: "Un informe de pentest va de resumen ejecutivo sin tecnicismos a hallazgos con CVSS y pasos para reproducir, y acaba en recomendaciones por prioridad." }
  ],
  p3u19: [
    { t: "Máquina sin guía: tu método paso a paso", s: [
      "Elige **Pickle Rick** o **Simple CTF** y anota la hora de inicio. Ahora no hay tutorial: aplicas tu método y la **regla de los 30 minutos** (30 min atascado antes de mirar una pista mínima y cerrar la pestaña).",
      "**1. Enumerar**: despliega la máquina y lánzale `nmap -sV -sC -p- MACHINE_IP` para ver todos los puertos, servicios y versiones. Apunta cada puerto abierto.",
      "**2. Explorar la web** (si hay): abre la página, mira el **código fuente** (Ctrl + U), prueba `/robots.txt` y busca carpetas con `gobuster dir -u http://MACHINE_IP -w /usr/share/wordlists/dirb/common.txt`.",
      "**3. Buscar versiones y exploits**: con la versión que dio `-sV`, busca si tiene una vulnerabilidad conocida (su **CVE**). En Simple CTF, una de las preguntas es justo el CVE.",
      "**4. Acceso**: consigue entrar según lo que encontraste (un servicio vulnerable, credenciales, un panel). Guarda la bandera de usuario.",
      "**5. Escalar**: ya dentro, repite la enumeración de privilegios: `sudo -l`, busca setuid, mira otros usuarios. Consigue root y la bandera final.",
      "**6. Documentar**: escribe el informe corto (resumen, hallazgos, recomendaciones) con el formato de la unidad 18. Todo contra la IP de la sala."
    ], learn: "El método es siempre el mismo: enumerar con nmap, explorar la web, buscar el CVE de cada versión, entrar, escalar y documentar." }
  ],
  p3u20: [
    { t: "Prepararte para la eJPT (examen práctico)", s: [
      "La **eJPT** (de INE Security) es un examen **práctico**: te dan un laboratorio y demuestras lo que sabes hacer, no recitas teoría. El carné dura 3 años. Lee la página oficial (la guía de INE te ayuda a entrar).",
      "Copia el **temario** oficial en tu cuaderno con sus pesos: **Assessment Methodologies** (25%), **Host & Network Penetration Testing** (35%), **Host & Networking Auditing** (25%) y **Web Application Penetration Testing** (15%). Marca con ✓ lo que dominas y con ✗ lo que no.",
      "Empieza por los temas con ✗ y repasa tus chuletas de Nmap, web y escalada de las unidades anteriores.",
      "Haz **dos o tres máquinas fáciles más sin guía** (como en la unidad 19), cada una con su informe. Es el mejor ensayo del examen.",
      "Sobre el acceso: necesitas una **suscripción de INE** y un **voucher** (vale) del examen. Algunos planes (como el bundle «eJPT + Prep») ya incluyen el voucher y una **repetición gratis** si no apruebas a la primera. El voucher caduca a los 180 días: no lo compres hasta tenerlo todo con ✓.",
      "Durante el examen, toma notas como en un pentest real: tu metodología ordenada es tu mejor herramienta."
    ], learn: "La eJPT es un examen práctico de 4 dominios (metodologías 25%, red 35%, auditoría 25%, web 15%); se aprueba con método y máquinas sin guía ensayadas antes." }
  ]

Object.assign(UNIT_GUIDES, {
  p4u01: [
    { t: "Monta tu laboratorio Linux en Windows (WSL2 + Kali), paso a paso", s: [
      "Hasta ahora las herramientas de ataque (nmap, nc...) estaban en cajas que te daban en el navegador (la AttackBox de TryHackMe, la terminal de picoCTF). En Hack The Box, con cuenta gratis, **no** tienes una caja así siempre encendida (la Pwnbox del navegador solo te da **una sesión de 2 horas para toda la vida de la cuenta**). Por eso vas a montar tu propio Linux **dentro** de Windows con **WSL** (Windows Subsystem for Linux, «subsistema de Linux para Windows»): un Linux real que corre junto a Windows, sin instalar una máquina virtual pesada.",
      "Abre **PowerShell como administrador**: tecla Windows, escribe `PowerShell`, clic derecho sobre **Windows PowerShell** → **Ejecutar como administrador**. Escribe `wsl --install -d kali-linux` y pulsa Enter. Esto baja e instala **Kali Linux** (la distribución de Linux preparada para seguridad). Cuando termine, **reinicia la laptop** si te lo pide.",
      "Tras reiniciar, tecla Windows → escribe `kali` → abre **Kali Linux**. La primera vez te pide crear un **usuario** y una **contraseña** para ese Linux (apúntalos; al escribir la contraseña no se ve nada, es normal). Cuando veas un prompt que termina en `$`, ya estás dentro de tu Linux.",
      "Actualiza el sistema e instala las herramientas: escribe `sudo apt update && sudo apt install -y kali-linux-headless openvpn` y Enter. Pon tu contraseña cuando la pida. `kali-linux-headless` trae el paquete de herramientas (nmap, netcat, smbclient...) y `openvpn` es el programa que te conectará a la VPN. Tarda un rato: es mucha descarga.",
      "WSL no carga por defecto el módulo que la VPN necesita. Actívalo con `sudo modprobe tun` (cárgalo una vez por sesión, antes de conectar la VPN). Si no diera error, está listo.",
      "Ahora consigue tu archivo de VPN de Hack The Box: la guía de plataforma de HTB te explica el flujo (**Connect to HTB** → **Starting Point** → **OpenVPN** → elige servidor cercano y **Download VPN**). Guarda el archivo `.ovpn`. En Kali, ese archivo está en `/mnt/c/Users/TuUsuario/Downloads/` (WSL ve tu disco C en `/mnt/c`).",
      "Conéctate: en Kali escribe `sudo openvpn /mnt/c/Users/TuUsuario/Downloads/starting_point_TUUSER.ovpn` (cambia la ruta por la de tu archivo). Deja esa ventana **abierta**: si la cierras, se corta la VPN.",
      "Debe aparecer al final la línea «Initialization Sequence Completed». Eso significa que ya estás dentro de la red de HTB. Abre **otra** ventana de Kali para trabajar (tecla Windows → Kali otra vez) y comprueba la conexión con `ip addr show tun0`: debe mostrar una interfaz `tun0` con una IP. Si sale, ya puedes atacar las máquinas del laboratorio."
    ], learn: "WSL2 te da un Kali real dentro de Windows; `sudo modprobe tun` + `sudo openvpn archivo.ovpn` te conecta a la red del laboratorio de HTB." },
    { t: "Starting Point, Tier 0: enumerar y hablar con un servicio (método por máquina)", s: [
      "El Tier 0 tiene 4 máquinas **gratuitas** (las que no muestran un candado): cada una te enseña a hablar con **un** servicio distinto. En la máquina, pulsa **Spawn Machine**, espera 1–2 minutos y copia la **IP** que aparece: es la única dirección que puedes tocar. Todo esto solo contra esa IP del laboratorio; nada fuera de ahí.",
      "Empieza SIEMPRE igual: en tu Kali conectado a la VPN, escanea los puertos con `nmap -sC -sV IP` (lo viste en nmap: `-sV` detecta versiones, `-sC` lanza los scripts básicos). Mira qué puerto está abierto: eso te dice qué servicio enseña la máquina.",
      "**Máquina de telnet (puerto 23):** `telnet` es un programa viejo para conectarte a la consola de otra máquina **sin cifrar**. Conéctate con `telnet IP`. Cuando pida «login», prueba el usuario de administrador de Linux. Si entra sin pedir contraseña, el fallo es que no había autenticación. Lee la flag `flag.txt` con `cat` y envíala en **Submit Flag**.",
      "**Máquina de FTP (puerto 21):** `ftp` sirve para transferir archivos. Conéctate con `ftp IP` y, cuando pida «Name», escribe `anonymous` (acceso anónimo, sin contraseña): pulsa Enter en la contraseña. Dentro usa `ls` para ver archivos y `get nombre` para descargarlos a tu Kali. Sal con `bye` y lee el archivo descargado con `cat`.",
      "**Máquina de SMB (puerto 445):** SMB es el sistema de carpetas compartidas de Windows. Lista las carpetas con `smbclient -L //IP/ -N` (`-L` lista, `-N` entra sin contraseña). Conéctate a una carpeta que no sea del sistema con `smbclient //IP/NombreCarpeta -N`. Dentro, `ls` y `get archivo` como en FTP.",
      "**Máquina de Redis (puerto 6379):** Redis es una base de datos en memoria. Conéctate con `redis-cli -h IP` (`-h` es el servidor). Dentro escribe `info` para ver datos del servidor, `keys *` para listar todo lo guardado y `get nombre-de-la-clave` para leer un valor. Ahí suele estar lo que buscas.",
      "De cada máquina, escribe en tu cuaderno: puerto, servicio, qué permitió el acceso (sin autenticación, acceso anónimo...) y cómo se arregla. Al terminar pulsa **Stop Machine**."
    ], learn: "Primero `nmap` para ver el servicio; luego su cliente propio: `telnet`, `ftp` (anonymous), `smbclient -N`, `redis-cli -h`. Casi todas fallan por no pedir autenticación." }
  ],
  p4u02: [
    { t: "Starting Point, Tier 1: tu primer paso de explotación (método)", s: [
      "El Tier 1 sigue siendo de **un paso principal**, pero ahora ese paso es una explotación, no solo «entrar». Haz las máquinas gratuitas (sin candado). Trabaja siempre contra la **IP** que te da **Spawn Machine**, nada más.",
      "Rutina fija: `nmap -sC -sV IP`. Si ves un puerto web (80 o 443), ábrelo en Brave escribiendo `http://IP` en la barra de direcciones. Si ves otro servicio (FTP, base de datos), usa su cliente como en el Tier 0.",
      "En las webs, lo primero es buscar **carpetas y páginas ocultas** con un «fuzzer» de directorios. Instala uno: `sudo apt install -y gobuster`. `gobuster` prueba muchos nombres de carpeta y te dice cuáles existen. Úsalo así: `gobuster dir -u http://IP -w /usr/share/wordlists/dirb/common.txt` (`dir` = modo directorios, `-u` la dirección, `-w` la lista de nombres a probar).",
      "Si encuentras un panel de inicio de sesión, recuerda lo que estudiaste de **inyección SQL** (SQLi) y de credenciales por defecto: prueba primero usuarios y contraseñas comunes (admin/admin) y, si el campo no filtra comillas, la técnica de SQLi que viste en PortSwigger. Solo en esta máquina del laboratorio.",
      "Si el servicio es una base de datos MySQL (puerto 3306), conéctate con el cliente: `mysql -h IP -u usuario -p` (`-h` servidor, `-u` usuario, `-p` pedirá la contraseña). Dentro usas el SQL que ya sabes (`SHOW DATABASES;`, `USE basededatos;`, `SELECT * FROM tabla;`).",
      "Cuando consigas entrar o leer lo que buscas, encuentra el archivo de la flag con `find / -name flag.txt 2>/dev/null` (busca en todo el disco el archivo y esconde los errores) y léelo con `cat`.",
      "Escribe un writeup corto de cada máquina: servicio, fallo, cómo se explota y cómo se defiende (parchear, quitar credenciales por defecto, usar consultas preparadas contra SQLi). Pulsa **Stop Machine** al acabar."
    ], learn: "Tier 1 = enumerar con nmap + gobuster y aplicar una técnica que ya conoces (credenciales por defecto, SQLi, acceso a un servicio) contra la IP del laboratorio." }
  ],
  p4u03: [
    { t: "Starting Point, Tier 2: máquina completa de principio a fin (método)", s: [
      "El Tier 2 encadena **varios pasos** y tiene **dos flags**: `user.txt` (cuando entras como un usuario normal) y `root.txt` (cuando llegas a administrador). Es lo más parecido a un pentest real. Trabaja cada una como un proyecto, contra su **IP** del laboratorio.",
      "Fase 1, enumerar: `nmap -sC -sV IP` y, si hay web, `gobuster dir -u http://IP -w /usr/share/wordlists/dirb/common.txt`. Apunta cada puerto, versión y carpeta encontrada. El 80 % del trabajo es mirar bien aquí.",
      "Fase 2, acceso inicial (foothold): busca la debilidad del servicio que encontraste (una versión vieja con fallo conocido, un panel con credenciales débiles, una subida de archivos). Usa la técnica que corresponda de lo que ya estudiaste. Cuando logres ejecutar comandos en la máquina, ya eres un usuario normal: lee `user.txt` con `cat`.",
      "Fase 3, reconocimiento interno: ya dentro, mira quién eres con `whoami` y `id`, y qué puedes hacer de más. Recuerda la **escalada de privilegios en Linux** que viste: revisa `sudo -l` (qué puedes ejecutar como administrador), busca archivos con permiso **setuid** con `find / -perm -4000 2>/dev/null`, y mira tareas y servicios.",
      "Fase 4, escalada: aprovecha lo que encontraste para pasar a **root** (el administrador de Linux) o **SYSTEM** (el de Windows). Si una herramienta te lo permite por configuración insegura, úsala solo para elevar privilegios en **esta** máquina.",
      "Fase 5, segunda flag: ya como root, lee `root.txt` (suele estar en `/root/root.txt`) con `cat` y envíala en **Submit Flag**.",
      "Escribe un informe por máquina con las 5 fases, una captura por fase y cuánto tardaste. Ese informe es exactamente lo que harás en un trabajo real. Pulsa **Stop Machine** al terminar."
    ], learn: "Una máquina completa = enumerar → acceso inicial (user.txt) → reconocimiento interno → escalada de privilegios → root.txt, documentando cada paso." }
  ],
  p4u04: [
    { t: "CTFtime: encontrar una competencia para principiantes", s: [
      "Abre ctftime.org. En el menú de arriba pulsa **Upcoming** (próximos): es el calendario de competencias de todo el mundo, con la fecha y la hora en **UTC** (República Dominicana es UTC−4: a las 20:00 UTC son las 16:00 aquí).",
      "Cada fila trae un icono de formato. Busca los de tipo **Jeopardy**: son como picoCTF, retos sueltos por categorías (web, cripto, forense...) que resuelves para ganar puntos. Evita por ahora los **Attack-Defense**, que son de equipos que atacan y defienden a la vez: son más avanzados.",
      "Fíjate en el **Weight** (peso) del evento: es cuánto valora CTFtime esa competencia. Para empezar, elige eventos de peso bajo o con la etiqueta de principiantes; la dificultad será más amable.",
      "Abre un evento que te cuadre de fecha. Lee su descripción y pulsa el enlace a su web oficial para registrarte allí (CTFtime solo es el calendario; el juego ocurre en la web del evento).",
      "Apunta la fecha de inicio y fin en tu calendario con la hora ya pasada a tu zona. Muchos duran 24 o 48 horas seguidas: no tienes que jugar todo ese tiempo.",
      "Nota: picoCTF celebra su competencia cada primavera. La edición 2026 fue del 9 al 19 de marzo; la de 2027 aún no está anunciada, así que revisa picoctf.org cada cierto tiempo. Mientras tanto, su biblioteca de retos sigue abierta para practicar."
    ], learn: "CTFtime > Upcoming lista competencias; para empezar elige formato Jeopardy y peso bajo, y te registras en la web oficial del evento." },
    { t: "Unirte a un equipo o crear el tuyo en CTFtime", s: [
      "Crea tu cuenta en CTFtime: arriba a la derecha **Sign in** → **Register**. Confirma el correo y entra.",
      "Para **crear** un equipo (por ejemplo el de tu universidad): menú **Teams** → **Create new team**. Ponle nombre y país. Al crearlo, en tu perfil aparece tu equipo con un **Invitation code** (código de invitación): Profile → Your teams → Edit your team. Comparte ese código solo con tus compañeros.",
      "Para **unirte** a un equipo que ya existe: entra en la página del equipo y envía una **membership request** (solicitud) desde el formulario de tu Profile; un miembro la aprueba, o te pasa el **Invitation code** para que te unas directo.",
      "¿No tienes equipo todavía? En **Teams** → **Get team members** hay un buscador para encontrar gente que busca compañeros. También sirven comunidades de Discord de CTF para principiantes.",
      "Antes del evento, repartíos las categorías: tú coges la que más dominas (por ejemplo web o general skills) y cada quien otra. Así trabaja un equipo real.",
      "Cuando el evento **haya terminado** (nunca antes, para no dar pistas a rivales), escribe un writeup de al menos un reto que resolvieras y súbelo a tu portafolio de GitHub."
    ], learn: "En CTFtime creas un equipo (y repartes su Invitation code) o te unes a uno con una solicitud; cada miembro se especializa en una categoría." }
  ],
  p4u05: [
    { t: "Leer el alcance y las reglas de un programa en HackerOne", s: [
      "Entra en hackerone.com. Lo nuevo aquí no es Hacktivity (ya lo viste), sino aprender a leer **a quién** se le permite probar **qué**. Ve al buscador de programas (**Opportunity Discovery** / Directory).",
      "Puedes filtrar por **program type** (tipo de programa). Fíjate en dos: **Bug bounty** (paga por fallos válidos) y **VDP**, siglas de «Vulnerability Disclosure Program» (programa de divulgación de vulnerabilidades): **no paga**, pero acepta y arregla lo que reportas. Para empezar, los **VDP** son ideales porque sus reglas suelen ser más abiertas y relajadas.",
      "Abre un programa y busca su página de seguridad. Lee la parte de **Scope** (alcance): es la lista de lo que puedes tocar. Suele estar dividida en **In scope** (dentro del alcance: permitido) y **Out of scope** (fuera: prohibido). Cada activo dice si además es **Eligible for bounty** (si pagan por fallos ahí).",
      "Lee ahora las reglas (la **Policy** o política). Apunta en tu cuaderno qué técnicas están **siempre prohibidas**: casi todos prohíben ataques de denegación de servicio (tumbar el servicio), spam, ingeniería social a empleados y tocar datos de otros usuarios reales.",
      "Haz esto con **tres** programas distintos y compara. Verás que se repiten las mismas reglas de oro. Esa es la base de la divulgación responsable: el fallo se avisa **en privado** a la empresa y no se publica hasta que lo arreglan.",
      "Regla absoluta: si algo **no** está claramente **In scope**, no lo toques. Probar fuera del alcance no es bug bounty: es acceso no autorizado, y es ilegal aunque el programa exista."
    ], learn: "En HackerOne, un VDP no paga pero es bueno para empezar; solo se prueba lo que está In scope, respetando la Policy; fuera de ahí es ilegal." }
  ],
  p4u06: [
    { t: "Aprender de 10 informes públicos (método de lectura)", s: [
      "En hackerone.com ve a **Hacktivity** (la lista de informes que las empresas dejaron hacer públicos). Arriba hay filtros: filtra por **weakness** (tipo de debilidad) y elige uno que ya conozcas, como IDOR, XSS o control de acceso. Así lees fallos que entiendes.",
      "Abre un informe con estado **Disclosed** (divulgado). Léelo entero con esta plantilla en tu cuaderno: (1) **tipo** de fallo, (2) **cómo lo encontró** la persona (qué miró, qué herramienta), (3) **cómo demostró el impacto** sin causar daño, (4) qué **recompensa** o reconocimiento recibió.",
      "Fíjate en el apartado de **Timeline** (línea de tiempo): verás cuánto tardó la empresa en responder y arreglar. Eso te enseña cómo es el proceso real.",
      "Mira cómo está **escrito** el informe: título claro, pasos numerados para reproducir el fallo, una prueba (captura o vídeo) y el impacto explicado para alguien que no es técnico. Los mejores informes convencen en 30 segundos.",
      "Repite con **10 informes** de los tipos que conoces. Guarda la tabla de los 10 en tu cuaderno.",
      "Al final escribe una conclusión: qué hacen los mejores informes que los peores no hacen. Eso es lo que copiarás cuando escribas el tuyo."
    ], learn: "Leer 10 informes Disclosed de un tipo que ya conoces te enseña cómo piensan, cómo prueban el impacto sin dañar y cómo escriben un buen reporte." }
  ],
  p4u07: [
    { t: "Tu primer programa, dentro del alcance y dentro de la ley", s: [
      "Antes de tocar nada, lo legal. En República Dominicana rige la **Ley 53-07** sobre crímenes y delitos de alta tecnología. Su **Artículo 6** castiga el **acceso ilícito** a un sistema (entrar o pasarte de tu autorización) con **3 meses a 1 año de prisión** y multa; sube a 1–3 años si alteras o divulgas datos. Su **Artículo 8** castiga poseer o usar herramientas para delinquir. Un programa de bug bounty es tu **permiso por escrito** para probar: solo te cubre **dentro** de su Scope y sus reglas. Fuera de ahí, cometes el delito del Artículo 6. (Nota: hay un nuevo Código Penal, Ley 74-25, que entra en vigor en agosto de 2026 y endurece estas penas; la idea es la misma: sin permiso, es delito.)",
      "Elige en HackerOne un programa con alcance **amplio** y reglas claras, idealmente un **VDP**. Copia su **Scope** completo (In scope y Out of scope) y su Policy en tu cuaderno antes de probar nada. Léelo **dos veces**.",
      "Confirma que los activos que vas a tocar están **In scope**. Si un subdominio o una app no aparece, está fuera: no la toques.",
      "Elige **un solo** tipo de fallo que domines (por ejemplo IDOR o control de acceso) y céntrate en él en varios bloques de trabajo. No esperes dinero al principio: lo normal es tardar en encontrar el primero válido.",
      "Prueba siempre con suavidad: una sola cuenta de prueba, sin automatizar ataques masivos, sin tocar datos de usuarios reales y sin repetir algo que pueda tumbar el servicio. Si dudas de si algo está permitido, **no lo hagas** y pregunta al programa por su canal oficial.",
      "Si encuentras algo, escríbelo con la estructura que estudiaste en los 10 informes. Si no encuentras nada, no es un fracaso: anota lo que aprendiste del objetivo. Nunca publiques el fallo por tu cuenta: se queda entre tú y la empresa hasta que lo arreglen."
    ], learn: "El permiso del programa (su Scope) es lo único que te separa del delito del Art. 6 de la Ley 53-07; se prueba un solo tipo de fallo, con suavidad y sin salir del alcance." }
  ],
  p4u08: [
    { t: "Tu primer script útil: generar la plantilla de un writeup", s: [
      "Vas a escribir una herramienta que te ahorre tiempo real: cada vez que empiezas una máquina, te crea una carpeta con la plantilla del informe ya con la fecha y el nombre. Abre **IDLE** (tecla Windows → `IDLE`) → **File → New File**.",
      "Escribe la primera línea: `import os` y debajo `from datetime import date`. `import` trae módulos ya hechos de Python: `os` sirve para crear carpetas y archivos; `datetime` para la fecha de hoy. No instalas nada: vienen con Python.",
      "Pide el nombre de la máquina: `maquina = input('Nombre de la maquina: ')`. `input()` muestra ese texto, espera a que escribas y guarda lo que pongas en la variable `maquina`.",
      "Calcula la fecha de hoy: `hoy = date.today()`. Guarda la fecha actual en `hoy` (saldrá como `2026-11-08`).",
      "Crea la carpeta: `os.makedirs(maquina, exist_ok=True)`. `makedirs` crea una carpeta con el nombre de la máquina; `exist_ok=True` evita el error si ya existe.",
      "Prepara el texto de la plantilla con una cadena de varias líneas entre tres comillas: `plantilla = f'''# Writeup: {maquina}\\nFecha: {hoy}\\n\\n## Enumeracion\\n\\n## Acceso inicial\\n\\n## Escalada\\n\\n## Como se defiende\\n'''`. La `f` antes de las comillas permite meter `{maquina}` y `{hoy}` dentro del texto; `\\n` es un salto de línea.",
      "Escribe el archivo dentro de la carpeta: `ruta = os.path.join(maquina, 'writeup.md')` une la carpeta y el nombre del archivo, y luego `with open(ruta, 'w') as f: f.write(plantilla)` abre el archivo en modo escritura (`'w'`) y vuelca la plantilla. El `with` cierra el archivo solo al terminar.",
      "Avisa de que terminó: `print(f'Listo: {ruta}')`. Guarda con **Ctrl + S** como `nuevo_writeup.py` en tu carpeta `Cuaderno-hacker` y ejecútalo con **F5**. Escribe un nombre de máquina y comprueba que aparece la carpeta con el `writeup.md` dentro, ya fechado.",
      "Mejora tú una cosa: por ejemplo, que al principio del archivo haya un comentario con instrucciones de uso (`# Uso: ejecutar y escribir el nombre de la maquina`). Súbelo a tu portafolio: es código tuyo."
    ], learn: "Con `input`, `os.makedirs`, `open(...,'w')` y `datetime` automatizas una tarea repetitiva; las f-strings (`f'...{variable}...'`) meten datos dentro del texto." }
  ],
  p4u09: [
    { t: "Qué es git y GitHub, y tu portafolio desde la web (sin instalar nada)", s: [
      "**git** es un programa que guarda el historial de tus archivos: cada vez que guardas un cambio (un «commit»), git recuerda qué cambió y cuándo, para que puedas volver atrás. **GitHub** es una web donde subes esos proyectos para enseñarlos y guardarlos en la nube. La unidad usa git, pero puedes hacer todo **desde la web de GitHub**, sin instalar git en la laptop.",
      "La guía de plataforma de GitHub ya te explica crear la cuenta y el repositorio `portafolio` con su README. Aquí vas a dejarlo profesional. Primero, un **README de perfil**: crea un repositorio **con el mismo nombre que tu usuario** (si tu usuario es `juanp`, el repo se llama `juanp`), márcalo **Public** y **Add a README file**. Ese README especial se muestra en tu página de perfil para quien te busque.",
      "Edita ese README con el **lápiz** ✏ (**Edit**). Pon quién eres, qué estás aprendiendo (redes, Linux, web), tus logros (picoCTF, TryHackMe, máquinas de HTB) y un enlace a tu repo `portafolio`. Guarda con **Commit changes** → **Commit changes**. Cada «commit» es una foto guardada de tu trabajo.",
      "En tu repo `portafolio`, organiza por carpetas. Para crear una carpeta y un archivo a la vez: **Add file → Create new file** y en el nombre escribe `scripts/nuevo_writeup.py`: la barra `/` crea la carpeta `scripts`. Pega tu script y **Commit changes**.",
      "Sube tus writeups **permitidos** (de máquinas retiradas o retos cuyas reglas lo permitan) igual: **Add file → Create new file**, nombre `writeups/nombre-del-reto.md`, escribe y **Commit changes**. Nunca subas soluciones de máquinas activas ni nada de un bug bounty sin permiso de la empresa.",
      "Para subir un archivo que ya tienes en la laptop (una imagen, un .py): **Add file → Upload files**, arrástralo y **Commit changes**. Con esto manejas todo tu portafolio sin instalar nada."

    { t: "Opción avanzada: GitHub Desktop en Windows", s: [
      "Si prefieres trabajar con tus archivos en la laptop y subirlos de golpe, instala **GitHub Desktop**: entra en desktop.github.com, pulsa **Download for Windows**, abre el instalador y, al abrir el programa, inicia sesión con tu cuenta de GitHub (**Sign in to GitHub.com**).",
      "Trae tu repositorio a la laptop: **File → Clone repository** («clonar» = descargar una copia enlazada con GitHub). Elige `portafolio` de la lista, elige una carpeta local y pulsa **Clone**. Ahora tienes esa carpeta en tu disco.",
      "Trabaja normal: crea o edita archivos dentro de esa carpeta con el Explorador de Windows o IDLE. GitHub Desktop detecta los cambios solos y los muestra en la pestaña **Changes** (cambios), a la izquierda.",
      "Para guardar ese paquete de cambios: abajo a la izquierda escribe un **Summary** (resumen corto, por ejemplo «agrego script de writeups») y pulsa **Commit to main**. Eso crea el commit en tu copia local.",
      "Para subirlo a la web pulsa **Push origin** (arriba). «Push» envía tus commits a GitHub. Recarga tu repo en github.com y verás los cambios ahí.",
      "Si editaste algo en la web, antes de trabajar pulsa **Fetch origin** → **Pull origin** para traer esos cambios a tu laptop y no pisarlos. Regla: primero **Pull**, luego trabajas, luego **Commit** y **Push**."
    ], learn: "GitHub Desktop: Clone trae el repo, Commit to main guarda un paquete de cambios local y Push origin lo sube; Pull trae lo que cambiaste en la web." }

  p4u10: [
    { t: "Tu CV de seguridad en una página", s: [
      "Un CV de seguridad convence con **evidencias**, no con adjetivos. Escríbelo en **una sola página**. Puedes usar un documento normal (Word o Google Docs) y exportarlo a PDF, que es como se envía.",
      "Orden de arriba a abajo: (1) **Nombre y titular** (por ejemplo «Estudiante de ciberseguridad · eJPT»); (2) **Contacto**: correo profesional, enlace a tu GitHub y a tu LinkedIn; (3) **Resumen** de 2 líneas de quién eres y qué buscas.",
      "Luego la sección más importante: **Proyectos y práctica**. Lista con viñetas: «Resolví N máquinas en Hack The Box (Starting Point)», «Completé la ruta Pre Security y SOC de TryHackMe», «Participé en el CTF X con el equipo Y», «Scripts en Python en mi GitHub». Cada línea enlaza a la prueba.",
      "Después **Certificaciones** (eJPT cuando la tengas), **Formación** (tu universidad) e **Idiomas** (inglés: tu gran ventaja, ponlo como «avanzado»).",
      "Habilidades: una línea con herramientas que de verdad usaste: Linux, nmap, Burp Suite, Wireshark, Python, SQL. No pongas nada que no sepas defender en una entrevista.",
      "Guárdalo como PDF con un nombre claro: `CV-TuNombre-Ciberseguridad.pdf`. Revisa que no haya faltas y que todo quepa en una página."
    ], learn: "El CV de seguridad vive de evidencias enlazadas (HTB, TryHackMe, CTF, GitHub), cabe en una página y se envía en PDF; el inglés es tu diferencial." },
    { t: "LinkedIn y buscar tu primera pasantía", s: [
      "La guía de plataforma de LinkedIn te explica editar el perfil y buscar empleo. Aquí lo afinas. **Titular**: ponlo orientado a lo que quieres, por ejemplo «Estudiante de ciberseguridad · TryHackMe · Hack The Box · busca pasantía».",
      "**Acerca de / Información**: 3–4 líneas en primera persona con lo que aprendes y el enlace a tu portafolio de GitHub. En **Destacado** (Featured) ancla tu GitHub y tu mejor writeup.",
      "Rellena **Proyectos** y **Licencias y certificaciones** con lo mismo que pusiste en el CV, para que coincidan.",
      "Para buscar: pestaña **Empleos** → escribe `pasante ciberseguridad` o `security intern` → filtros **Ubicación** (tu país o Remoto) y **Nivel de experiencia: Prácticas** y **Sin experiencia**. Pulsa **Guardar** en las que te interesen.",
      "Haz una lista de **10 empresas** donde te gustaría entrar. En seguridad suelen contratar pasantes los **bancos**, las **telecomunicaciones**, las **consultoras** y el **gobierno**. Pregunta también en la bolsa de empleo de tu universidad.",
      "Conéctate con personas que trabajen en esas empresas con una nota corta y educada. No pidas trabajo de golpe: pregunta por su camino. Comparte cada semana algo que aprendiste; eso te hace visible."
    ], learn: "LinkedIn con titular orientado a pasantía, portafolio enlazado y perfil que coincide con el CV; busca con filtros Prácticas/Sin experiencia y haz una lista de 10 empresas." }

  p4u11: [
    { t: "Prepararte para trabajo remoto en dólares (plataformas verificadas)", s: [
      "Tu inglés avanzado es tu mayor ventaja para trabajar remoto para empresas de fuera. Prepara tres cosas: entrevistas técnicas **en inglés**, un portafolio sólido y referencias.",
      "Practica la entrevista: **graba un vídeo de 5 minutos en inglés** explicando en voz alta una máquina que resolviste (qué enumeraste, cómo entraste, cómo escalaste). Escúchate y repítelo hasta que fluya. Esto es justo lo que te pedirán.",
      "Busca ofertas remotas en plataformas que de verdad contratan desde Latinoamérica: **Get on Board** (getonbrd.com, muy usado en Latinoamérica, filtra por «Remote»), **Working Nomads** (workingnomads.com, tiene sección de ciberseguridad para Latam), **Torre** (torre.ai), **We Work Remotely** (weworkremotely.com) y **Remotive** (remotive.com). Busca `junior security analyst`, `SOC analyst` o `junior penetration tester` y fíjate en las que digan «Remote (Latin America)» o «Remote (Worldwide)».",
      "Guarda **10 ofertas** de nivel de entrada y haz una tabla con los requisitos que se repiten (certificaciones, herramientas, años). Eso te dice exactamente qué estudiar después.",

      "Cuidado con las **estafas**: una oferta legítima **nunca** te pide pagar para empezar, ni comprar equipo por adelantado, ni tus datos bancarios antes de firmar un contrato. Si piden dinero o van con prisa rara, es estafa. Desconfía también de ofertas solo por chat sin videollamada."
    ], learn: "Prepara una explicación en inglés grabada y un portafolio; busca en Get on Board, Working Nomads, Torre, We Work Remotely y Remotive filtrando «Remote Latin America»; ninguna oferta real te cobra por empezar." }

  p4u12: [
    { t: "El camino a la OSCP (PEN-200): precio, formato y requisitos hoy", s: [
      "La guía de plataforma de OffSec te explica revisar el temario. Aquí van los datos actuales (offsec.com, 2026) para que decidas con cifras reales. La **OSCP** es de las certificaciones de hacking ético más valoradas; su curso es el **PEN-200**.",
      "**Precio** (offsec.com): el paquete **Course + Cert Bundle** (90 días de acceso al curso, laboratorios y **un** intento de examen) cuesta **1,749 USD**. La suscripción **Learn One** (1 año de acceso y **dos** intentos) ronda los **2,199 USD/año**. Es cara: trátala como una meta a meses vista, no para ya.",
      "**Formato del examen**: es práctico y a distancia, **vigilado** («proctored») por videollamada. Tienes **23 horas y 45 minutos** para atacar y **otras 24 horas** para entregar el **informe**. Hay **3 máquinas sueltas** (20 puntos cada una) y **1 conjunto de Active Directory** de 3 máquinas (40 puntos). Necesitas **70 de 100 puntos** para aprobar. El informe cuenta: si no lo entregas bien, no apruebas aunque hackees todo.",

      "Si la OSCP te queda lejos o cara ahora, hay rutas con un **siguiente paso concreto más barato**: para **SOC/defensa**, haz la ruta **SOC Level 1** de TryHackMe y apunta a la certificación **BTL1**; para **AppSec/web**, prepara el **Burp Suite Certified Practitioner (BSCP)** de PortSwigger (unos **99 USD**) con la Web Security Academy que ya usas; para **cloud**, empieza por el **AWS Certified Cloud Practitioner (CLF-C02)** (unos **100 USD**) y practica gratis con el laboratorio flaws.cloud.",
      "Escribe tu **plan de 12 meses**: especialidad elegida (y por qué), la certificación objetivo, los proyectos que harás y tu meta de ingresos. Compártelo conmigo para revisarlo."

P5.push(
  { id:"p5blue01", track:"blue", mod:"SOC", lvl:4, blocks:3,
    title:"Del SOC nivel 1 al nivel 2: triaje de alertas",
    goal:"Entender qué hace cada nivel de un SOC y triar alertas con un método repetible, en la ruta SOC Level 1 y en el simulador.",
    links:[
      ["Ruta «SOC Level 1» (TryHackMe)","https://tryhackme.com/path/outline/soclevel1"],
      ["Sala «SOC L1 Alert Triage»","https://tryhackme.com/room/socl1alerttriage"],
      ["Sala «SOC L1 Alert Reporting»","https://tryhackme.com/room/socl1alertreporting"],
      ["SOC Simulator (TryHackMe)","https://tryhackme.com/soc-sim"],
      ["Sala «SOC L2 Alert Triage»","https://tryhackme.com/room/socl2alerttriage"]
    ],
    concept:[
      "En un SOC el **analista L1** (nivel 1) recibe la cola de alertas, hace el **triaje** (triage: clasificar rápido) y decide si la cierra o la **escala** (la pasa al nivel siguiente). El **analista L2** investiga a fondo lo escalado, contiene el incidente y ajusta las reglas que hacen ruido.",
      "Cada alerta termina con un veredicto: **verdadero positivo** (ataque real), **falso positivo** (la regla se equivocó) o **verdadero positivo benigno** (la regla acertó, pero era actividad autorizada, como un escaneo del propio equipo de IT). La prioridad sale de cruzar la **gravedad** de la alerta con lo **crítico** del equipo afectado.",
      "Un buen triaje responde siempre lo mismo: qué pasó, en qué equipo, con qué usuario, cuándo, y qué ocurrió justo antes y después. Lo que no está escrito en el ticket no existe: tu nota debe permitir que otra persona repita tu razonamiento.",
      "La ruta **SOC Level 1** de TryHackMe (14 módulos, renovada en noviembre de 2025) es la columna de esta especialidad. Casi todas sus salas son **Premium** (de pago: unos €126 al año). En la Fase 3 ya hiciste «SOC Fundamentals»; ahora pasas a la práctica real."
    ],
    flow:[
      "Lee la alerta completa: regla, equipo, usuario y hora.",
      "Busca contexto: ¿qué hizo ese equipo o usuario antes y después?",
      "Decide: verdadero positivo, falso positivo o benigno, con la evidencia que lo prueba.",
      "Escribe la nota del ticket y escala si hace falta."
    ],
    steps:[
      "Activa TryHackMe Premium y pulsa «Enroll in path» en la ruta SOC Level 1.",
      "Completa los módulos «Blue Team Introduction» y «SOC Team Internals», incluidas «SOC L1 Alert Triage» y «SOC L1 Alert Reporting».",
      "Resuelve un escenario fácil del SOC Simulator con un informe por alerta.",
      "Haz la sala «SOC L2 Alert Triage» para ver qué cambia en el nivel 2.",
      "Crea tu plantilla de nota de triaje: la usarás hasta el proyecto final."
    ],
    hint:"Si dudas entre verdadero y falso positivo, pregúntate qué evidencia concreta te haría cambiar de opinión, y ve a buscarla.",
    quiz:[
      {q:"Salta una alerta de «escaneo de puertos» por el escáner de vulnerabilidades que IT lanza cada lunes con permiso. ¿Cómo la clasificas?",
       o:["Falso positivo","Verdadero positivo que hay que escalar ya","Verdadero positivo benigno: la regla acertó, pero la actividad está autorizada","Falso negativo"],a:2,
       e:"La regla detectó bien un escaneo real, así que no es un falso positivo. Pero la actividad está autorizada: se documenta y se puede proponer una excepción para ese escáner."},
      {q:"¿Qué hace normalmente un analista L2 que no hace un L1?",
       o:["Leer la cola de alertas","Investigar a fondo lo escalado, contener el incidente y ajustar reglas","Cerrar falsos positivos","Abrir tickets"],a:1,
       e:"El L1 clasifica y escala. El L2 profundiza, contiene y mejora la detección para que el L1 reciba menos ruido."},
      {q:"Llegan a la vez dos alertas de igual gravedad: una en la laptop de un pasante y otra en el controlador de dominio. ¿Cuál atiendes primero?",
       o:["La del controlador de dominio, porque ese equipo es más crítico","La del pasante, porque llegó antes en la lista","Da igual, tienen la misma gravedad","Ninguna hasta que lleguen más alertas"],a:0,
       e:"La prioridad combina gravedad y criticidad. El controlador de dominio (el servidor que gestiona todas las cuentas de la empresa) comprometido afecta a toda la organización."}
    ],
    cards:[
      ["¿Qué es el triaje de alertas?","Clasificar rápido cada alerta (real, error o autorizada) y decidir si se cierra o se escala."],
      ["Verdadero positivo benigno","La regla acertó, pero la actividad era legítima y autorizada."],
      ["¿Qué decide la prioridad de una alerta?","Su gravedad cruzada con lo crítico del equipo o usuario afectado."]
    ],
    keys:["El L1 tría y escala; el L2 investiga, contiene y mejora las reglas.","Cada decisión de triaje lleva su evidencia escrita en el ticket."] },

  { id:"p5blue02", track:"blue", mod:"Logs", lvl:4, blocks:3,
    title:"Registros de Windows, Sysmon y Linux",
    goal:"Saber qué evento deja cada acción importante en Windows y Linux, y generar y leer esos eventos en tu propia laptop.",
    links:[
      ["Sala «Windows Logging for SOC»","https://tryhackme.com/room/windowsloggingforsoc"],
      ["Sala «Linux Logging for SOC»","https://tryhackme.com/room/linuxloggingforsoc"],
      ["Sysmon (Microsoft Sysinternals)","https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon"],
      ["Configuración sysmon-config (SwiftOnSecurity)","https://github.com/SwiftOnSecurity/sysmon-config"],
      ["Microsoft: «Appendix L: Events to monitor»","https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/appendix-l--events-to-monitor"]
    ],
    concept:[
      "Un **log** (registro) es la memoria del sistema. En Windows se ven en el **Visor de eventos** y cada evento tiene un **Event ID** (número de evento). Los que más usarás: **4624** inicio de sesión correcto, **4625** fallido, **4672** sesión con privilegios de administrador, **4688** proceso creado, **4720** cuenta creada, **4732** usuario añadido a un grupo local, **1102** registro de auditoría borrado y, en el log System, **7045** servicio instalado.",
      "En el 4624 y el 4625 mira el **Logon Type** (tipo de inicio de sesión): 2 es en el teclado, 3 por red (por ejemplo, una carpeta compartida) y 10 por escritorio remoto (RDP). Cientos de 4625 seguidos y luego un 4624 desde la misma IP es el dibujo típico de una fuerza bruta que acertó.",
      "**Sysmon** (de Microsoft Sysinternals) registra lo que Windows no guarda bien: **ID 1** proceso creado con su línea de comandos completa y su hash, **3** conexión de red, **11** archivo creado, **13** valor del registro modificado y **22** consulta DNS. Necesita un archivo de configuración que decida qué guardar; sin él, mete mucho ruido.",
      "En Linux los inicios de sesión y el uso de `sudo` van a `/var/log/auth.log` (Debian, Ubuntu, Kali) o al diario de **systemd**, que se lee con `journalctl`. PowerShell también deja rastro: el evento **4104** guarda el texto de los scripts ejecutados."
    ],
    flow:[
      "Pregúntate: ¿qué acción del atacante quiero ver?",
      "Elige la fuente: Security, System, Sysmon o auth.log.",
      "Filtra por Event ID y por rango de horas.",
      "Lee los campos clave: usuario, equipo, proceso e IP."
    ],
    steps:[
      "Haz la sala «Windows Logging for SOC».",
      "Genera un 4625 en tu laptop y encuéntralo en el Visor de eventos y con PowerShell.",
      "Instala Sysmon con la configuración de SwiftOnSecurity y encuentra tus eventos 1 y 22.",
      "Haz la sala «Linux Logging for SOC» y lee tus intentos de `sudo` en Kali.",
      "Crea una tarjeta por cada Event ID de esta unidad."
    ],
    hint:"No memorices 50 IDs: domina estos 10 y aprende a buscar el resto en la tabla de Microsoft (enlace 5).",
    quiz:[
      {q:"Ves 300 eventos 4625 en 5 minutos desde la IP 203.0.113.7 y luego un 4624 con Logon Type 10 desde la misma IP. ¿Qué es lo más probable?",
       o:["Un usuario que olvidó su contraseña","Una fuerza bruta por escritorio remoto (RDP) que consiguió entrar","Una actualización de Windows","Un escaneo de puertos sin éxito"],a:1,
       e:"Muchos fallos seguidos desde una IP y luego un éxito de tipo 10 es una fuerza bruta exitosa por RDP. Hay que escalar ya."},
      {q:"¿Qué evento de Sysmon te da la línea de comandos completa de un programa que se ejecutó?",
       o:["ID 3","ID 22","ID 13","ID 1"],a:3,
       e:"El ID 1 (creación de proceso) guarda la línea de comandos, el proceso padre y el hash del ejecutable."},
      {q:"Aparece un evento 1102 a las 3:00 de la madrugada en un servidor. ¿Por qué preocupa?",
       o:["Porque alguien borró el registro de auditoría, algo que hacen los atacantes para tapar huellas","Porque el servidor se reinició","Porque hubo un inicio de sesión fallido","Porque se instaló un servicio"],a:0,
       e:"Microsoft lo clasifica de criticidad media a alta: un borrado del log sin explicación se investiga siempre."}
    ],
    cards:[
      ["Event ID 4625","Inicio de sesión fallido (log Security)."],
      ["Logon Type 10","Inicio de sesión por escritorio remoto (RDP)."],
      ["Sysmon ID 1 y 3","1 = proceso creado con línea de comandos; 3 = conexión de red."],
      ["¿Dónde se ven los usos de sudo en Linux?","En /var/log/auth.log o con journalctl (el diario de systemd)."]
    ],
    keys:["4624/4625 más el Logon Type cuentan quién entró y cómo.","Sysmon da la línea de comandos, la red y el DNS de cada proceso."] },

  { id:"p5blue03", track:"blue", mod:"SIEM", lvl:4, blocks:3,
    title:"SIEM práctico: Splunk y el lenguaje SPL",
    goal:"Buscar, contar y correlacionar eventos en Splunk con SPL, primero en TryHackMe y luego con tus propios registros.",

      ["Sala «Alert Triage With Splunk»","https://tryhackme.com/room/alerttriagewithsplunk"],
      ["Descargar Splunk Enterprise (prueba de 60 días y luego Free)","https://www.splunk.com/en_us/download/splunk-enterprise.html"],

    ],
    concept:[
      "Un **SIEM** (gestión de información y eventos de seguridad) junta los registros de todas las máquinas en un solo sitio para buscarlos y crear alertas. **Splunk** es de los más usados en empresas; **Elastic** es su gran alternativa.",
      "**SPL** (el lenguaje de búsqueda de Splunk) funciona como las tuberías de Linux: primero filtras y luego pasas el resultado a comandos con `|`. Ejemplo: `index=main EventCode=4625 | stats count by Account_Name | sort -count` busca fallos de inicio de sesión, los cuenta por cuenta de usuario y los ordena de mayor a menor.",
      "Comandos clave: `stats` (contar y agrupar), `table` (elegir columnas), `sort`, `where` (filtrar por un cálculo, como `where count > 10`), `timechart` (gráfica en el tiempo) y `top`/`rare` (lo más y lo menos frecuente). Limita siempre el **rango de tiempo** en el selector: buscar en «All time» es lento y ruidoso.",
      "**Boss of the SOC (BOTS)** es la competición de Splunk; sus datos (v1, v2 y v3) son públicos y gratis en GitHub, y TryHackMe los usa en sus salas. En Elastic se busca con **KQL**: `event.code : 4625` equivale a `EventCode=4625`. Cambia la sintaxis, no el método."
    ],
    flow:[
      "Elige índice y rango de tiempo.",
      "Filtra con campo=valor hasta quedarte con pocos eventos.",
      "Agrupa con stats para ver patrones.",
      "Pivota: toma un valor raro y búscalo solo."
    ],
    steps:[

      "Haz «Splunk 2» y resuelve sin soluciones la serie de preguntas 100.",
      "Instala Splunk en tu laptop e indexa tus logs Security, System y Sysmon.",
      "Escribe 5 búsquedas SPL propias y guárdalas con lo que responde cada una.",
      "Termina con «Alert Triage With Splunk»."
    ],
    hint:"Si una búsqueda no devuelve nada, quita filtros de uno en uno hasta que aparezcan eventos; luego mira en la barra lateral cómo se llama el campo de verdad.",
    quiz:[
      {q:"¿Qué hace `index=main EventCode=4625 | stats count by src_ip | where count > 20`?",
       o:["Muestra los 20 primeros fallos","Lista las IP de origen con más de 20 inicios de sesión fallidos","Borra los eventos con más de 20 fallos","Cuenta todos los eventos del índice"],a:1,
       e:"Filtra los 4625, cuenta por IP de origen y se queda con las que superan 20: candidatas a fuerza bruta."},
      {q:"Tu búsqueda tarda muchísimo y trae millones de eventos. ¿Qué corriges primero?",

      {q:"¿Qué comando SPL muestra los valores menos frecuentes de un campo, donde suelen esconderse las rarezas?",
       o:["`rare`","`top`","`table`","`sort -count`"],a:0,

    links:[
